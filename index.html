:root{
  --ink:#1d1c1a; --ink2:#262522; --ink3:#33312c; --line:#55524a;
  --hanji:#e7dec6; --hanji2:#c9bb96; --sumi:#1f1a14; --sumi2:#5a4f40;
  --fg:#ece6d6; --muted:#9b9587; --hi:#f4eedc;
  --seal:#b5341f; --seal2:#8c2616; --gold:#d0a23a; --plum:#8a5fc0;
  --p1:#c4412e; --p2:#2f64a8; --p3:#3d8a5c; --p4:#d6a21f;

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ink);color:var(--fg);font-family:var(--font-body);font-size:14px;overflow:hidden;
  touch-action:manipulation;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{position:fixed;top:0;right:0;bottom:0;left:0}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;padding:0}
button:focus-visible,input:focus-visible + .sw{outline:2px solid var(--hi);outline-offset:2px}
button:disabled{cursor:default}
.screen{position:fixed;top:0;right:0;bottom:0;left:0;padding:calc(env(safe-area-inset-top,0px) + 8px) var(--gut-r) calc(env(safe-area-inset-bottom,0px) + 8px) var(--gut-l)}

/* ---------- 타이틀 ---------- */
#title{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--ink)}
.title-inner{width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-block:14px 32px}
.brand{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding-top:4px}
.brand-row{display:flex;align-items:flex-end;justify-content:space-between;width:100%;gap:12px}
.sticks-deco{display:flex;gap:6px;height:44px;align-items:center}
.sticks-deco i{display:block;width:10px;height:44px;border-radius:5px;background:#5b3a20;border:2px solid #111}
.sticks-deco i.f{background:var(--hanji)}
.logo{font-family:var(--font-display);font-size:clamp(54px,17vw,92px);font-weight:400;margin:0;letter-spacing:-.02em;line-height:1;color:var(--hi)}
.seal{flex:none;width:64px;height:64px;display:flex;align-items:center;justify-content:center;background:var(--seal);color:#f6efdc;border-radius:3px;
  font-family:var(--font-display);font-size:44px;font-weight:400;transform:rotate(-5deg);margin-bottom:6px}
.tagline{margin:0;color:var(--muted);font-size:13px;letter-spacing:.02em}
.dan{height:4px;width:100%;background:var(--dan)}
.setup-card{display:flex;flex-direction:column;gap:10px;border-top:2px solid var(--fg);padding-top:10px}
.sc-note{margin:0;color:var(--muted);font-size:13px;line-height:1.5}
.sc-head{font-family:var(--font-display);font-size:17px;font-weight:400}
.seg{display:flex;border:1.5px solid var(--line);border-radius:3px;overflow:hidden}
.seg button{flex:1;min-height:44px;font-weight:700;color:var(--muted)}
.seg button + button{border-left:1.5px solid var(--line)}
.seg button.on{background:var(--hanji);color:var(--sumi)}
.slot{display:flex;align-items:center;gap:12px;min-height:52px}
.slot .sdot{width:20px;height:20px;border-radius:2px;flex:none}
.slot .sname{flex:1;font-weight:700;min-width:0}
.slot .sname small{display:block;color:var(--muted);font-weight:500;font-size:13px}
.slot .seg{flex:none;width:150px}
.switch-row{display:flex;align-items:center;gap:12px;min-height:50px;cursor:pointer}
.switch-row span{flex:1;min-width:0}
.switch-row b{display:block}
.switch-row small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
.switch-row input{position:absolute;opacity:0;pointer-events:none}
.switch-row .sw{flex:none;width:28px;height:28px;border:2px solid var(--muted);border-radius:3px;position:relative}
.switch-row input:checked + .sw{background:var(--seal);border-color:var(--seal)}
.switch-row input:checked + .sw::after{content:"";position:absolute;left:8px;top:2px;width:7px;height:14px;border:solid #f6efdc;border-width:0 3px 3px 0;transform:rotate(45deg)}
.start-btn{min-height:62px;border-radius:3px;background:var(--seal);color:#f6efdc;font-family:var(--font-display);font-size:24px;font-weight:400;letter-spacing:.3em;padding-left:.3em}
.start-btn:active{background:var(--seal2)}
.start-btn.resume{background:var(--hanji);color:var(--sumi);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding-block:8px}
.start-btn.resume small{font-family:var(--font-body);font-size:13px;letter-spacing:0;font-weight:700;color:var(--sumi2)}
.title-links{display:flex;gap:10px}
.title-links button{flex:1;min-height:48px;border-radius:3px;border:1.5px solid var(--line);font-weight:700}
.title-links button:active{background:var(--ink3)}
.credit{margin:0;color:var(--muted);font-size:13px;line-height:1.6}

/* ---------- 게임 화면 ---------- */
#game{display:grid;gap:6px;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;
  grid-template-areas:"top" "players" "stage" "controls";background:var(--ink)}
#topbar{grid-area:top;position:relative;display:flex;align-items:center;gap:6px;min-height:40px;min-width:0;padding-bottom:6px;margin-bottom:2px}
#topbar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:var(--dan)}
.rbox{display:flex;flex-direction:column;gap:3px;flex:none}
.rbox b{font-family:var(--font-display);font-size:19px;line-height:1;font-variant-numeric:tabular-nums}
.rgauge{display:flex;gap:2px}
.rgauge i{width:4px;height:6px;background:var(--ink3)}
.rgauge i.past{background:var(--muted)}
.rgauge i.aug{height:9px;margin-top:-1.5px;background:#6b5a2c}
.rgauge i.aug.past{background:var(--gold)}
.rgauge i.now{background:var(--hi)}
.turnlbl{flex:1;min-width:0;font-family:var(--font-display);font-weight:400;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:6px}
.turnlbl small{font-family:var(--font-body);font-size:13px;font-weight:600;color:var(--muted)}
.turnlbl i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.badge{flex:none;font-size:13px;font-weight:800;padding:4px 7px;border-radius:2px;letter-spacing:.06em}
.badge.chaos{background:var(--plum);color:#fff}
.ibtn{flex:none;min-width:44px;height:44px;border-radius:3px;border:1px solid var(--line);font-weight:700;font-size:13px;padding:0 6px}
.ibtn:active{background:var(--ink3)}
.ibtn.off{color:var(--muted);text-decoration:line-through}

#players{grid-area:players;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.pcard{position:relative;display:flex;flex-direction:column;justify-content:center;gap:2px;width:100%;min-width:0;min-height:44px;text-align:left;padding:5px 8px 5px 18px;
  border-bottom:1px solid var(--line);box-shadow:inset 6px 0 0 var(--pc);overflow:hidden}
.pcard.turn{background:var(--ink3);box-shadow:inset 12px 0 0 var(--pc)}
.pcard.out{opacity:.5}
.pc-top{display:flex;align-items:center;gap:5px;min-width:0}
.pc-top b{font-family:var(--font-display);font-size:14px}
.pc-top .who{font-size:13px;line-height:17px;color:var(--muted);border:1px solid var(--line);border-radius:2px;padding:0 4px}
.pc-top .rk{margin-left:auto;font-size:13px;font-weight:800;color:var(--gold);white-space:nowrap}
.waitdots{display:flex;gap:2px;margin-left:2px}
.waitdots i{width:8px;height:8px;border-radius:50%;background:var(--pc);outline:1px solid rgba(255,255,255,.4)}
.waitdots i.sp{border-radius:1px}
.pc-top .done{margin-left:auto;color:var(--fg);font-weight:700;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.pc-line{display:flex;align-items:center;gap:8px;min-width:0;overflow:hidden;white-space:nowrap}
.pc-line:empty{display:none}
.pc-stats{flex:none;font-size:13px;color:var(--fg);font-variant-numeric:tabular-nums}
.pc-stats .st{margin-right:7px}
.pc-stats .st b{font-weight:600;color:var(--muted);margin-right:2px}
.stamps{display:inline-flex;gap:1px;vertical-align:-1px}
.stamps i{font-style:normal;font-size:13px;line-height:17px;padding:0 2px;background:var(--ink3);color:var(--muted)}
.stamps i.on{background:var(--hanji);color:var(--sumi);font-weight:800}
.flystick{position:fixed;z-index:65;width:12px;height:78px;border-radius:6px;background:#5b3a20;border:2px solid #111;pointer-events:none}
.pc-augs{display:flex;gap:3px;overflow:hidden;white-space:nowrap}
.atag{flex:none;font-size:13px;line-height:19px;padding:0 5px;border-radius:2px;color:var(--fg);border:1px solid var(--line)}
.atag.used{opacity:.45}
.atag.dis{text-decoration:line-through;opacity:.45}
.atag.catd{border-style:dashed;color:var(--hanji2)}
.atag.more{border-color:transparent;color:var(--muted)}

#stage{grid-area:stage;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;min-width:0}
#board{display:block;touch-action:pinch-zoom;border-radius:6px}
#banner{position:absolute;left:8px;right:8px;top:6px;display:flex;align-items:center;gap:8px;background:var(--ink);border:2px solid var(--hi);
  border-radius:3px;padding:5px 5px 5px 12px;z-index:5;font-weight:700;font-size:13px}
#banner span{flex:1;min-width:0}
#banner button{flex:none;min-height:44px;padding:0 14px;border-radius:3px;border:1px solid var(--line)}
#sticks{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:6;pointer-events:none}
.sk-row{display:flex;gap:9px;align-items:center}
.stick{width:20px;height:104px;border-radius:8px;background:#5b3a20;border:2px solid #111;position:relative}
.stick.flat{background:var(--hanji)}
.stick.flat::before,.stick.flat::after{content:"";position:absolute;left:3px;right:3px;height:2px;background:var(--sumi2);transform:rotate(35deg)}
.stick.flat::before{top:30%}.stick.flat::after{top:62%}
.stick.mark .mk{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--seal)}
.stick.mark:not(.flat) .mk{display:none}
.chip small{font-size:13px;font-weight:700;opacity:.7}
.stick.toss{animation:toss .55s cubic-bezier(.3,.7,.4,1) both}
@keyframes toss{0%{transform:translateY(40px) rotate(0)}40%{transform:translateY(-70px) rotate(220deg)}100%{transform:translateY(0) rotate(var(--r,8deg))}}
.sk-res{font-family:var(--font-display);font-size:42px;font-weight:400;color:#f6efdc;background:var(--seal);padding:0 .45em;border-radius:3px;animation:pop .3s ease-out both}
@keyframes pop{0%{transform:scale(.5);opacity:0}100%{transform:scale(1);opacity:1}}

#controls{grid-area:controls;display:flex;flex-direction:column;gap:6px;min-width:0}
#controls > *{flex-shrink:0}
.ctl-row{display:flex;gap:8px;align-items:center;min-width:0}
#chips{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;align-items:center;min-height:48px;padding:3px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
#chips .hint{color:var(--muted);font-size:13px;white-space:nowrap}
.chip{flex:none;min-width:54px;height:44px;padding:0 10px;border-radius:3px;background:var(--hanji);color:var(--sumi);font-family:var(--font-display);font-weight:400;font-size:18px;border:2px solid #111}
.chip.neg{color:var(--seal2)}
.chip.sel{background:var(--seal);border-color:var(--seal);color:#f6efdc}
.chip:disabled{opacity:.55}
#throwBtn{flex:none;min-width:116px;height:56px;border-radius:3px;background:var(--seal);color:#f6efdc;font-family:var(--font-display);font-size:19px;font-weight:400;padding:0 10px}
#throwBtn:disabled{background:var(--ink3);color:var(--muted)}
#throwBtn:not(:disabled):active{background:var(--seal2)}
#homeRow{flex:1;min-width:0;display:flex;align-items:center;gap:8px;overflow-x:auto;min-height:50px;padding:5px 4px;scrollbar-width:none}
#homeRow::-webkit-scrollbar{display:none}
#homeRow .hl{font-size:13px;color:var(--muted);flex:none}
.token{flex:none;width:44px;height:44px;border-radius:50%;background:var(--pc);border:2px solid #111;outline:1.5px solid rgba(255,255,255,.5);
  font-family:var(--font-display);font-size:16px;font-weight:400;color:#fff;display:flex;align-items:center;justify-content:center}
.token:disabled{opacity:.3}
.token.go{outline:3px solid var(--hi);outline-offset:2px}
#endBtn{flex:none;min-height:44px;padding:0 14px;border-radius:3px;background:var(--hanji);color:var(--sumi);font-weight:800}
#actives{display:flex;flex-wrap:nowrap;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
#actives::-webkit-scrollbar{display:none}
#actives:empty{display:none}
.act{flex:none;white-space:nowrap;min-height:44px;padding:0 12px;border-radius:3px;border:1.5px solid var(--muted);font-weight:700;font-size:13px}
.act.turnuse{border-color:var(--seal);border-left-width:5px}
.act:active{background:var(--ink3)}
#ticker{display:block;width:100%;text-align:left;font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding:4px 2px 0;min-height:44px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

#side{display:none}
@media (min-aspect-ratio:5/4){
  #game{grid-template-columns:minmax(0,1fr) minmax(300px,420px);grid-template-rows:auto auto auto minmax(0,1fr);
    grid-template-areas:"stage top" "stage players" "stage controls" "stage side"}
  #controls{align-self:start}
}
@media (min-aspect-ratio:5/4) and (min-height:600px){
  /* 아이패드 가로: 오른쪽 패널 글씨를 키우고, 남는 아래쪽에 기록과 현재 차례 증강 설명 */
  #game{grid-template-columns:minmax(0,1fr) minmax(340px,440px)}
  .turnlbl{font-size:19px}
  .turnlbl small,.pc-top .done,.pc-stats,#chips .hint,#homeRow .hl{font-size:15px}
  .pc-top b{font-size:17px}
  .atag{font-size:14px;line-height:21px}
  .act{font-size:15px}
  .ibtn{font-size:15px}
  #ticker{display:none}
  #side{grid-area:side;display:flex;flex-direction:column;gap:12px;min-height:0;overflow-y:auto;overscroll-behavior:contain;border-top:1px solid var(--line);padding-top:8px}
  #side h3{font-family:var(--font-display);font-weight:400;font-size:17px;margin:0 0 6px}
  .sidelog{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:15px;line-height:1.45;color:var(--fg)}
  .sidelog li{padding-bottom:4px;border-bottom:1px solid var(--ink3)}
  .sidelog li:first-child{color:var(--hi);font-weight:700}
  #side .book-item p{font-size:15px}
  #side .book-item p.h{font-size:14px}
}
@media (max-aspect-ratio:5/4){
  /* 세로 화면: 판이 좌우 여백까지 써서 최대한 크게 */
  #stage{margin-inline:calc(4px - var(--gut-l)) calc(4px - var(--gut-r))}
}
@media (max-aspect-ratio:5/4) and (max-width:600px){
  /* 폰 세로: 플레이어 한 명을 한 줄로 */
  .pcard{flex-direction:row;align-items:center;justify-content:flex-start;gap:8px;padding-top:2px;padding-bottom:2px}
  .pcard .pc-top{flex:none}
  .pcard .pc-top .done{margin-left:6px}
  .pcard .pc-line{flex:1}
}
@media (max-height:760px) and (max-aspect-ratio:5/4){
  .pc-augs,#ticker{display:none}
  #throwBtn{height:48px}
  #chips{min-height:46px}
  /* 키가 작은 화면: 플레이어를 2열로 묶어 판에 세로 공간을 더 준다 */
  #players{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
  .pcard{flex-direction:column;align-items:stretch;justify-content:center;gap:0;padding:2px 6px 2px 14px;border-right:1px solid var(--line)}
  .pcard .pc-top .done{margin-left:auto}
  .pcard .pc-line{flex:none}
  .pc-top .who{display:none}
}
@media (max-height:500px){
  .pc-augs,#ticker{display:none}
  .pcard{padding-top:2px;padding-bottom:2px;gap:1px}
  #throwBtn{height:46px}
}

/* ---------- 모달 / 가림막 / 토스트 ---------- */
#modal,#info{position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;background:rgba(12,11,10,.82);display:flex;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 12px) var(--gut-r) calc(env(safe-area-inset-bottom,0px) + 12px) var(--gut-l)}
#info{z-index:56}
#modal.peek{background:rgba(12,11,10,.3);align-items:flex-end}
.mbox{width:100%;max-width:620px;max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--ink2);
  border:1px solid var(--line);border-radius:4px;padding:16px;display:flex;flex-direction:column;gap:12px;-webkit-user-select:text;user-select:text}
.mbox::before{content:"";flex:none;height:4px;margin:-16px -16px 0;background:var(--dan)}
#modal.peek .mbox{max-height:52%}
#modal.sheet{align-items:flex-end;background:rgba(12,11,10,.28);padding-bottom:0}
#modal.sheet .mbox{max-height:60%;border-radius:6px 6px 0 0;border-bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px);transition:transform .25s ease}
#modal.sheet.lowered{background:transparent;pointer-events:none}
#modal.sheet.lowered .mbox{transform:translateY(calc(100% - 80px - env(safe-area-inset-bottom,0px)));pointer-events:auto;overflow:hidden}
.sheet-head{display:flex;align-items:center;gap:10px}
.sheet-head .mtitle{flex:1;min-width:0}
.mbtn.peekbtn{flex:none;min-height:44px;padding:0 14px;align-items:center}
#modal.sheet .augcards{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:10px;padding-bottom:4px;-webkit-overflow-scrolling:touch}
#modal.sheet .augcard{flex:0 0 min(84%,300px);scroll-snap-align:start}
@media (prefers-reduced-motion:reduce){#modal.sheet .mbox{transition:none}}
.mtitle{font-family:var(--font-display);font-size:21px;font-weight:400;margin:0;text-wrap:balance;line-height:1.3}
.mdesc{margin:0;color:var(--muted);font-size:13px;line-height:1.55}
.mopts{display:flex;flex-wrap:wrap;gap:8px}
.mopts.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.mbtn{flex:1 1 140px;min-height:48px;border-radius:3px;background:var(--ink3);border:1px solid var(--line);padding:9px 12px;font-weight:700;text-align:left;
  display:flex;flex-direction:column;justify-content:center;gap:2px}
.mbtn:active{background:var(--line)}
.mbtn small{font-weight:500;color:var(--muted);font-size:13px}
.mbtn .cdot{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.mbtn:disabled{opacity:.35}
.mbtn.primary{background:var(--seal);border-color:var(--seal);color:#f6efdc}
.mbtn.ghost{background:transparent}
.mopts.grid .mbtn{min-height:44px;font-size:13px}
.augcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.augcard{text-align:left;background:var(--hanji);color:var(--sumi);border-radius:3px;padding:12px 12px 14px;display:flex;flex-direction:column;gap:6px;
  border:2px solid #111;position:relative;min-height:150px}
.augcard:active{background:var(--hanji2)}
.augcard:disabled{opacity:.4}
.augcard .an{font-family:var(--font-display);font-weight:400;font-size:19px;line-height:1.2}
.augcard .ad{font-size:13px;line-height:1.5}
.augcard .ah{font-size:13px;line-height:1.45;color:var(--sumi2);border-top:1px solid var(--sumi2);padding-top:6px;margin-top:auto}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tg{font-size:13px;font-weight:800;padding:2px 6px;border-radius:2px;background:var(--sumi);color:var(--hanji)}
.tg.general{background:#46546e}.tg.start{background:#2f6e57}.tg.mid{background:#93601c}.tg.end{background:#8f2f2f}
.tg.active{background:var(--seal)}.tg.passive{background:#5b4a3a}.tg.instant{background:#5f4aa0}.tg.win{background:#9a7418}
.book-sec h3{font-family:var(--font-display);margin:6px 0 8px;font-size:18px;border-bottom:2px solid var(--fg);padding-bottom:4px}
.book-list{display:flex;flex-direction:column;gap:8px}
.book-item{background:var(--ink3);border-radius:3px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.book-item b{font-family:var(--font-display);font-size:16px}
.book-item p{margin:0;font-size:13px;line-height:1.5}
.book-item p.h{color:var(--muted);font-size:13px}
.rules p,.rules li{font-size:13.5px;line-height:1.65;max-width:65ch}
.rules h3{font-family:var(--font-display);margin:12px 0 4px;font-size:16px}
.rules ul{padding-left:18px;margin:4px 0}
.loglist{display:flex;flex-direction:column;gap:4px;font-size:13px;line-height:1.45}
.loglist div{padding:4px 0;border-bottom:1px solid var(--ink3)}
.res-row{display:flex;align-items:center;gap:10px;background:var(--ink3);border-radius:3px;padding:10px 12px}
.res-row .medal{font-family:var(--font-display);font-size:24px;font-weight:400;width:40px;text-align:center;flex:none}
.res-row .rn{flex:1;min-width:0}
.res-row .rn small{display:block;color:var(--muted);font-size:13px}
.res-row.win{border-left:6px solid var(--seal)}

'use strict';
/* =====================================================================

let GEN = 0; // 새 게임을 시작하면 증가 → 이전 게임의 대기 중인 흐름은 중단(ABORT)
let SKIP = false; // AI 연출 건너뛰기: 사람이 다시 입력해야 할 때까지 대기·애니메이션을 생략
const sleep = ms => { const g = GEN; return new Promise((res, rej) => setTimeout(() => (g === GEN ? res() : rej(ABORT)), SKIP ? 0 : ms)); };
const noEmoji = s => String(s).replace(/[\p{Extended_Pictographic}\uFE0F\u200D]/gu, '').replace(/\s{2,}/g, ' ').trim();
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

/* =====================================================================
   2. 효과음 — Web Audio 신디사이저 (외부 파일 없음)
   ===================================================================== */
const SFX = {
  ctx: null, on: true, lastHit: 0,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    try { const C = window.AudioContext || window.webkitAudioContext; if (C) this.ctx = new C(); } catch (e) { this.ctx = null; }
  },
  tone(f, d = 0.12, type = 'sine', v = 0.2, f2 = null, delay = 0) {
    if (!this.on || !this.ctx) return;
    const c = this.ctx, t = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(c.destination); o.start(t); o.stop(t + d + 0.03);
  },
  noise(d = 0.08, v = 0.25, delay = 0, hp = 800) {
    if (!this.on || !this.ctx) return;
    const c = this.ctx, t = c.currentTime + delay;
    const len = Math.max(1, Math.floor(c.sampleRate * d));
    const buf = c.createBuffer(1, len, c.sampleRate), data = buf.getChannelData(0);
    for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const s = c.createBufferSource(); s.buffer = buf;
    const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = c.createGain(); g.gain.value = v;
    s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
  },
  play(name) {
    if (!this.on || !this.ctx) return;
    switch (name) {
      case 'throw': for (let i = 0; i < 5; i++) this.noise(0.05, 0.3, i * 0.07 + Math.random() * 0.03, 1400); this.tone(320, 0.08, 'triangle', 0.1, 520, 0.3); break;
      case 'land': this.noise(0.08, 0.3, 0, 300); this.tone(190, 0.12, 'triangle', 0.18, 90); break;
      case 'step': this.tone(560, 0.045, 'square', 0.04); break;
      case 'capture': this.tone(240, 0.25, 'sawtooth', 0.16, 60); this.noise(0.18, 0.28, 0, 200); this.tone(880, 0.1, 'square', 0.07, 1320, 0.12); break;
      case 'finish': [523, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.18, 'triangle', 0.14, null, i * 0.09)); break;
      case 'aug': [660, 880, 1320].forEach((f, i) => this.tone(f, 0.14, 'sine', 0.12, null, i * 0.06)); break;
      case 'win': [523, 659, 784, 1046, 784, 1046, 1318].forEach((f, i) => this.tone(f, 0.24, 'triangle', 0.15, null, i * 0.12)); break;
      case 'bad': this.tone(210, 0.3, 'sawtooth', 0.14, 80); break;

/* =====================================================================
   3. 29칸 윷판 그래프
   0: 출발·도착(우하단) / 1~4 우변 / 5 우상단 / 6~9 윗변 / 10 좌상단 / 11~14 좌변
   15 좌하단 / 16~19 아랫변 / 20·21: 5→22 / 22 중앙(방) / 23·24: 10→22 / 25·26: 22→15 / 27·28: 22→0
   ===================================================================== */
const XY = (() => {
  const p = {};
  const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
  p[0] = [1, 1];
  for (let k = 1; k <= 4; k++) p[k] = [1, 1 - k / 5];
  p[5] = [1, 0];
  for (let k = 1; k <= 4; k++) p[5 + k] = [1 - k / 5, 0];
  p[10] = [0, 0];
  for (let k = 1; k <= 4; k++) p[10 + k] = [0, k / 5];
  p[15] = [0, 1];
  for (let k = 1; k <= 4; k++) p[15 + k] = [k / 5, 1];
  p[22] = [0.5, 0.5];
  p[20] = lerp(p[5], p[22], 1 / 3); p[21] = lerp(p[5], p[22], 2 / 3);
  p[23] = lerp(p[10], p[22], 1 / 3); p[24] = lerp(p[10], p[22], 2 / 3);
  p[25] = lerp(p[22], p[15], 1 / 3); p[26] = lerp(p[22], p[15], 2 / 3);
  p[27] = lerp(p[22], p[0], 1 / 3); p[28] = lerp(p[22], p[0], 2 / 3);
  return p;
})();
const NODES = [...Array(29).keys()];
const CORNERS = [0, 5, 10, 15, 22];
const LINES = [[0, 1, 2, 3, 4, 5], [5, 6, 7, 8, 9, 10], [10, 11, 12, 13, 14, 15], [15, 16, 17, 18, 19, 0], [5, 20, 21, 22, 25, 26, 15], [10, 23, 24, 22, 27, 28, 0]];
const DIAG = [20, 21, 22, 23, 24, 25, 26, 27, 28];
const ADJ = (() => { const a = {}; NODES.forEach(n => a[n] = new Set()); LINES.forEach(L => { for (let i = 0; i + 1 < L.length; i++) { a[L[i]].add(L[i + 1]); a[L[i + 1]].add(L[i]); } }); return a; })();
const nodeAt = (x, y) => NODES.find(n => Math.abs(XY[n][0] - x) < 1e-6 && Math.abs(XY[n][1] - y) < 1e-6);
// 시계방향 90° 회전: 화면좌표 (x,y) → (1-y, x)
const ROT = (() => { const r = {}; NODES.forEach(n => { const [x, y] = XY[n]; r[n] = nodeAt(1 - y, x); }); return r; })();

const FWD_MAP = { 20: 21, 21: 22, 23: 24, 24: 22, 25: 26, 26: 15, 27: 28, 28: 0 };
const REV_MAP = { 26: 25, 25: 22, 21: 20, 20: 5, 23: 24, 24: 22, 27: 28, 28: 0 };
const FWD_PREV = { 20: 5, 21: 20, 22: 21, 23: 10, 24: 23, 25: 22, 26: 25, 27: 22, 28: 27 };
const REV_PREV = { 26: 15, 25: 26, 22: 25, 21: 22, 20: 21, 23: 10, 24: 23, 27: 22, 28: 27 };

// 한 칸 전진. start=이번 이동의 첫 걸음인지(모서리에서 지름길 진입), rev=천마군림보(역방향)
function nextNode(n, prev, start, rev) {
  if (!rev) {
    if (start && n === 5) return 20;
    if (start && n === 10) return 23;
    if (n === 22) return (!start && prev === 21) ? 25 : 27;
    if (FWD_MAP[n] !== undefined) return FWD_MAP[n];

  }
  if (start && n === 15) return 26;
  if (start && n === 10) return 23;
  if (n === 22) return (!start && prev === 25) ? 21 : 27;
  if (REV_MAP[n] !== undefined) return REV_MAP[n];
  if (n === 0) return 19;
  return n - 1;
}
function defaultPrev(n, rev) {
  if (!rev) { if (FWD_PREV[n] !== undefined) return FWD_PREV[n]; return n === 0 ? 19 : n - 1; }
  if (REV_PREV[n] !== undefined) return REV_PREV[n];
  if (n === 19) return 0;
  if (n === 0) return 1;
  return n + 1;
}

   cat: general 범용 / start 시작(1R) / mid 중간(4R) / end 마무리(8R)

  { no: 4, id: 'cat', name: '고양이', cat: 'general', kind: 'passive', desc: '아무 능력이 없습니다. 왜 있냐고요? 귀엽잖아요.', how: '능력 없음. 고양이 좋아·간택·고양이 골라의 대상입니다.' },
  { no: 5, id: 'chosen', name: '간택', cat: 'general', kind: 'instant', desc: '이제 모든 플레이어는 증강 선택창에 고양이가 나오면 무조건 고양이를 골라야 합니다.', how: '이후 모든 선택창에 고양이 등장 확률이 크게 오르고, 고양이가 뜨면 다른 카드는 잠깁니다.' },
  { no: 6, id: 'catpick', name: '고양이 골라', cat: 'general', kind: 'passive', desc: '선택창에 고양이가 나오면 무조건 고양이를 골라야 합니다.', how: '내 선택창에 고양이가 뜨면 다른 카드가 잠깁니다.' },
  { no: 7, id: 'catlove', name: '고양이 좋아', cat: 'general', kind: 'win', desc: '언제든 고양이를 선택한 플레이어가 있으면 승리합니다.', how: '누구든(나 포함) 고양이를 가지고 있거나 고양이로 착각된 증강이 생기면 즉시 승리.' },
  { no: 8, id: 'excess', name: '과유불급', cat: 'general', kind: 'passive', desc: '윷 6개를 사용합니다. 앞면 0개는 모, 5개는 윷, 앞면 6개는 탈락입니다.', how: '앞면 개수: 0=모, 1=도, 2=개, 3=걸, 4=윷, 5=윷, 6=탈락.' },
  { no: 9, id: 'dogpig', name: '개돼지', cat: 'general', kind: 'passive', desc: '매 턴 도와 개만 낼 수 있지만 선택할 수 있습니다.', how: '던질 때마다 [도]/[개] 중 원하는 결과를 고릅니다.' },
  { no: 10, id: 'leech', name: '거머리', cat: 'general', kind: 'instant', desc: '즉시 다른 플레이어에게 말을 1개 줍니다. 그 플레이어가 이기거나 지면 같이 이기거나 집니다.', how: '대기 말 1개를 넘기고 그 플레이어와 1위(승리)·탈락을 공유합니다.' },
  { no: 11, id: 'whoami', name: '나 누구게?', cat: 'general', kind: 'instant', desc: '잠시 모든 정보가 감춰집니다. 다른 플레이어는 자신의 색을 맞춰야 하며, 못 맞출 경우 차례를 한 번 건너뜁니다.', how: '모든 말이 기호로 가려지고, 다른 플레이어가 차례로 자기 기호를 맞힙니다. 틀리면 1회 건너뜀.' },
  { no: 12, id: 'notme', name: '나만 아니면 돼~', cat: 'general', kind: 'instant', desc: '즉시 무작위 플레이어 한 명의 모든 말을 죽입니다.', how: '나를 포함한 생존자 중 1명을 추첨해 판 위의 말을 모두 대기실로 보냅니다.' },
  { no: 13, id: 'getdown', name: '내려', cat: 'general', kind: 'instant', desc: '투표를 진행합니다. 최다 득표자는 차례를 한번 건너뜁니다. 자신은 2표를 행사합니다.', how: '가림막 비밀 투표. 동점이면 동점자 중 무작위 1명.' },
  { no: 14, id: 'doberman', name: '도베르만', cat: 'general', kind: 'active', desc: '1회, 이번 게임 동안 자신이 개를 낸 만큼 개 코인을 1개 얻습니다. 이제 윷을 던질 때마다 개 코인 2개를 소비해 모가 나옵니다.', how: '획득 시 지금까지 낸 개 수만큼 코인, 이후 개마다 +1. 버튼으로 코인 2개를 써서 확정 모.' },
  { no: 15, id: 'spin', name: '돌려돌려 돌림판', cat: 'general', kind: 'active', desc: '판을 회전시킵니다. 소유자는 한 번 다시 돌릴 수 있습니다.', how: '획득 즉시 판이 시계방향 90° 회전(출구는 그대로). 원할 때 한 번 더 돌릴 수 있습니다.' },
  { no: 16, id: 'sniper', name: '명사수', cat: 'general', kind: 'active', desc: '던지기 기회를 소모해 칸 하나를 선택합니다. 다음 라운드 자신 차례가 시작하면 해당 칸의 모든 말을 죽입니다.', how: '투척 1회를 쓰고 과녁을 둡니다. 내 다음 차례 시작에 그 칸의 모든 말이 죽습니다.' },
  { no: 17, id: 'detective', name: '명탐정', cat: 'general', kind: 'instant', desc: '증강 하나를 고릅니다. 해당 증강은 이번 증강 선택에서 무효화됩니다.', how: '가림막 비밀 지목. 이번 라운드에 그 증강을 고른(고를) 다른 플레이어의 선택이 무효가 됩니다.' },
  { no: 18, id: 'moordo', name: '모 아니면 도', cat: 'general', kind: 'passive', desc: '모 아니면 도만 나옵니다.', how: '50% 도, 50% 모.' },
  { no: 19, id: 'baduk', name: '바둑', cat: 'general', kind: 'active', desc: '1회, 일직선으로 있는 내 말뭉치 둘 사이에 있는 적을 모두 죽이고 죽인 수만큼 던지기 기회를 얻습니다.', how: '같은 변·같은 대각선 위 내 말뭉치 두 개 사이의 적을 모두 잡습니다.' },
  { no: 20, id: 'delivery', name: '배달', cat: 'general', kind: 'instant', desc: '증강 하나를 선택합니다. 다음 증강 선택 때 해당 증강이 자신에게 무조건 등장합니다.', how: '가림막 비밀 예약. 다음 선택창 첫 칸에 고정 등장.' },
  { no: 21, id: 'dokkaebi', name: '변환: 도깨비', cat: 'general', kind: 'active', desc: '1회, 일반말을 도깨비로 바꿉니다. 도깨비는 매 턴 도나 백도만큼 이동할 수 있습니다.', how: '변환 후 매 차례 한 번, 윷 결과와 별개로 도깨비를 도/빽도만큼 움직일 수 있습니다.' },
  { no: 22, id: 'vanguard', name: '변환: 선봉장', cat: 'general', kind: 'instant', desc: '일반말을 선봉장으로 바꿉니다. 선봉장이 윷판에 있는 동안, 내 모든 이동이 1칸 증가합니다.', how: '선봉장이 판 위에 있으면 내 모든 윷 결과 전진량 +1.' },
  { no: 23, id: 'cannon', name: '변환: 포', cat: 'general', kind: 'active', desc: '1회용, 일반말을 포로 바꿉니다. 매 차례 한 번, 포는 말이 있는 칸 하나를 넘어 원하는 만큼 일직선으로 이동할 수 있습니다.', how: '같은 직선 위의 말 있는 칸(다리)을 정확히 하나 넘어 원하는 칸에 착지. 넘은 뒤 처음 만나는 적은 잡을 수 있습니다.' },
  { no: 24, id: 'pawn', name: '변환: 폰', cat: 'general', kind: 'active', desc: '1회, 일반말을 폰으로 바꿉니다. 폰은 조작할 수 없지만 투척마다 도만큼 전진합니다.', how: '폰은 결과 칩으로 움직일 수 없고, 내가 던질 때마다 자동으로 1칸 전진합니다.' },
  { no: 25, id: 'four', name: '사목', cat: 'general', kind: 'win', desc: '내 말이 일직선으로 연속된 네 칸을 차지하거나 네 말이 한 말뭉치가 되면 승리합니다.', how: '한 직선 위 연속 4칸에 내 말이 있거나, 한 칸에 내 말 4개가 업히면 즉시 승리.' },
  { no: 26, id: 'cowback', name: '소 뒷걸음질', cat: 'general', kind: 'win', desc: '자신이 백도로 2번 말을 잡으면 승리합니다.', how: '빽도 이동으로 잡기 2회 달성 시 즉시 승리.' },
  { no: 27, id: 'hand', name: '손은 눈보다 빠르다', cat: 'general', kind: 'active', desc: '1회, 다음 윷을 던질 때 원하는 대로 낼 수 있습니다.', how: '투척 1회를 써서 빽도·도·개·걸·윷·모 중 원하는 결과를 얻습니다.' },
  { no: 28, id: 'timetravel', name: '시간 여행', cat: 'general', kind: 'active', desc: '1회, 자신의 말 하나를 원하는 뒤쪽 칸으로 이동시킵니다.', how: '지나온 길 위의 원하는 칸으로 즉시 이동. 적이 있으면 잡습니다.' },
  { no: 29, id: 'score', name: '악보가 완성되었다!', cat: 'general', kind: 'win', desc: '이번 게임 동안 자신이 백도, 도, 개, 걸, 윷, 모를 내면 승리합니다.', how: '게임 시작부터의 기록이 인정됩니다. 6가지를 모두 내면 즉시 승리.' },
  { no: 30, id: 'fog', name: '안개', cat: 'general', kind: 'active', desc: '1회, 두 차례 동안 윷판에 안개가 생깁니다. 안개 속에서 자신 이외의 플레이어는 자신 말 근처만 확인할 수 있습니다.', how: '2라운드 동안, 시전자가 아닌 플레이어의 차례에는 그 플레이어 말 주변 1칸만 보입니다.' },
  { no: 31, id: 'alkkagi', name: '알까기', cat: 'general', kind: 'active', desc: '1회, 차례를 사용해 알까기를 합니다.', how: '판의 모든 말이 알이 됩니다. 내 말을 당겼다 놓아 튕기고, 판 밖으로 나간 말은 죽습니다.' },
  { no: 32, id: 'fisher', name: '어부지리', cat: 'general', kind: 'passive', desc: '내 차례가 아닐 때 죽은 다른 플레이어의 말 개수 2개마다 개를 얻습니다.', how: '남의 차례에 남의 말이 2개 죽을 때마다 내 다음 차례에 개 칩 1개.' },
  { no: 33, id: 'illusion', name: '언제부터 착각한 거지?', cat: 'general', kind: 'instant', desc: '한 플레이어의 능력 하나를 지정해 3 라운드 동안 "고양이"로 바꿉니다. 이미 사용 완료한 증강은 바꿀 수 없습니다.', how: '지정한 증강이 3라운드 동안 능력 없는 고양이가 됩니다(고양이 좋아 발동 가능).' },
  { no: 34, id: 'throwhit', name: '윷을 잘 던져봐', cat: 'general', kind: 'active', desc: '1회, 윷을 던져서 플레이어를 맞춥니다. 해당 플레이어는 차례를 두 번 건너뜁니다.', how: '대상 플레이어 차례 2회 건너뜀.' },
  { no: 35, id: 'dual', name: '이도류', cat: 'general', kind: 'passive', desc: '윷을 2개씩 모두 던지며, 모 결과는 도로 바뀝니다.', how: '한 번 던질 때 결과를 2개 얻고, 모는 도가 됩니다(추가 투척 없음).' },
  { no: 36, id: 'objection', name: '이의있음!', cat: 'general', kind: 'instant', desc: '이번 증강 선택을 취소하고 다시 고릅니다.', how: '선택창을 새로 뽑아 다시 고릅니다.' },
  { no: 37, id: 'jajin', name: '자진모리 장단', cat: 'general', kind: 'passive', desc: '걸이 2번 나올 때마다 개를 얻습니다.', how: '걸 2회마다 개 칩 1개 추가.' },
  { no: 38, id: 'moonwalk', name: '천마군림보 - 달걸음', cat: 'general', kind: 'passive', desc: '자신의 모든 말이 반대 방향으로 이동합니다.', how: '0→19→18…→1→0 방향. 지름길도 15·10에서 거꾸로 진입합니다.' },
  { no: 39, id: 'shield', name: '천상의 보호막', cat: 'general', kind: 'active', desc: '1회, 자신의 말뭉치 하나를 선택합니다. 해당 말뭉치는 보호막을 얻어 죽음을 1번 견딥니다.', how: '잡히면 보호막만 깨지고, 공격한 말은 직전 칸에 멈춥니다.' },
  { no: 40, id: 'redbutton', name: '크고 빨간 버튼', cat: 'general', kind: 'instant', desc: '획득 즉시 두 대각선 지름길에 있는 모든 플레이어의 말을 죽입니다.', how: '20~28번(중앙 포함) 위의 모든 말이 죽습니다.' },
  { no: 41, id: 'friendshield', name: '프랜드 실드', cat: 'general', kind: 'passive', desc: '내 말뭉치가 죽을 때 말이 1개만 죽습니다.', how: '업힌 말뭉치가 죽을 때 1개만 대기실로 가고 나머지는 남습니다.' },
  { no: 42, id: 'sacrifice', name: '희생', cat: 'general', kind: 'active', desc: '1회, 윷판 위의 자신의 말 하나를 죽입니다. 윷판 위의 자신의 다른 모든 말에 보호막을 씌워 죽음을 1번 막습니다.', how: '말 1개를 바치고 나머지 판 위 내 말 전부에 보호막.' },
  { no: 43, id: 'poop', name: '히히 똥!', cat: 'general', kind: 'passive', desc: '무작위 칸에 똥을 쌉니다. 다른 플레이어의 말이 이동하다가 똥을 밟으면 멈춥니다.', how: '획득 시와 내 차례 시작마다 무작위 빈칸에 똥(최대 3개). 밟은 상대 말은 그 칸에 멈추고 똥은 치워집니다.' },
  { no: 44, id: 'equiv', name: '등가교환', cat: 'start', kind: 'passive', desc: '자신의 말 1개와 윷 1개를 제거하고 시작합니다.', how: '말 3개로 완주. 윷가락 3개: 앞면 0=윷, 1=도, 2=개, 3=걸(모 없음).' },
  { no: 45, id: 'party', name: '말이오? 파티', cat: 'start', kind: 'instant', desc: '판에 함정 6개와 보상 4개를 설치해 정확히 도착한 말을 이동시키거나 죽입니다. 자신이 설치한 함정에는 영향을 받지 않습니다.', how: '함정: 사망 또는 뒤로 3칸. 보상: 앞으로 2칸 또는 추가 투척. 설치자는 함정 면역.' },
  { no: 46, id: 'speed', name: '스겜', cat: 'start', kind: 'instant', desc: '모든 플레이어의 말이 2개가 되며, 자신의 말은 도와 개에서 시작합니다.', how: '모두 말 2개. 내 말은 1번(도)·2번(개) 칸에서 출발.' },
  { no: 47, id: 'kim', name: '시작 변환: 김첨지', cat: 'start', kind: 'win', desc: '일반말 하나를 김첨지로 바꿉니다. 김첨지가 6차례 안에 완주하면 승리합니다.', how: '내 6번째 차례가 끝나기 전에 김첨지가 완주하면 즉시 승리.' },
  { no: 48, id: 'queen', name: '시작 변환: 중전마마', cat: 'start', kind: 'win', desc: '좌측 상단의 중전마마가 죽으면 탈락하고, 12번 던질 때까지 지키면 승리합니다. 중전마마는 완주할 수 없습니다. 다른 말이 완주하면 목숨이 1개 증가합니다.', how: '10번 칸에 중전마마(목숨 1). 12번 던지는 동안 살아남으면 승리, 죽으면 탈락. 출구를 지나도 계속 돕니다.' },
  { no: 49, id: 'bear', name: '웅녀', cat: 'start', kind: 'win', desc: '무작위 칸의 마늘 3개를 모두 모으면 승리합니다.', how: '내 말이 마늘 칸을 지나거나 도착하면 획득. 3개면 승리.' },
  { no: 50, id: 'piggy', name: '이리 오너라 업고 놀자', cat: 'start', kind: 'instant', desc: '자신의 모든 말을 업은 채 도 위치에서 시작합니다.', how: '대기 중인 내 말 전부를 업어서 도 칸에 올립니다.' },
  { no: 51, id: 'burden', name: '짐덩이와 복덩이', cat: 'start', kind: 'passive', desc: '자신의 말 1개와 윷 1개를 추가하고 시작합니다.', how: '말 5개로 완주. 윷가락 5개: 앞면 0=특대모(6칸), 1=도 … 4=윷, 5=모.' },
  { no: 52, id: 'alone', name: '천상천하 유아독존', cat: 'start', kind: 'win', desc: '윷판에 말뭉치가 1개만 있으면 승리합니다.', how: '판에 말뭉치가 2개 이상 있었던 뒤로, 판 전체 말뭉치가 딱 1개가 되는 순간 승리(누구 말이든).' },
  { no: 53, id: 'seven', name: '777', cat: 'mid', kind: 'win', desc: '한 차례 안에 같은 윷 결과가 3번 이상 나오면 승리합니다.', how: '한 차례 동안 같은 결과 3회 기록 시 승리.' },

/* =====================================================================
   5. 게임 상태

let G = null;

function makePiece(owner, type = 'normal') {

}

/* ----- 조회 도우미 ----- */
const P = i => G.players[i];
const canon = n => (G.alias[n] ?? n);
const isExit = n => n !== HOME && n !== DONE && canon(n) === canon(0);
const onBoard = pc => pc.pos !== HOME && pc.pos !== DONE;
const canonNodes = () => NODES.filter(n => canon(n) === n);
function aug(p, id) { return p.augs.find(a => a.id === id && !a.disabled && !(a.catUntil && G.round < a.catUntil)) || null; }
const has = (p, id) => !!aug(p, id);
const hasCat = p => p.augs.some(a => !a.disabled && (a.id === 'cat' || (a.catUntil && G.round < a.catUntil)));
const live = () => G.players.filter(p => !p.out);
const others = p => live().filter(q => q.id !== p.id);
const boardPieces = () => G.players.flatMap(p => p.pieces.filter(onBoard));
const piecesAt = n => boardPieces().filter(pc => canon(pc.pos) === canon(n));
const isBound = pc => pc.domain || pc.boundUntil > G.round;
const needPieces = p => p.pieces.filter(pc => pc.type !== 'queen');
const doneCount = p => p.pieces.filter(pc => pc.pos === DONE).length;
function stackOf(pc) {
  if (!onBoard(pc) || pc.type === 'pawn') return [pc];
  return P(pc.owner).pieces.filter(x => onBoard(x) && x.type !== 'pawn' && canon(x.pos) === canon(pc.pos));
}
function myStacks(p) {
  const seen = new Set(), out = [];
  for (const pc of p.pieces) {
    if (!onBoard(pc) || seen.has(pc.id)) continue;
    const s = stackOf(pc); s.forEach(x => seen.add(x.id)); out.push(s);
  }
  return out;
}
const allGroups = () => G.players.flatMap(p => myStacks(p));
const stackBound = s => s.some(isBound);
function stepsToFinish(pos, trail, rev) {
  if (pos === DONE) return 0;
  if (pos !== HOME && isExit(pos)) return 1;
  let cur = pos, prev = trail && trail.length ? trail[trail.length - 1] : null, start = true;
  for (let n = 1; n < 60; n++) {
    const nx = cur === HOME ? (rev ? 19 : 1) : nextNode(cur, prev, start, rev);
    prev = cur; cur = nx; start = false;
    if (isExit(nx)) return n;
  }

}
function progress(p) {
  let s = doneCount(p) * 100;
  for (const pc of needPieces(p)) if (pc.pos !== DONE) s -= stepsToFinish(pc.pos, pc.trail, p.reverse);

}
function say(msg, toast) {

/* =====================================================================
   6. 순위 · 탈락 · 승리

function freeRanks() { const r = []; for (let i = 1; i <= G.n; i++) if (!G.rankTaken.has(i)) r.push(i); return r; }
const bestFree = () => freeRanks()[0] ?? G.n;
const worstFree = () => { const f = freeRanks(); return f.length ? f[f.length - 1] : G.n; };
function setRank(p, r, reason) {
  p.out = true; p.rank = r; p.outReason = reason; G.rankTaken.add(r);

}
function checkContention() {

      if (q.out) continue;

async function eliminate(p, why) {

}
async function tryCancel(p, why, augId, isFinish) {

async function specialWin(p, why, augId) {

    const node = grp[0].pos;
    if (killer && killer.id !== owner.id && (has(owner, 'peace') || has(killer, 'peace'))) {

}
async function afterKills(killed, killer, cause) {

    if (f.out || !has(f, 'fisher') || f.id === curPid) continue;
    const n = killed.filter(pc => pc.owner !== f.id).length;
    if (!n) continue;

    if (need.length && need.every(q => v.st.nofriend[q.id])) await specialWin(v, '나만 친구 없어: 모두에게 잡힘', 'nofriend');

/* =====================================================================
   8. 이동 엔진
   ===================================================================== */
const poopBlocks = (n, owner) => G.poops.some(pp => canon(pp.node) === canon(n) && pp.owner !== owner.id);
// 경로 계산. steps<0 이면 빽도(지나온 길 역행)
function computePath(pc, steps, owner, stack) {
  stack = stack || [pc];
  const rev = !!owner.reverse;
  const queenOnly = stack.every(x => x.type === 'queen');
  let cur = pc.pos;
  const trail = pc.trail.slice();
  const path = [];
  let finished = false, poop = null;
  if (steps > 0) {
    let prev = trail.length ? trail[trail.length - 1] : null, start = true;
    for (let i = 0; i < steps; i++) {
      if (cur !== HOME && isExit(cur) && !queenOnly) { finished = true; break; }
      const nx = cur === HOME ? (rev ? 19 : 1) : nextNode(cur, prev, start, rev);
      if (cur !== HOME) trail.push(cur);
      path.push(nx); prev = cur; cur = nx; start = false;
      if (isExit(nx) && !queenOnly) { finished = true; break; }
      if (i < steps - 1 && poopBlocks(nx, owner)) { poop = nx; break; }
    }
  } else if (steps < 0) {
    if (cur === HOME) return { path, finished, trail, poop, invalid: true };
    for (let i = 0; i < -steps; i++) {
      const nx = trail.length ? trail.pop() : defaultPrev(cur, rev);
      path.push(nx); cur = nx;
      if (i < -steps - 1 && poopBlocks(nx, owner)) { poop = nx; break; }
    }
  }
  return { path, finished, trail, poop };
}
function vanguardOn(p) { return p.pieces.some(pc => pc.type === 'vanguard' && onBoard(pc)); }
function modValue(p, v) {
  let a = v;
  if (a > 0 && vanguardOn(p)) a += 1;
  if (G.T && G.T.pid === p.id && G.T.lastDance) a *= 2;
  return a;
}
function movableLeads(p, v) {
  const out = [], seen = new Set();
  for (const pc of p.pieces) {
    if (pc.pos === DONE || pc.type === 'pawn' || seen.has(pc.id)) continue;
    if (pc.pos === HOME) { if (v > 0) out.push(pc); continue; }
    const s = stackOf(pc); s.forEach(x => seen.add(x.id));
    if (stackBound(s)) continue;
    const r = computePath(pc, modValue(p, v), p, s);
    if (r.path.length || r.finished) out.push(pc);
  }
  return out;
}
async function moveStack(p, lead, amount, opt = {}) {
  const stack = lead.pos === HOME ? [lead] : stackOf(lead);
  const r = computePath(lead, amount, p, stack);
  if (!r.path.length && !r.finished) return { moved: false };
  return executeMove(p, stack, lead.pos, r, { backdo: amount < 0, ...opt });
}
// 경로 r={path, trail, finished, poop}를 실제로 적용
async function executeMove(p, stack, from, r, opt = {}) {
  await animateMove(stack, from, r.path, p);
  if (G.over) return { moved: true };
  await collectGarlic(p, r.path);
  if (G.over || p.out) return { moved: true };
  if (r.finished) {
    const fin = stack.filter(x => x.type !== 'queen');
    const end = r.path.length ? r.path[r.path.length - 1] : from;
    stack.filter(x => x.type === 'queen').forEach(q => { q.pos = end; q.trail = r.trail.slice(); });
    if (fin.length) await onFinish(p, fin);
    render();
    return { moved: true, finished: true };
  }
  const dest = r.path[r.path.length - 1];
  stack.forEach(x => { x.pos = dest; x.trail = r.trail.slice(); });
  SFX.play('land');
  if (r.poop) {
    G.poops = G.poops.filter(pp => canon(pp.node) !== canon(dest));
    say(`💩 ${p.name}의 말이 똥을 밟고 멈췄습니다!`);
    R.fxText(dest, '똥!', '#b07a3a'); SFX.play('bad');
  }
  const prevNode = r.path.length >= 2 ? r.path[r.path.length - 2] : from;
  const res = await resolveLanding(p, stack, dest, { backdo: !!opt.backdo, prevNode, r });
  if (G.over || p.out) return { moved: true, ...res };
  if (!r.poop && !opt.noTrap && stack.some(onBoard)) await triggerTrap(p, stack, opt.depth || 0);
  render();
  return { moved: true, ...res };
}
async function resolveLanding(p, stack, dest, ctx) {
  const out = { captured: 0 };
  const here = piecesAt(dest).filter(x => !stack.includes(x));
  const enemies = here.filter(x => x.owner !== p.id);
  if (enemies.length) {
    const kr = await killPieces(enemies, p, 'capture');
    if (kr.killed.length) {
      out.captured = kr.killed.length;
      const vs = [...new Set(kr.killed.map(x => P(x.owner).name))].join(', ');
      say(`💥 ${p.name}이(가) ${vs}의 말 ${kr.killed.length}개를 잡았습니다!`, p.color);
      if (G.T && G.T.pid === p.id && !p.out) {
        let bonus = 1;
        if (has(p, 'treason') && kr.killed.some(x => doneCount(P(x.owner)) > doneCount(p))) { bonus++; say('🗡 역모: 투척 기회 +1 추가'); }
        G.T.throwsLeft += bonus;
      }
      if (ctx.backdo && has(p, 'cowback') && !p.out) {
        p.st.cow++; say(`🐄 소 뒷걸음질 ${p.st.cow}/2`);
        if (p.st.cow >= 2) await specialWin(p, '소 뒷걸음질: 빽도로 2번 잡기', 'cowback');
      }
    } else if (kr.shielded && stack.some(onBoard)) {
      const pn = ctx.prevNode;
      const r = ctx.r;
      if (pn === HOME) stack.forEach(x => { x.pos = HOME; x.trail = []; });
      else {
        const tr = ctx.backdo ? r.trail.concat([dest]) : r.trail.slice(0, -1);
        stack.forEach(x => { x.pos = pn; x.trail = tr.slice(); });
      }
      say('보호막에 막혀 공격한 말이 직전 칸에 멈췄습니다');
    }
  }
  if (G.over || p.out) return out;
  const mine = piecesAt(dest).filter(x => x.owner === p.id && !stack.includes(x));
  const lead = stack.find(onBoard);
  if (mine.length && lead && lead.type !== 'pawn' && canon(lead.pos) === canon(dest)) {
    if (has(p, 'cannibal')) {
      const kr = await killPieces(mine, p, 'cannibal');
      if (kr.killed.length) {
        say(`🍖 카니발리즘: ${p.name}이(가) 자기 말 ${kr.killed.length}개를 먹었습니다 (추가 투척)`);
        if (G.T && G.T.pid === p.id) G.T.throwsLeft += 1;
      }
    } else {
      const joiners = mine.filter(x => x.type !== 'pawn');
      joiners.forEach(x => { x.pos = lead.pos; x.trail = lead.trail.slice(); });
      if (joiners.length) { say(`${p.name} 업기! (${stackOf(lead).length}개)`); R.fxText(dest, '업기', p.color); }
    }
  }
  return out;
}
async function triggerTrap(p, stack, depth) {
  if (depth > 2) return;
  const lead = stack.find(onBoard);
  if (!lead) return;
  const t = G.traps.find(x => canon(x.node) === canon(lead.pos));
  if (!t) return;
  if (t.kind === 'trap') {
    if (t.owner === p.id) return;
    if (Math.random() < 0.5) {
      say(`💣 함정! ${p.name}의 말이 터졌습니다`, '#e66');
      SFX.play('boom');
      await killPieces(stackOf(lead), P(t.owner), 'trap');
    } else {
      say(`💣 함정! ${p.name}의 말이 뒤로 3칸`);
      await moveStack(p, lead, -3, { noTrap: true });
    }
  } else {
    if (Math.random() < 0.5) {
      say(`🎁 보상! ${p.name}의 말이 앞으로 2칸`);
      await moveStack(p, lead, 2, { depth: depth + 1 });
    } else {
      say(`🎁 보상! ${p.name} 추가 투척`);
      if (G.T && G.T.pid === p.id) G.T.throwsLeft++;
    }
  }
}
async function collectGarlic(p, path) {
  const g = G.garlics.find(x => x.owner === p.id);
  if (!g || !has(p, 'bear')) return;
  for (const n of path) {
    const i = g.nodes.findIndex(x => canon(x) === canon(n));
    if (i >= 0) { g.nodes.splice(i, 1); g.got++; say(`🧄 웅녀: 마늘 ${g.got}/3`); R.fxText(n, '마늘!', '#fff'); SFX.play('magic'); }
  }
  if (g.got >= 3) await specialWin(p, '웅녀: 마늘 3개를 모두 모음', 'bear');
}
async function advancePawns(p) {
  for (const pc of p.pieces) {
    if (pc.type !== 'pawn' || pc.pos === DONE || isBound(pc) || p.out || G.over) continue;
    await moveStack(p, pc, 1, { pawn: true });
  }
}

function stickCount(p) { return (has(p, 'excess') ? 6 : 4) + (has(p, 'burden') ? 1 : 0) - (has(p, 'equiv') ? 1 : 0); }
function throwSticks(p) {
  if (has(p, 'moordo')) {
    const mo = Math.random() < 0.5;
    return { v: mo ? 5 : 1, flats: mo ? [false, false, false, false] : [false, true, false, false] };
  }
  const n = stickCount(p), ex = has(p, 'excess');
  const flats = Array.from({ length: n }, () => Math.random() < 0.55);
  const k = flats.filter(Boolean).length;
  let v;
  if (ex) v = k === n ? 'OUT' : k === 0 ? 5 : k >= 4 ? 4 : k;
  else if (n <= 3) v = k === 0 ? 4 : k;
  else if (n === 4) v = k === 0 ? 5 : k;
  else v = k === 0 ? 6 : Math.min(k, 5);
  if (v === 1 && flats[0]) v = -1;
  return { v, flats };
}
async function doThrow(p, forced) {
  const T = G.T;
  if (forced === undefined && T.throwsLeft <= 0) return;
  T.throwsLeft--; T.fresh = false;
  const sets = [];
  if (forced !== undefined) sets.push({ v: forced, flats: null });
  else if (has(p, 'dogpig')) {
    const v = await UI.choose(p, '개돼지: 이번 결과를 고르세요', [{ label: '도 (1칸)', value: 1 }, { label: '개 (2칸)', value: 2 }], { ai: () => AI.dogpig(p) });
    sets.push({ v: v ?? 2, flats: null });
  } else sets.push(throwSticks(p));
  if (has(p, 'dual')) {
    sets.push(throwSticks(p));
    sets.forEach(s => { if (s.v === 5) { s.v = 1; s.dualFix = true; } });
  }
  p.st.throws++;
  SFX.play('throw');
  await UI.showThrow(p, sets);
  for (const s of sets) {
    if (s.v === 'OUT') { say(`🎋 ${p.name} 과유불급: 앞면 ${stickCount(p)}개!`, '#e66'); await eliminate(p, '과유불급 (앞면 전부)'); return; }
    T.chips.push(s.v);
    if (s.v >= 4) T.throwsLeft++;
    say(`${p.name}: ${resName(s.v)}${s.dualFix ? ' (이도류: 모→도)' : ''}${s.v >= 4 ? ' — 한 번 더!' : ''}`);
    await recordResult(p, s.v);
    if (p.out || G.over) return;
  }
  if (has(p, 'queen')) {
    p.st.queenThrows++;
    const q = p.pieces.find(x => x.type === 'queen');
    if (q && onBoard(q) && p.st.queenThrows >= 12) { if (await specialWin(p, '중전마마를 12번 던질 때까지 지킴', 'queen')) return; }
  }
  await advancePawns(p);
  render();
}
async function recordResult(p, v) {
  const T = G.T;
  p.st.seen[v === 6 ? 5 : v] = true;
  T.counts[v] = (T.counts[v] || 0) + 1;
  if (v === 2) { p.st.dogs++; if (has(p, 'doberman')) p.st.dogCoins++; }

/* =====================================================================
   10. 판 변형: 접기 · 회전 · 설치물

// 접은 뒤의 칸 별칭표: 출구(0)가 있는 쪽 절반이 남고, 반대쪽 절반은 거울 대칭 칸으로 합쳐진다
function foldAlias(dir) {
  const ex = XY[canon(0)];
  const keepHigh = dir === 'h' ? ex[1] > 0.5 : ex[0] > 0.5;
  const mirror = c => {
    const [x, y] = XY[c];
    if (dir === 'h') { if ((keepHigh && y < 0.5 - 1e-6) || (!keepHigh && y > 0.5 + 1e-6)) return nodeAt(x, 1 - y); }
    else if ((keepHigh && x < 0.5 - 1e-6) || (!keepHigh && x > 0.5 + 1e-6)) return nodeAt(1 - x, y);
    return c;
  };
  const na = {};
  for (const n of NODES) { const c2 = mirror(canon(n)); if (c2 !== n) na[n] = c2; }
  return na;
}
async function applyFold(dir, actor) {
  SFX.play('fold');
  UI.flash('게임 접어라!', actor.color);
  await R.animFold(dir);
  G.alias = foldAlias(dir);
  G.folds.push(dir);
  say(`📄 ${actor.name}: 윷판을 ${dir === 'h' ? '가로로' : '세로로'} 접었습니다! 대칭 칸이 하나로 합쳐졌습니다`, actor.color);
  await resolveMerges(actor);
  await checkBoardWins();
  render();
}
// 접기로 같은 칸에 겹친 서로 다른 플레이어의 말 → 잡기 판정
async function resolveMerges(actor) {
  const byNode = new Map();
  for (const pc of boardPieces()) { const c = canon(pc.pos); if (!byNode.has(c)) byNode.set(c, []); byNode.get(c).push(pc); }
  for (const [node, pcs] of byNode) {
    const owners = [...new Set(pcs.map(x => x.owner))];
    if (owners.length < 2) continue;
    let winner = owners.includes(actor.id) ? actor.id : null;
    if (winner === null) { const flap = pcs.filter(x => x.pos !== canon(x.pos)).map(x => x.owner); winner = flap.length ? flap[0] : pick(owners); }
    const victims = pcs.filter(x => x.owner !== winner && onBoard(x));
    if (!victims.length) continue;
    say(`접힌 ${node}번 칸: ${P(winner).name}의 말이 위에 포개졌습니다`);
    await killPieces(victims, P(winner), 'fold');
  }
}
async function doRotate(actor) {
  SFX.play('magic');
  UI.flash('돌려돌려 돌림판!', actor.color);
  await R.animRotate();
  const m = ROT;
  for (const pc of G.players.flatMap(q => q.pieces)) if (onBoard(pc)) { pc.pos = m[pc.pos]; pc.trail = pc.trail.map(n => m[n]); }
  const na = {};
  for (const n of NODES) { const a = G.alias[n]; if (a !== undefined) na[m[n]] = m[a]; }
  G.alias = na;
  G.poops.forEach(x => x.node = m[x.node]);
  G.traps.forEach(x => x.node = m[x.node]);
  G.garlics.forEach(g => g.nodes = g.nodes.map(n => m[n]));
  G.targets.forEach(t => t.node = m[t.node]);
  G.rotations++;
  say(`🌀 ${actor.name}: 판이 시계방향으로 90° 돌았습니다 (출구는 그대로)`, actor.color);
  await checkBoardWins();
  render();
}
function placePoop(p) {
  const occupied = new Set(boardPieces().map(pc => canon(pc.pos)));
  const cands = canonNodes().filter(n => !isExit(n) && !occupied.has(n) && !G.poops.some(x => canon(x.node) === n));
  if (!cands.length) return;
  const mine = G.poops.filter(x => x.owner === p.id);
  if (mine.length >= 3) G.poops.splice(G.poops.indexOf(mine[0]), 1);
  const n = pick(cands);
  G.poops.push({ node: n, owner: p.id });
  say(`💩 ${p.name}: 히히 똥! (${n}번 칸)`);

async function resolveEnemiesAt(node, actor) {

function fourCheck(p) {
  const cnt = {};
  p.pieces.filter(onBoard).forEach(x => { const c = canon(x.pos); cnt[c] = (cnt[c] || 0) + 1; });
  if (Object.values(cnt).some(c => c >= 4)) return true;
  const occ = new Set(Object.keys(cnt).map(Number));
  for (const L of LINES) {
    const cl = L.map(canon);
    for (let i = 0; i + 3 < cl.length; i++) { const w = cl.slice(i, i + 4); if (new Set(w).size === 4 && w.every(n => occ.has(n))) return true; }
  }
  return false;
}

    if (has(p, 'alone')) {

      else if (groupCount === 1 && p.aloneArmed) await specialWin(p, '천상천하 유아독존: 판에 말뭉치 1개', 'alone');
    }
  }
}
async function checkCatLove() {

  for (const L of G.players) {

    say('🐱 고양이 좋아: 고양이를 고른 플레이어가 있습니다!');
    await specialWin(L, '고양이 좋아', 'catlove');
  }
}

async function acquire(p, id, opts = {}) {
  const A = AUG_BY[id];
  const inst = { id, used: false, disabled: false, catUntil: 0 };
  p.augs.push(inst);
  if (G.draft) G.draft.picks.push({ pid: p.id, id, inst });
  SFX.play('aug');
  say(`✨ ${p.name} 증강 획득: ${A.name}`, p.color);
  render();
  const h = ON_ACQ[id];
  if (h) await h(p, inst, opts);
  if (A.kind === 'instant') inst.used = true;
  if (!G.over) await checkCatLove();
  if (!G.over) await checkBoardWins();
  render();
}
function revertGlobal(id, owner) {
  if (id === 'chosen') G.chosenRule = G.players.some(q => has(q, 'chosen'));
  if (id === 'echo' && G.echo && G.echo.owner === owner.id) G.echo = null;
  if (id === 'murder') G.murder = G.players.some(q => has(q, 'murder'));
}
function pieceLabel(pc) {
  const t = TYPE_NAME[pc.type];
  if (pc.pos === HOME) return `대기 중인 ${t}`;
  const s = stackOf(pc).length;
  return `${canon(pc.pos)}번 칸 ${t}${s > 1 ? ` (${s}개 업힘)` : ''}`;
}
async function pickOwnPiece(p, filter, msg, aiFn) {
  const cands = p.pieces.filter(filter);
  if (!cands.length) { say(`${msg}: 고를 수 있는 말이 없습니다`); return null; }
  return UI.pickPiece(p, cands, msg, { ai: aiFn || (() => AI.bestPieceFor(p, cands)) });
}

function dokPiece(p) { return p.pieces.find(x => x.type === 'dokkaebi' && x.pos !== DONE && !(onBoard(x) && stackBound(stackOf(x)))); }

function cannonMoves(p) {
  const c = cannonPiece(p);
  if (!c) return [];
  const here = canon(c.pos), res = [];
  for (const L of LINES) {
    const cl = []; L.forEach(n => { const k = canon(n); if (cl[cl.length - 1] !== k) cl.push(k); });
    const i = cl.indexOf(here);
    if (i < 0) continue;
    for (const d of [1, -1]) {
      let j = i + d, screen = false;
      const path = [];
      while (j >= 0 && j < cl.length) {
        const n = cl[j];
        path.push(n);
        const occ = piecesAt(n).filter(x => x !== c);
        if (!screen) { if (occ.length) screen = true; }
        else if (occ.length) {
          if (occ.some(x => x.owner !== p.id) && !isExit(n)) res.push({ to: n, path: path.slice(), capture: true });
          break;
        } else if (!isExit(n)) res.push({ to: n, path: path.slice(), capture: false });

}
function badukOptions(p) {
  const res = [], keys = new Set();
  for (const L of LINES) {

    const idx = [];
    cl.forEach((n, i) => { if (piecesAt(n).some(x => x.owner === p.id)) idx.push(i); });
    for (let a = 0; a < idx.length; a++) for (let b = a + 1; b < idx.length; b++) {
      const i1 = idx[a], i2 = idx[b];
      if (i2 - i1 < 2) continue;
      const vs = new Set();
      for (let k = i1 + 1; k < i2; k++) piecesAt(cl[k]).filter(x => x.owner !== p.id).forEach(x => vs.add(x));
      const key = [cl[i1], cl[i2]].sort((x, y) => x - y).join('-');
      if (vs.size && !keys.has(key)) { keys.add(key); res.push({ a: cl[i1], b: cl[i2], victims: [...vs] }); }
    }
  }

}
function backNodes(pc, p) {
  const out = [];

}
async function truckMove(p, s) {

function availableActions(p) {

    const inst = aug(p, a.aug);
    if (!inst) return false;
    if (a.once && inst.used) return false;
    if (a.fresh && !G.T.fresh) return false;
    try { return !!a.can(p); } catch (e) { return false; }
  });
}
async function useAction(p, key) {
  const a = ACTIONS.find(x => x.key === key);
  if (!a) return;
  const inst = aug(p, a.aug);
  if (!inst || (a.once && inst.used) || !availableActions(p).includes(a)) return;
  const ok = await a.run(p);
  if (ok && a.once) inst.used = true;
  render();
}

async function turnStart(p) {
  p.st.turns++;
  if (has(p, 'kim') && p.pieces.some(x => x.type === 'kim' && x.pos !== DONE)) p.st.kimTurns++;
  if (G.echo && G.echo.owner === p.id && !G.echo.active) { G.echo.active = true; say('🔁 메아리의 형상: 지금부터 모든 플레이어가 차례를 두 번씩!', true); }
  const mine = G.targets.filter(t => t.owner === p.id);
  G.targets = G.targets.filter(t => t.owner !== p.id);
  for (const t of mine) {
    const vs = piecesAt(t.node);
    say(`🎯 ${p.name}의 명사수 발사! ${t.node}번 칸 (${vs.length}개)`, p.color);
    SFX.play('boom');
    await R.fxShot(t.node);
    if (vs.length) await killPieces(vs, p, 'sniper');
    if (p.out || G.over) return;
  }
  if (has(p, 'demon')) {
    const n = p.pieces.filter(x => x.type === 'cultist' && onBoard(x)).length;
    if (n) { p.st.ritual += n; say(`🔮 의식 코인 +${n} (${p.st.ritual}/12)`); }
    if (p.st.ritual >= 12) { UI.flash('마신 강림!', '#8f5fd0'); if (await specialWin(p, '마신 소환: 의식 코인 12개', 'demon')) return; }
  }
  if (p.domainPiece) {
    const pc = p.pieces.find(x => x.id === p.domainPiece);
    if (pc && pc.domain && onBoard(pc)) {
      p.st.domainTurns++;
      say(`🔯 영역 전개 ${p.st.domainTurns}/2`);
      if (p.st.domainTurns >= 2) { p.domainPiece = null; pc.domain = false; if (await specialWin(p, '영역 전개: 두 차례 생존', 'domain')) return; }
    } else p.domainPiece = null;
  }
  while (p.st.fishPending > 0) { p.st.fishPending--; G.T.chips.push(2); say(`🎣 ${p.name} 어부지리: 개 획득`); }
  if (has(p, 'poop')) placePoop(p);
  if (p.pieces.some(x => x.type === 'queen' && onBoard(x)) && has(p, 'queen')) say(`👑 중전마마 던진 횟수 ${p.st.queenThrows}/12`);
  render();
}

  else if (act.type === 'action') await useAction(p, act.key);
}
const hasTurnActions = p => availableActions(p).length > 0;
async function playTurn(p) {
  G.T = { pid: p.id, throwsLeft: 1, chips: [], counts: {}, fresh: true, poisoned: false, lastDance: false, usedDok: false, usedCannon: false, endNow: false, aiTried: new Set() };
  UI.sel = null;
  SFX.play('turn');
  render();
  if (p.skip > 0) {
    p.skip--;
    say(`⏭ ${p.name} 차례를 건너뜁니다${p.skip ? ` (앞으로 ${p.skip}번 더)` : ''}`, p.color);
    UI.flash(`${p.name} 건너뜀`, p.color);
    await sleep(1000);
    await turnEnd(p, true);
    return;
  }
  if (!p.ai && G.players.filter(q => !q.ai && !q.out).length > 1) UI.toast(`${p.name} (${p.cname}) 차례입니다`, p.color);
  await turnStart(p);
  while (!G.over && !p.out && !G.T.endNow) {
    const T = G.T;
    if (T.throwsLeft <= 0 && T.chips.length && !T.chips.some(v => movableLeads(p, v).length)) {
      say(`움직일 수 없는 결과(${T.chips.map(resName).join(', ')})는 버립니다`);
      T.chips = []; UI.sel = null;
    }
    const idle = T.throwsLeft <= 0 && !T.chips.length;
    if (idle && !p.ai && !hasTurnActions(p)) break;
    const act = p.ai ? await AI.act(p) : await UI.waitAction(p);
    if (!act || act.type === 'end') break;
    await performAction(p, act);
    if (!G.over) await checkBoardWins();
    render();
  }
  await turnEnd(p, false);
}
function newRound() {
  G.round++;
  if (G.round > 80) { say('80라운드가 지나 진행도로 순위를 정합니다', true); G.over = true; return; }
  if (DRAFT_ROUNDS.includes(G.round)) G.needDraft = true;
  if (G.fog && G.round >= G.fog.until) { G.fog = null; say('🌫 안개가 걷혔습니다'); }
  say(`── ${G.round}라운드 ──`);
}
function advanceTurn() {
  const cur = P(G.turnIdx);
  if (G.echo && G.echo.active && !G.echoSecond && !cur.out) { G.echoSecond = true; say(`🔁 메아리: ${cur.name} 한 번 더!`); return; }
  G.echoSecond = false;
  let i = G.turnIdx;
  for (let k = 0; k < G.n; k++) {
    i = (i + 1) % G.n;
    if (i === 0) newRound();
    if (!P(i).out) break;
  }
  G.turnIdx = i;
}

/* =====================================================================
   15. 증강 선택 라운드 (1R 시작 / 4R 중간 / 8R 마무리)
   ===================================================================== */
// 비밀 투표·비밀 지목 증강: 사람이 2명 이상 모여서 할 때(모여서 하기 모드)는 풀에서 뺀다
const SECRET_AUGS = ['getdown', 'detective', 'delivery', 'plan', 'whoami'];
const secretBanned = () => !!G.gather && G.players.filter(q => !q.ai).length >= 2;
const augAllowed = id => !(secretBanned() && SECRET_AUGS.includes(id));
function drawOptions(p, cat, excl) {
  const owned = id => p.augs.some(a => a.id === id);
  const opts = [];
  if (p.delivery) { if (!owned(p.delivery) && !excl.has(p.delivery) && augAllowed(p.delivery)) opts.push(p.delivery); p.delivery = null; }
  if (G.chosenRule && !owned('cat') && !opts.includes('cat') && !excl.has('cat') && Math.random() < 0.6) opts.push('cat');
  const pool = shuffle(AUGS.filter(a => (a.cat === 'general' || a.cat === cat) && !owned(a.id) && !excl.has(a.id) && !opts.includes(a.id) && augAllowed(a.id)).map(a => a.id));
  while (opts.length < 3 && pool.length) opts.push(pool.pop());
  return opts;
}
async function draftRound() {
  const cat = G.round === DRAFT_ROUNDS[0] ? 'start' : G.round === DRAFT_ROUNDS[1] ? 'mid' : 'end';
  G.draft = { cat, banned: new Set(), picks: [], reroll: false };
  render();
  UI.flash(`${G.round}라운드 증강 선택`, '#e3b34a');
  say(`🃏 ${G.round}라운드 증강 선택 (${CAT_NAME[cat]} 전용 + 범용)${G.chaos ? ' · 혼돈 모드: 2번씩' : ''}`);
  await sleep(1000);
  const times = G.chaos ? 2 : 1;
  for (const p of G.players) {
    for (let k = 0; k < times; k++) {
      if (p.out || G.over) break;
      const excl = new Set();
      for (let guard = 0; guard < 6; guard++) {
        const opts = drawOptions(p, cat, excl);
        if (!opts.length) break;
        const forced = (G.chosenRule || has(p, 'catpick')) && opts.includes('cat');
        const id = await UI.draftPick(p, opts, forced, { k, times, cat });
        if (G.draft.banned.has(id)) {
          p.augs.push({ id, used: true, disabled: true, catUntil: 0 });
          say(`🔍 명탐정: ${p.name}의 「${AUG_BY[id].name}」 선택이 무효화되었습니다`, true);
          break;
        }
        await acquire(p, id);
        if (G.draft && G.draft.reroll) { G.draft.reroll = false; opts.forEach(o => excl.add(o)); continue; }
        break;
      }
    }
    if (G.over) break;
  }
  G.draft = null;
  render();
}

/* =====================================================================
   16. 메인 루프 · 종료
   ===================================================================== */
async function flushPendingWins() {
  const list = G.pendingWins;
  G.pendingWins = [];
  for (const w of list) {
    const p = P(w.pid);
    if (G.over || p.out || !has(p, w.augId)) continue;
    say(`${WIN_FROM_ROUND}라운드: 미뤄 둔 ${p.name}의 승리 조건이 발동합니다`);
    await specialWin(p, w.why, w.augId);
  }
}
async function gameLoop() {
  while (!G.over) {
    checkpoint();
    if (G.round >= WIN_FROM_ROUND && G.pendingWins.length) { await flushPendingWins(); if (G.over) break; }
    if (G.needDraft) { G.needDraft = false; await draftRound(); if (G.over) break; }
    const p = P(G.turnIdx);
    if (p.out) { advanceTurn(); continue; }
    await playTurn(p);
    G.T = null;
    UI.sel = null;
    render();
    if (G.over) break;
    advanceTurn();
    render();
    await sleep(260);
  }
  await finishGame();
}
async function finishGame() {
  G.over = true;
  G.T = null;
  clearSave();
  const rest = G.players.filter(p => p.rank == null).sort((a, b) => progress(b) - progress(a));
  for (const p of rest) { const r = bestFree(); p.rank = r; G.rankTaken.add(r); p.outReason = p.outReason || '진행도 기준 순위'; }
  const order = G.players.slice().sort((a, b) => a.rank - b.rank || a.id - b.id);
  G.planWinner = null;
  for (const p of G.players) {
    if (!p.plan || !has(p, 'plan')) continue;
    const actual = order.map(q => q.id);
    const hit = actual.every((id, i) => id === p.plan[i]);
    say(`📜 ${p.name}의 계획대로: ${p.plan.map(id => P(id).name).join(' > ')} — ${hit ? '적중!' : '빗나감'}`);
    if (!hit) continue;
    const q = G.players.find(x => x.id !== p.id && has(x, 'cancel') && !aug(x, 'cancel').used);
    if (q) { aug(q, 'cancel').used = true; SFX.play('cancel'); UI.flash('취~소!', q.color); say(`✋ ${q.name}: 취~소! 계획대로가 무효`); await sleep(1000); continue; }
    G.planWinner = p;
    UI.flash('계획대로!', p.color);
    SFX.play('win');
    await sleep(1200);
    break;
  }
  render();
  UI.results(order);
}
const ABORT = new Error('게임 중단');

/* ----- 중간 저장 / 이어하기 -----
   차례가 시작되기 직전(이전 차례가 끝난 시점)의 상태를 저장한다. 차례 도중에 앱이 닫히면
   그 차례의 처음부터 이어진다. Set 은 {__set:[...]} 로 바꿔 저장한다. */
const SAVE_KEY = 'augyut-save-v1';
let lastSnap = null;
function serializeGame() {
  const g = { ...G, T: null, draft: null, alk: null, anim: null, fx: [], mask: null };
  return JSON.stringify({ v: 1, cfg: { ...CFG, slots: CFG.slots.slice() }, pieceId: PIECE_ID, G: g },
    (k, v) => (v instanceof Set ? { __set: [...v] } : v));
}
function parseSave(str) {
  try {
    const snap = JSON.parse(str, (k, v) => (v && typeof v === 'object' && !Array.isArray(v) && Array.isArray(v.__set) && Object.keys(v).length === 1 ? new Set(v.__set) : v));
    if (!snap || snap.v !== 1 || !snap.G || !Array.isArray(snap.G.players) || snap.G.over) return null;
    return snap;
  } catch (e) { return null; }
}
function readSave() { try { const s = localStorage.getItem(SAVE_KEY); return s ? parseSave(s) : null; } catch (e) { return null; } }
function writeSave(str) { if (!str) return; try { localStorage.setItem(SAVE_KEY, str); } catch (e) { /* 저장 공간이 없어도 게임은 계속 */ } }
function clearSave() { lastSnap = null; try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* 무시 */ } }
function checkpoint() {
  if (!G || G.over) return;
  try { lastSnap = serializeGame(); } catch (e) { lastSnap = null; return; }
  writeSave(lastSnap);
}
function flushSave() { if (G && !G.over && lastSnap) writeSave(lastSnap); }
function restoreSnap(snap) {
  Object.assign(CFG, snap.cfg, { slots: snap.cfg.slots.slice() });
  PIECE_ID = snap.pieceId;
  G = snap.G;
  G.T = null; G.draft = null; G.alk = null; G.anim = null; G.fx = []; G.mask = null;
  if (!G.pendingWins) G.pendingWins = [];
  if (!(G.rankTaken instanceof Set)) G.rankTaken = new Set(G.rankTaken || []);
}
async function resumeGame() {
  const snap = readSave();
  if (!snap) { UI.buildTitle(); return; }
  GEN++;
  SKIP = false;
  UI.closeAll();
  restoreSnap(snap);
  window.__resumeCheck = serializeGame();
  UI.enterGame();
  render();
  say(`저장된 판을 ${G.round}라운드부터 이어서 합니다`);
  try { await gameLoop(); }
  catch (e) { if (e !== ABORT) { console.error(e); UI.toast('오류: ' + e.message, '#e33'); } }
}
async function startGame() {
  GEN++;
  SKIP = false;
  UI.closeAll();
  clearSave();
  newGame();
  UI.enterGame();
  render();
  say('윷판을 펼쳤습니다. 1라운드 증강 선택부터 시작합니다');
  try { await gameLoop(); }
  catch (e) { if (e !== ABORT) { console.error(e); UI.toast('오류: ' + e.message, '#e33'); } }
}

/* =====================================================================
   17. 안개 시야 (렌더러·AI 공용)
   ===================================================================== */
const fogActive = () => !!(G && G.fog && G.round < G.fog.until);
function visibleSet(viewer) {
  if (!fogActive() || !viewer || viewer.id === G.fog.caster) return null;
  const vis = new Set();
  for (const pc of viewer.pieces.filter(onBoard)) {
    const c = canon(pc.pos);
    vis.add(c);
    for (const n of NODES) if (canon(n) === c) for (const m of ADJ[n]) vis.add(canon(m));
  }
  return vis;
}

/* =====================================================================
   18. 스마트 AI
   ===================================================================== */
const AI = {
  delay(ms) { return CFG.fast ? Math.round(ms * 0.35) : ms; },
  W: {
    truck: 4, triple: 6, fold: 4, cat: 1, chosen: 2, catpick: 1, catlove: 6, excess: 2, dogpig: 4, leech: 3, whoami: 3, notme: 4, getdown: 4,
    doberman: 5, spin: 4, sniper: 4, detective: 3, moordo: 4, baduk: 5, delivery: 4, dokkaebi: 6, vanguard: 7, cannon: 5, pawn: 4, four: 5,
    cowback: 3, hand: 6, timetravel: 4, score: 5, fog: 3, alkkagi: 5, fisher: 5, illusion: 4, throwhit: 6, dual: 7, objection: 2, jajin: 5,
    moonwalk: 3, shield: 6, redbutton: 5, friendshield: 5, sacrifice: 4, poop: 4,
    equiv: 6, party: 4, speed: 7, kim: 6, queen: 4, bear: 6, piggy: 5, burden: 5, alone: 4,
    seven: 5, nofriend: 4, demon: 8, coup: 7, treason: 5, wait: 6, peace: 5,
    plan: 3, murder: 6, necro: 3, grail: 5, bronze: 1, lastdance: 2, echo: 4, marathon: 8, duel: 5, comeback: 8, domain: 5, cancel: 6, cannibal: 3
  },
  level() { return CFG.difficulty || 'normal'; },
  noise() { return { easy: 45, normal: 10, hard: 0.5 }[this.level()] ?? 10; },
  pickAug(p, opts, forced) {
    if (forced) return 'cat';
    if (this.level() === 'easy') return pick(opts);
    let best = opts[0], bs = -1e9;
    const anyCat = G.players.some(q => hasCat(q));
    const catLovers = G.players.filter(q => !q.out && has(q, 'catlove'));
    for (const id of opts) {
      let s = (this.W[id] ?? 4) + Math.random() * (this.level() === 'hard' ? 3 : 6);
      if (id === 'catlove') s = anyCat ? 100 : s;
      if (id === 'cat') s = has(p, 'catlove') ? 100 : (catLovers.some(q => q.id !== p.id) ? -10 : s);
      if (id === 'chosen' && catLovers.some(q => q.id !== p.id)) s = -5;
      if (id === 'illusion' && has(p, 'catlove')) s = 60;
      if (id === 'bronze') { const order = live().sort((a, b) => progress(b) - progress(a)); s = (G.n >= 4 && order[order.length - 1] === p) ? 7 : 0.5; if (G.n === 2) s = -10; }
      if (id === 'necro' && !G.players.some(q => q.elim)) s = 2;
      if (id === 'four' && needPieces(p).length < 4) s = 0;
      if (id === 'lastdance' && this.remain(p) <= 5) s = 7;
      if (id === 'speed' && G.n >= 3) s += 1;
      if (id === 'cannibal' && has(p, 'piggy')) s = 0;
      if (s > bs) { bs = s; best = id; }
    }
    return best;
  },
  leader(p, cands) {
    if (!cands || !cands.length) return null;
    if (this.level() === 'easy') return pick(cands);
    return cands.slice().sort((a, b) => (progress(b) + (b.augs.filter(x => AUG_BY[x.id].kind === 'win').length * 15)) - (progress(a) + (a.augs.filter(x => AUG_BY[x.id].kind === 'win').length * 15)))[0];
  },
  remain(p) { return needPieces(p).filter(x => x.pos !== DONE).reduce((s, pc) => s + stepsToFinish(pc.pos, pc.trail, p.reverse), 0); },
  boardSteps(q) { return q.out ? 0 : q.pieces.filter(onBoard).reduce((s, pc) => s + stepsToFinish(pc.pos, pc.trail, q.reverse), 0); },
  danger(p, node, excl) {
    if (has(p, 'peace')) return 0;
    const PR = { '-1': 0.05, 1: 0.17, 2: 0.35, 3: 0.26, 4: 0.1, 5: 0.07 };
    const target = canon(node);
    let d = 0;
    for (const q of G.players) {
      if (q.out || q.id === p.id || has(q, 'peace')) continue;
      const leads = [], seen = new Set();
      for (const pc of q.pieces) {
        if (pc.pos === DONE || pc.type === 'pawn') continue;
        const k = pc.pos === HOME ? 'H' : 'n' + canon(pc.pos);
        if (seen.has(k)) continue;
        seen.add(k); leads.push(pc);
      }
      for (const pc of leads) for (const [v, pr] of Object.entries(PR)) {
        const r = computePath(pc, +v, q, [pc]);
        if (!r.finished && r.path.length && canon(r.path[r.path.length - 1]) === target) d += pr;
      }
    }
    return Math.min(1, d);
  },
  evalMove(p, lead, v) {
    const amt = modValue(p, v);
    const stack = lead.pos === HOME ? [lead] : stackOf(lead);
    const r = computePath(lead, amt, p, stack);
    if (!r.path.length && !r.finished) return -1e9;
    const n = stack.length;
    const special = stack.some(x => x.type === 'kim' || x.type === 'marathon') ? 2.5 : 1;
    const before = lead.pos === HOME ? stepsToFinish(HOME, [], p.reverse) + 2 : stepsToFinish(lead.pos, lead.trail, p.reverse);
    const value = n * 12 * special + (stack.some(x => x.type === 'queen') ? 70 : 0) + (stack.some(x => x.domain) ? 90 : 0);
    const dNow = lead.pos === HOME ? 0 : this.danger(p, lead.pos, stack);
    if (r.finished) return 60 * n * special + before + dNow * value - (stack.some(x => x.type === 'queen') ? 10 : 0);
    const dest = r.path[r.path.length - 1];
    const after = stepsToFinish(dest, r.trail, p.reverse);
    let s = (before - after) * 2.2 * n * special;
    if (lead.pos === HOME) s += 4;
    const vis = visibleSet(p);
    const here = piecesAt(dest).filter(x => !stack.includes(x));
    const en = vis && !vis.has(canon(dest)) ? [] : here.filter(x => x.owner !== p.id);
    if (en.length) {
      const blocked = has(p, 'peace') || en.some(x => has(P(x.owner), 'peace'));
      if (!blocked) {
        if (en.some(x => x.shield > 0)) s -= 6;
        else s += 35 + 12 * en.length + (has(p, 'coup') ? 25 : 0) + (has(p, 'murder') ? 15 : 0) + (v < 0 && has(p, 'cowback') ? 45 : 0) + (en.some(x => x.type === 'queen') ? 30 : 0);
      }
    }
    const mine = here.filter(x => x.owner === p.id && x.type !== 'pawn');
    if (mine.length) {
      if (has(p, 'cannibal')) {
        const lost = mine.reduce((a, x) => a + Math.max(0, stepsToFinish(HOME, [], p.reverse) - stepsToFinish(x.pos, x.trail, p.reverse)), 0);
        s += (G.T && G.T.chips.length > 6 ? -20 : 6) - lost * 2.2 - 4 * mine.length;
      } else s += 8 * mine.length + (has(p, 'four') ? 15 : 0);
    }
    if (r.poop) s -= 3;
    const tr = G.traps.find(t => canon(t.node) === canon(dest));
    if (tr) s += tr.kind === 'gift' ? 8 : (tr.owner === p.id ? 0 : -25 * n);
    const g = G.garlics.find(x => x.owner === p.id);
    if (g && has(p, 'bear')) for (const x of r.path) if (g.nodes.some(y => canon(y) === canon(x))) s += 35;
    if (!p.reverse && [5, 10, 22].includes(canon(dest))) s += 6;
    if (p.reverse && [15, 10, 22].includes(canon(dest))) s += 6;
    const dNew = this.danger(p, dest, stack);
    s += (dNow - dNew) * value;
    if (stack.some(x => x.shield > 0)) s += dNew * value * 0.7;
    return s + Math.random() * this.noise();
  },
  bestMove(p) {
    const T = G.T;
    let best = null;
    const tried = new Set();
    if (this.level() === 'easy' && Math.random() < 0.35) {
      // 쉬움: 가끔은 아무 말이나 움직인다
      const opts = [];
      T.chips.forEach((v, ci) => movableLeads(p, v).forEach(piece => opts.push({ s: 0, chip: ci, piece })));
      if (opts.length) return pick(opts);
    }
    T.chips.forEach((v, ci) => {
      if (tried.has(v)) return;
      tried.add(v);
      const homeSeen = new Set();
      for (const lead of movableLeads(p, v)) {
        if (lead.pos === HOME) { if (homeSeen.has(lead.type)) continue; homeSeen.add(lead.type); }
        const s = this.evalMove(p, lead, v);
        if (!best || s > best.s) best = { s, chip: ci, piece: lead };
      }
    });
    return best;
  },
  async act(p) {
    await sleep(this.delay(420));
    const T = G.T;
    T.aiSteps = (T.aiSteps || 0) + 1;
    if (T.aiSteps > 250) return { type: 'end' };
    for (const a of availableActions(p)) {
      if (T.aiTried.has(a.key)) continue;
      let want = false;
      try { want = this.want(p, a.key); } catch (e) { want = false; }
      if (want) { if (a.key !== 'doberman') T.aiTried.add(a.key); return { type: 'action', key: a.key }; }
    }
    if (T.throwsLeft > 0) return { type: 'throw' };
    const b = this.bestMove(p);
    if (b) return { type: 'move', chip: b.chip, piece: b.piece };
    return { type: 'end' };
  },
  want(p, key) {
    const lv = this.level();
    if (lv === 'easy') {
      // 쉬움: 변환·코인처럼 단순한 것만 바로 쓰고, 나머지는 가끔 아무 때나 쓴다
      if (['dokkaebi', 'cannon', 'pawn', 'marathon', 'necro'].includes(key)) return true;
      if (key === 'doberman') return G.T.throwsLeft > 0;
      if (['lastdance', 'grail', 'domain', 'triple', 'truck', 'alkkagi'].includes(key)) return Math.random() < 0.05;
      return Math.random() < 0.12;
    }
    const smart = this.wantSmart(p, key);
    return lv === 'normal' ? smart && Math.random() < 0.8 : smart;
  },
  wantSmart(p, key) {
    const T = G.T, idle = T.throwsLeft <= 0 && !T.chips.length;
    const foes = boardPieces().filter(x => x.owner !== p.id && !has(P(x.owner), 'peace'));
    switch (key) {
      case 'truck': return myStacks(p).some(s => s.length >= 2 && !stackBound(s) && this.truckLen(p, s) >= 4);
      case 'triple': {
        const big = Math.max(...myStacks(p).filter(s => s.length >= 3).map(s => s.length));
        return foes.length >= 2 && p.pieces.filter(onBoard).length - big <= 1;

        c.globalAlpha = 1 - k; c.strokeStyle = f.color; c.lineWidth = 5; c.shadowColor = f.color; c.shadowBlur = 14;
        c.beginPath(); c.arc(f.x, f.y, S * 0.045 + S * 0.04 * k, 0, Math.PI * 2); c.stroke();
      } else if (f.type === 'shot') {
        const r = S * (0.18 - 0.14 * Math.min(1, k * 1.6));
        c.strokeStyle = '#cf3f2c'; c.lineWidth = 3; c.globalAlpha = 1 - Math.max(0, k - 0.7) * 3;
        c.beginPath(); c.arc(f.x, f.y, r, 0, Math.PI * 2); c.moveTo(f.x - r * 1.3, f.y); c.lineTo(f.x + r * 1.3, f.y); c.moveTo(f.x, f.y - r * 1.3); c.lineTo(f.x, f.y + r * 1.3); c.stroke();
        if (k > 0.6) { c.fillStyle = `rgba(255,220,120,${1 - k})`; c.beginPath(); c.arc(f.x, f.y, S * 0.06, 0, Math.PI * 2); c.fill(); }
      } else if (f.type === 'nova') {
        c.globalAlpha = 1 - k; c.strokeStyle = f.color || '#fff'; c.lineWidth = 8 * (1 - k) + 2;
        c.beginPath(); c.arc(f.x, f.y, S * 0.9 * k, 0, Math.PI * 2); c.stroke();

        const a = this.U(...XY[canon(5)]), b = this.U(...XY[canon(15)]), d1 = this.U(...XY[canon(10)]), d2 = this.U(...XY[canon(0)]);
        c.beginPath(); c.moveTo(...a); c.lineTo(...b); c.moveTo(...d1); c.lineTo(...d2); c.stroke();

  },
  async animRotate() { if (SKIP) return; this.rot = { t0: performance.now(), dur: 750 }; await this.wait(() => this.rot && this.rot.done); this.rot = null; },
  async animFold(dir) {
    if (SKIP) return;
    const ex = XY[canon(0)];
    this.fold = { dir, t0: performance.now(), dur: 850, keepHigh: dir === 'h' ? ex[1] > 0.5 : ex[0] > 0.5 };

};
function animateMove(stack, from, path, p) {
  if (SKIP || !path.length || !R.cv || $('#game').hidden) return Promise.resolve();
  return new Promise(res => {
    const pts = [from === HOME ? R.homePt() : R.NP(from), ...path.map(n => R.NP(n))];
    G.anim = { ids: new Set(stack.map(x => x.id)), pieces: stack.slice(), pts, t0: performance.now(), step: (CFG.fast && p.ai) ? 85 : 145, last: 0, res, g: GEN };
  });
}

const UI = {

    });

    });
    for (const [id, key] of [['#optChaos', 'chaos'], ['#optFirst', 'endOnFirst'], ['#optFast', 'fast'], ['#optGather', 'gather']]) {
      $(id).addEventListener('change', e => { CFG[key] = e.target.checked; this.saveCfg(); });
    }
    $('#optSound').addEventListener('change', e => { SFX.on = e.target.checked; CFG.sound = SFX.on; this.saveCfg(); });
    $('#startBtn').addEventListener('click', () => { SFX.init(); SFX.play('aug'); startGame(); });
    $('#resumeBtn').addEventListener('click', () => { SFX.init(); SFX.play('aug'); resumeGame(); });
    $('#rulesBtn1').addEventListener('click', () => this.rules());
    $('#bookBtn1').addEventListener('click', () => this.book());
    $('#chips').addEventListener('click', e => {
      const b = e.target.closest('button[data-ci]'); if (!b || b.disabled) return;
      this.sel = +b.dataset.ci; SFX.play('click'); this.refresh();
    });
    $('#throwBtn').addEventListener('click', () => { SFX.init(); if (this.wait && G.T && G.T.throwsLeft > 0) this.submit({ type: 'throw' }); });
    $('#homeRow').addEventListener('click', e => {
      const b = e.target.closest('button[data-pc]'); if (!b || b.disabled || !this.wait || this.sel == null) return;
      const p = this.wait.p, pc = p.pieces.find(x => x.id === +b.dataset.pc);
      if (pc) this.submit({ type: 'move', chip: this.sel, piece: pc });
    });
    $('#actives').addEventListener('click', e => {

    });
    $('#endBtn').addEventListener('click', () => { if (this.wait) this.submit({ type: 'end' }); });
    $('#ticker').addEventListener('click', () => this.logView());
    $('#players').addEventListener('click', e => {
      const b = e.target.closest('[data-pid]'); if (!b || !G) return;

    $('#bookBtn').addEventListener('click', () => this.book());

  },
  loadCfg() {
    try {
      const s = JSON.parse(localStorage.getItem('augyut-cfg') || 'null');
      if (s) { Object.assign(CFG, { n: s.n || 4, slots: s.slots || CFG.slots, chaos: !!s.chaos, endOnFirst: !!s.endOnFirst, fast: !!s.fast, difficulty: ['easy', 'normal', 'hard'].includes(s.difficulty) ? s.difficulty : 'normal', gather: s.gather !== false }); if (s.sound === false) SFX.on = false; }

      <div class="seg"><button type="button" data-slot="${i}" data-v="human" class="${CFG.slots[i] === 'human' ? 'on' : ''}">사람</button><button type="button" data-slot="${i}" data-v="ai" class="${CFG.slots[i] === 'ai' ? 'on' : ''}">AI</button></div>
