      ${sec('general', '범용 — 1·6·12라운드')}${sec('start', '시작 전용 — 1라운드')}${sec('mid', '중간 전용 — 6라운드')}${sec('end', '마무리 전용 — 12라운드')}`);
  },
  rules() {
    this.info('룰북', `<div class="rules">
      <h3>목표</h3><p>자기 말 4개를 모두 출발점(우하단 0번)에서 한 바퀴 돌려 다시 도착시키면 순위를 얻습니다. 증강의 특수 승리 조건을 이루면 그 즉시 승리합니다.</p>
      <h3>던지기</h3><ul><li>앞면(평평한 면) 개수: 1=도, 2=개, 3=걸, 4=윷, 0=모. 빨간 점이 찍힌 윷 하나만 앞면이면 빽도.</li><li>윷·모가 나오거나 상대 말을 잡으면 한 번 더 던집니다.</li><li>나온 결과는 아래 칩으로 쌓입니다. 칩을 고른 뒤 판 위의 말(또는 대기 말)을 터치해 움직이세요.</li></ul>
      <h3>길</h3><ul><li>5번·10번 모서리나 중앙(22번)에서 출발하면 지름길로 들어갑니다. 5번 지름길로 중앙을 지나면 15번 쪽으로 곧장, 중앙에 멈췄다 출발하면 출구 쪽으로 갑니다.</li><li>출구(0번)에 닿거나 지나면 완주. 빽도로 0번에 앉은 말은 다음 이동에 완주합니다.</li><li>내 말끼리 만나면 업고 함께 움직입니다. 상대 말 칸에 멈추면 잡습니다.</li></ul>
      <h3>라운드와 증강</h3><ul><li>모든 플레이어가 한 번씩 두면 1라운드.</li><li>1라운드(시작 전용+범용), 6라운드(중간 전용+범용), 12라운드(마무리 전용+범용) 시작에 3장 중 1장을 고릅니다. 혼돈 모드는 2번씩.</li><li>액티브 증강은 내 차례에 아래 금색 버튼으로 씁니다. 빨간 테두리 버튼은 차례를 통째로 씁니다.</li></ul>
      <h3>순위</h3><ul><li>완주·특수 승리는 남은 가장 높은 순위, 탈락은 남은 가장 낮은 순위를 받습니다.</li><li>‘1위가 나오면 바로 종료’를 끄면 마지막 한 명이 남을 때까지 겨룹니다. 그 전에 끝나면 남은 사람은 진행도로 순위를 매깁니다.</li></ul>
      <h3>한 기기에서</h3><p>비밀 선택(계획대로·명탐정·배달·내려 투표·나 누구게?)은 가림막이 뜹니다. 해당 플레이어만 화면을 보고 터치하세요.</p>
      <h3>판 변형</h3><ul><li>게임 접어라: 출구가 있는 절반이 남고 반대편 칸은 거울 칸과 합쳐집니다. 출구와 겹친 모서리는 출구가 됩니다.</li><li>돌려돌려 돌림판: 판이 시계방향 90° 회전하고, 출구 자리는 그대로라 각 말의 남은 거리가 바뀝니다.</li><li>알까기: 판 위 말뭉치가 알이 됩니다. 내 알을 당겼다 놓으면 반대쪽으로 튕겨 나가고, 점선 밖으로 나간 알은 죽습니다.</li></ul>
      </div><div class="mopts"><button type="button" class="mbtn" data-info="book">증강 도감 보기</button></div>`);
  },
  logView() {
    if (!G) return;
    this.info('게임 기록', `<div class="loglist">${G.log.slice().reverse().map(l => `<div>${esc(l)}</div>`).join('')}</div>`);
  },
  playerDetail(q) {
    const pcs = q.pieces.map(pc => `<li>${esc(TYPE_NAME[pc.type])} — ${pc.pos === HOME ? '대기' : pc.pos === DONE ? '완주' : `${canon(pc.pos)}번 칸`}${pc.shield ? ' · 보호막' : ''}${isBound(pc) && onBoard(pc) ? ' · 속박' : ''}${pc.type === 'queen' ? ` · 목숨 ${pc.lives}` : ''}</li>`).join('');
    const augs = q.augs.length ? q.augs.map(a => {
      const A = AUG_BY[a.id], cat = a.catUntil && G.round < a.catUntil;
      const st = a.disabled ? '무효' : cat ? `고양이로 착각 중 (${a.catUntil - 1}R까지)` : a.used ? '사용함' : '';
      return `<div class="book-item"><div class="tags"><span class="tg ${A.cat}">${CAT_NAME[A.cat]}</span><span class="tg ${A.kind}">${KIND_NAME[A.kind]}</span>${st ? `<span class="tg">${st}</span>` : ''}</div><b>${esc(A.name)}</b><p>${esc(A.desc)}</p><p class="h">${esc(A.how)}</p></div>`;
    }).join('') : '<p class="mdesc">아직 증강이 없습니다.</p>';
    this.info(`${q.name} (${q.cname}) · ${q.ai ? 'AI' : '사람'}`, `<p class="mdesc">${q.rank ? `${q.elim ? '탈락' : q.rank + '위'} — ${esc(q.outReason)}` : '경기 중'} · 완주 ${doneCount(q)}/${needPieces(q).length}${q.badge ? ' · ' + esc(q.badge) : ''}</p>
      <p class="mdesc">${this.stats(q) || '특수 카운터 없음'}</p><ul class="rules">${pcs}</ul><div class="book-list">${augs}</div>`);
  },
  results(order) {
    const pw = G.planWinner;
    const winners = pw ? [pw] : order.filter(q => q.rank === 1 && !q.elim);
    const head = pw ? `계획대로! ${pw.name} 단독 승리` : winners.length ? `${winners.map(q => q.name).join(' · ')} 승리!` : '게임 종료';
    const rows = order.map(q => {
      const win = winners.includes(q);
      const medal = q.elim ? '✕' : String(q.rank);
      const col = { 1: '#e3b34a', 2: '#c9d1dc', 3: '#cd7f32' }[q.rank] || 'var(--muted)';
      return `<div class="res-row ${win ? 'win' : ''}"><span class="medal" style="color:${q.elim ? 'var(--muted)' : col}">${medal}</span>
        <span class="cdot" style="display:inline-block;width:14px;height:14px;border-radius:50%;background:${q.color}"></span>
        <span class="rn"><b>${esc(q.name)} (${q.cname})</b>${q.badge ? ' ' + esc(q.badge) : ''}<small>${esc(q.outReason || '')} · 완주 ${doneCount(q)}/${needPieces(q).length} · 증강 ${q.augs.length}개</small></span></div>`;
    }).join('');
    SFX.play('win');
    this.modal({ title: head, html: `<div class="book-list">${rows}</div>${pw ? '<p class="mdesc">계획대로 증강이 최종 순위를 모두 맞혀 기존 순위가 사라졌습니다.</p>' : ''}`,
      options: [{ label: '같은 설정으로 다시', value: 'again', cls: 'primary' }, { label: '타이틀로', value: 'title' }] })
      .then(v => { if (v === 'again') startGame(); else if (v === 'title') this.toTitle(); });
  }
};

/* =====================================================================
   21. 알까기 물리 모드 — 말뭉치를 2D 원형 강체로 바꿔 충돌 연산
   ===================================================================== */
const ALK = {
  BOUND: 0.1, MAXPULL: 0.42, MAXV: 4.4,
  async run(p) {
    const discs = allGroups().map(s => {
      const [x, y] = XY[canon(s[0].pos)];
      return { x, y, vx: 0, vy: 0, r: 0.045, m: 1 + 0.35 * (s.length - 1), owner: s[0].owner, pieces: s.slice(), out: false, fall: 0 };
    });
    for (let it = 0; it < 6; it++) for (let i = 0; i < discs.length; i++) for (let j = i + 1; j < discs.length; j++) {
      const a = discs[i], b = discs[j];
      let dx = b.x - a.x, dy = b.y - a.y, d = Math.hypot(dx, dy);
      if (d >= a.r + b.r) continue;
      if (d < 1e-6) { const ang = Math.random() * Math.PI * 2; dx = Math.cos(ang); dy = Math.sin(ang); d = 0; } else { dx /= d; dy /= d; }
      const push = (a.r + b.r - d) / 2 + 0.002;
      a.x -= dx * push; a.y -= dy * push; b.x += dx * push; b.y += dy * push;
    }
    G.alk = { discs, p, phase: 'aim', aim: null, onShot: null, last: 0, settle: 0 };
    SFX.play('magic');
    UI.flash('알까기!', p.color);
    say(`🥏 ${p.name}: 알까기 시작`, p.color);
    UI.banner(p.ai ? `${p.name} 조준 중…` : '알까기: 내 알을 잡고 뒤로 당겼다가 놓으세요', false);
    render();
    let shot;
    if (p.ai) {
      await sleep(AI.delay(700));
      shot = this.shotAI(p, discs);
      G.alk.aim = { d: shot.d, cx: shot.d.x - shot.vx * 0.08, cy: shot.d.y - shot.vy * 0.08 };
      await sleep(AI.delay(700));
      G.alk.aim = null;
    } else {
      shot = await new Promise(res => { G.alk.onShot = res; });
    }
    UI.hideBanner();
    shot.d.vx = shot.vx; shot.d.vy = shot.vy;
    SFX.play('hit');
    G.alk.phase = 'sim'; G.alk.last = 0;
    await R.wait(() => G.alk && G.alk.phase === 'done');
    let killedN = 0;
    for (const d of discs.filter(x => x.out)) {
      const live = d.pieces.filter(onBoard);
      if (!live.length) continue;
      const kr = await killPieces(live, p, 'alkkagi');
      killedN += kr.killed.length;
      if (d.pieces.some(onBoard)) { d.out = false; d.fall = 0; d.x = Math.min(1, Math.max(0, d.x)); d.y = Math.min(1, Math.max(0, d.y)); }
      if (p.out || G.over) break;
    }
    if (G.alk) this.snap(discs, p);
    say(`🥏 알까기 결과: 판 밖으로 나간 말 ${killedN}개`, p.color);
    G.alk = null;
    render();
    await checkBoardWins();
  },
  tick(t) {
    const A = G.alk;
    if (!A.last) { A.last = t; return; }
    const dt = Math.min(0.05, (t - A.last) / 1000);
    A.last = t;
    for (let i = 0; i < 4; i++) this.step(dt / 4);
    const moving = A.discs.some(d => !d.out && Math.hypot(d.vx, d.vy) > 0.01);
    const falling = A.discs.some(d => d.out && d.fall < 1);
    if (!moving && !falling) { A.settle += dt; if (A.settle > 0.25) A.phase = 'done'; } else A.settle = 0;
  },
  step(dt) {
    const ds = G.alk.discs, B = this.BOUND;
    for (const d of ds) {
      if (d.out) { d.fall = Math.min(1, d.fall + dt * 2.2); d.x += d.vx * dt * 0.3; d.y += d.vy * dt * 0.3; continue; }
      d.x += d.vx * dt; d.y += d.vy * dt;
      const sp = Math.hypot(d.vx, d.vy);
      if (sp > 0) { const ns = Math.max(0, sp * Math.exp(-1.5 * dt) - 0.35 * dt); d.vx *= ns / sp; d.vy *= ns / sp; }
      if (d.x < -B || d.x > 1 + B || d.y < -B || d.y > 1 + B) { d.out = true; SFX.play('bad'); }
    }
    for (let i = 0; i < ds.length; i++) for (let j = i + 1; j < ds.length; j++) {
      const a = ds[i], b = ds[j];
      if (a.out || b.out) continue;
      const dx = b.x - a.x, dy = b.y - a.y, dist = Math.hypot(dx, dy), min = a.r + b.r;
      if (dist >= min || dist < 1e-9) continue;
      const nx = dx / dist, ny = dy / dist;
      const over = (min - dist) / 2;
      a.x -= nx * over; a.y -= ny * over; b.x += nx * over; b.y += ny * over;
      const rel = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
      if (rel < 0) {
        const J = -(1 + 0.9) * rel / (1 / a.m + 1 / b.m);
        a.vx -= J / a.m * nx; a.vy -= J / a.m * ny; b.vx += J / b.m * nx; b.vy += J / b.m * ny;
        SFX.play('hit');
      }
    }
  },
  down(ux, uy) {
    const A = G.alk;
    if (!A || A.phase !== 'aim' || A.p.ai) return;
    let best = null, bd = 0.11;
    for (const d of A.discs) { if (d.owner !== A.p.id) continue; const dd = Math.hypot(d.x - ux, d.y - uy); if (dd < bd) { bd = dd; best = d; } }
    if (best) A.aim = { d: best, cx: ux, cy: uy };
  },
  move(ux, uy) { const A = G.alk; if (A && A.aim && A.phase === 'aim' && !A.p.ai) { A.aim.cx = ux; A.aim.cy = uy; } },
  up(ux, uy) {
    const A = G.alk;
    if (!A || !A.aim || A.phase !== 'aim' || A.p.ai) return;
    const d = A.aim.d, vx = d.x - ux, vy = d.y - uy, L = Math.hypot(vx, vy);
    A.aim = null;
    if (L < 0.03) { UI.toast('알을 잡고 더 길게 당겼다 놓으세요'); return; }
    const pw = Math.min(L, this.MAXPULL) / this.MAXPULL, sp = 0.6 + pw * (this.MAXV - 0.6);
    if (A.onShot) { const f = A.onShot; A.onShot = null; f({ d, vx: vx / L * sp, vy: vy / L * sp }); }
  },
  cancel() { if (G.alk) G.alk.aim = null; },
  segDist(c, a, b) {
    const vx = b.x - a.x, vy = b.y - a.y, L2 = vx * vx + vy * vy || 1e-9;
    const t = Math.max(0, Math.min(1, ((c.x - a.x) * vx + (c.y - a.y) * vy) / L2));
    return Math.hypot(a.x + vx * t - c.x, a.y + vy * t - c.y);
  },
  shotAI(p, discs) {
    const mine = discs.filter(d => d.owner === p.id);
    const foes = discs.filter(d => d.owner !== p.id && !has(p, 'peace') && !has(P(d.owner), 'peace'));
    const B = this.BOUND;
    let best = null;
    for (const a of mine) for (const b of foes) {
      const dx = b.x - a.x, dy = b.y - a.y, dist = Math.hypot(dx, dy);
      if (dist < 1e-6) continue;
      const ux = dx / dist, uy = dy / dist;
      const tx = ux > 1e-6 ? (1 + B - b.x) / ux : ux < -1e-6 ? (-B - b.x) / ux : 9;
      const ty = uy > 1e-6 ? (1 + B - b.y) / uy : uy < -1e-6 ? (-B - b.y) / uy : 9;
      const edge = Math.min(tx, ty);
      const block = discs.some(c => c !== a && c !== b && this.segDist(c, a, b) < c.r + a.r);
      const sc = -(edge * 1.4 + dist * 0.8) - (block ? 2 : 0) + b.pieces.length * 0.4 - (b.pieces.some(x => x.shield > 0) ? 1.5 : 0);
      if (!best || sc > best.sc) best = { sc, a, ux, uy, need: dist + edge };
    }
    if (!best) { const a = pick(mine); const ang = Math.random() * Math.PI * 2; return { d: a, vx: Math.cos(ang) * 1.2, vy: Math.sin(ang) * 1.2 }; }
    const ang = Math.atan2(best.uy, best.ux) + (Math.random() - 0.5) * 0.1;
    const sp = Math.min(this.MAXV, 1.0 + best.need * 2.6);
    return { d: best.a, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp };
  },
  // 멈춘 알을 가장 가까운 칸으로 되돌림 (다른 플레이어 알과 같은 칸은 피함, 출구 칸 제외)
  snap(discs, p) {
    const taken = new Map();
    const alive = discs.filter(d => d.pieces.some(onBoard)).sort((a, b) => (a.owner === p.id ? 0 : 1) - (b.owner === p.id ? 0 : 1));
    const cn = canonNodes().filter(n => !isExit(n));
    for (const d of alive) {
      const sorted = cn.slice().sort((m, n) => Math.hypot(XY[m][0] - d.x, XY[m][1] - d.y) - Math.hypot(XY[n][0] - d.x, XY[n][1] - d.y));
      const n = sorted.find(k => !taken.has(k) || taken.get(k) === d.owner) ?? sorted[0];
      taken.set(n, d.owner);
      d.pieces.filter(onBoard).forEach(pc => { pc.pos = n; pc.trail = []; });
    }
  }
};

/* =====================================================================
   22. 시작
   ===================================================================== */
UI.init();
R.init();
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('touchmove', e => { if (e.touches && e.touches.length > 1) e.preventDefault(); }, { passive: false });
document.addEventListener('visibilitychange', () => { if (!document.hidden && SFX.ctx && SFX.ctx.state === 'suspended') SFX.ctx.resume(); });
</script>
