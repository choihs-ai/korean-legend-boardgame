<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>초능력윷놀이</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="초능력윷놀이">
<meta name="theme-color" content="#151a2c">
<meta name="format-detection" content="telephone=no">
<style>
/* Layout: 판이 주인공인 한 화면 앱 — 세로는 상단바/플레이어/윷판/조작부를 쌓고, 가로·아이패드는 윷판 옆에 패널을 둔다 */
:root{
  --ink:#151a2c; --ink2:#1e2540; --ink3:#2a3354; --line:#3b4670;
  --hanji:#f2e7cd; --hanji2:#e3d1a8; --sumi:#2a1f17; --sumi2:#5b4a3a;
  --fg:#f4eddc; --muted:#a9b1c9;
  --seal:#cf3f2c; --seal2:#a52e1f; --gold:#e3b34a; --jade:#4fa88c; --plum:#8f5fd0;
  --p1:#e5483b; --p2:#3d8bf0; --p3:#36b56a; --p4:#f2c230;
  --font-display:"Nanum Myeongjo","AppleMyungjo","Apple SD Gothic Neo","Batang",serif;
  --font-body:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;
  --gut-l:max(16px, env(safe-area-inset-left, 0px));
  --gut-r:max(16px, env(safe-area-inset-right, 0px));
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0;background:var(--ink);color:var(--fg);font-family:var(--font-body);font-size:14px;overflow:hidden;
  touch-action:manipulation;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  -webkit-tap-highlight-color:transparent;-webkit-text-size-adjust:100%}
body{position:fixed;top:0;right:0;bottom:0;left:0}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;padding:0}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:disabled{cursor:default}
.screen{position:fixed;top:0;right:0;bottom:0;left:0;padding:calc(env(safe-area-inset-top,0px) + 8px) var(--gut-r) calc(env(safe-area-inset-bottom,0px) + 8px) var(--gut-l)}

/* ---------- 타이틀 ---------- */
#title{overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  background:radial-gradient(120% 70% at 50% -10%, #2b3560 0%, var(--ink) 60%)}
.title-inner{width:100%;max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px;padding-block:10px 28px}
.brand{display:flex;flex-direction:column;align-items:center;gap:6px;padding-top:6px}
.sticks-deco{display:flex;gap:9px;height:86px;align-items:center}
.sticks-deco i{display:block;width:18px;height:84px;border-radius:9px;background:linear-gradient(90deg,#6b4220,#b97c3f 45%,#7a4b23);box-shadow:0 4px 10px rgba(0,0,0,.4)}
.sticks-deco i.f{background:var(--hanji);box-shadow:inset 0 0 0 2px #c9ab73,0 4px 10px rgba(0,0,0,.4)}
.sticks-deco i:nth-child(1){transform:rotate(-14deg)}.sticks-deco i:nth-child(2){transform:rotate(-4deg) translateY(-6px)}
.sticks-deco i:nth-child(3){transform:rotate(6deg) translateY(-3px)}.sticks-deco i:nth-child(4){transform:rotate(16deg)}
.logo{font-family:var(--font-display);font-size:clamp(42px,13vw,66px);font-weight:800;margin:0;letter-spacing:.04em;line-height:1.05;text-wrap:balance;
  color:var(--hanji);text-shadow:0 2px 0 var(--seal2),0 10px 30px rgba(207,63,44,.35)}
.tagline{margin:0;color:var(--muted);font-size:13px;text-align:center;letter-spacing:.02em}
.setup-card{background:var(--ink2);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.sc-head{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:700}
.seg{display:flex;background:var(--ink);border-radius:12px;padding:4px;gap:4px}
.seg button{flex:1;min-height:44px;border-radius:9px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--hanji);color:var(--sumi)}
.slot{display:flex;align-items:center;gap:10px;min-height:52px}
.slot .sdot{width:22px;height:22px;border-radius:50%;flex:none;box-shadow:inset 0 -3px 0 rgba(0,0,0,.25),0 0 0 2px rgba(255,255,255,.75)}
.slot .sname{flex:1;font-weight:700;min-width:0}
.slot .sname small{display:block;color:var(--muted);font-weight:500;font-size:12px}
.slot .seg{flex:none;width:170px}
.switch-row{display:flex;align-items:center;gap:12px;min-height:50px;cursor:pointer}
.switch-row span{flex:1;min-width:0}
.switch-row b{display:block}
.switch-row small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.switch-row input{position:absolute;opacity:0;pointer-events:none}
.switch-row .sw{flex:none;width:52px;height:30px;border-radius:15px;background:var(--ink3);position:relative;transition:background .2s}
.switch-row .sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--fg);transition:transform .2s}
.switch-row input:checked + .sw{background:var(--seal)}
.switch-row input:checked + .sw::after{transform:translateX(22px)}
.switch-row input:focus-visible + .sw{outline:2px solid var(--gold);outline-offset:2px}
.start-btn{min-height:60px;border-radius:16px;background:var(--seal);font-size:20px;font-weight:800;letter-spacing:.08em;
  box-shadow:0 6px 0 var(--seal2),0 12px 24px rgba(0,0,0,.35);transition:transform .1s}
.start-btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--seal2)}
.title-links{display:flex;gap:10px}
.title-links button{flex:1;min-height:48px;border-radius:12px;border:1px solid var(--line);background:var(--ink2);font-weight:700}
.credit{margin:0;text-align:center;color:var(--muted);font-size:11px;line-height:1.5}

/* ---------- 게임 화면 ---------- */
#game{display:grid;gap:6px;grid-template-columns:minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr) auto;
  grid-template-areas:"top" "players" "stage" "controls";background:var(--ink)}
#topbar{grid-area:top;display:flex;align-items:center;gap:6px;min-height:40px;min-width:0}
.rbox{display:flex;flex-direction:column;gap:3px;flex:none}
.rbox b{font-family:var(--font-display);font-size:18px;line-height:1;font-variant-numeric:tabular-nums}
.rgauge{display:flex;gap:2px}
.rgauge i{width:4px;height:6px;border-radius:2px;background:var(--ink3)}
.rgauge i.past{background:var(--muted)}
.rgauge i.aug{height:8px;margin-top:-1px;background:#6d5a2a}
.rgauge i.aug.past{background:var(--gold)}
.rgauge i.now{background:var(--fg)}
.turnlbl{flex:1;min-width:0;font-weight:800;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:6px}
.turnlbl small{font-size:12px;font-weight:600;color:var(--muted)}
.turnlbl i{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px;box-shadow:0 0 0 2px rgba(255,255,255,.7)}
.badge{flex:none;font-size:11px;font-weight:800;padding:4px 8px;border-radius:999px;letter-spacing:.06em}
.badge.chaos{background:var(--plum);color:#fff}
.ibtn{flex:none;min-width:44px;height:44px;border-radius:10px;background:var(--ink2);border:1px solid var(--line);font-weight:700;font-size:12px;padding:0 6px}
.ibtn.off{opacity:.45;text-decoration:line-through}

#players{grid-area:players;display:grid;gap:6px;grid-template-columns:repeat(2,minmax(0,1fr))}
#players.np3{grid-template-columns:repeat(3,minmax(0,1fr))}
.pcard{position:relative;min-width:0;background:var(--ink2);border:2px solid transparent;border-radius:11px;padding:5px 7px 6px;text-align:left;
  display:flex;flex-direction:column;gap:3px;transition:border-color .2s, box-shadow .2s;overflow:hidden}
.pcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--pc)}
.pcard.turn{border-color:var(--pc);box-shadow:0 0 0 1px var(--pc),0 0 18px -4px var(--pc)}
.pcard.out{opacity:.55}
.pc-top{display:flex;align-items:center;gap:5px;min-width:0}
.pc-top b{font-size:13px}
.pc-top .who{font-size:10px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 4px}
.pc-top .rk{margin-left:auto;font-size:11px;font-weight:800;color:var(--gold);white-space:nowrap}
.pc-mid{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);min-width:0;font-variant-numeric:tabular-nums}
.pc-mid .waitdots{display:flex;gap:2px}
.pc-mid .waitdots i{width:8px;height:8px;border-radius:50%;background:var(--pc);box-shadow:0 0 0 1px rgba(255,255,255,.5)}
.pc-mid .waitdots i.sp{border-radius:2px}
.pc-mid .done{margin-left:auto;color:var(--fg);font-weight:700}
.pc-stats{font-size:10.5px;color:var(--hanji2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:13px;font-variant-numeric:tabular-nums}
.stamps{display:inline-flex;gap:1px;vertical-align:-1px}
.stamps i{font-style:normal;font-size:9.5px;line-height:13px;padding:0 2px;border-radius:3px;background:var(--ink3);color:var(--muted)}
.stamps i.on{background:var(--gold);color:var(--sumi);font-weight:800}
.flystick{position:fixed;z-index:65;width:14px;height:78px;border-radius:7px;background:linear-gradient(90deg,#6b4220,#b97c3f 45%,#7a4b23);pointer-events:none;box-shadow:0 4px 10px rgba(0,0,0,.4)}
.pc-augs{display:flex;gap:3px;overflow:hidden;white-space:nowrap;min-height:16px}
.atag{flex:none;font-size:10px;line-height:15px;padding:0 5px;border-radius:5px;background:var(--ink3);color:var(--fg);border:1px solid var(--line)}
.atag.used{opacity:.45}
.atag.dis{text-decoration:line-through;opacity:.45}
.atag.catd{background:#5a4630}
.atag.more{background:transparent;border-color:transparent;color:var(--muted)}

#stage{grid-area:stage;position:relative;display:flex;align-items:center;justify-content:center;min-height:0;min-width:0}
#board{display:block;touch-action:none;border-radius:14px}
#banner{position:absolute;left:8px;right:8px;top:6px;display:flex;align-items:center;gap:8px;background:rgba(21,26,44,.92);border:1px solid var(--gold);
  border-radius:12px;padding:6px 6px 6px 12px;z-index:5;font-weight:700;font-size:13px}
#banner span{flex:1;min-width:0}
#banner button{flex:none;min-height:40px;padding:0 14px;border-radius:9px;background:var(--ink3);border:1px solid var(--line)}
#sticks{position:absolute;top:0;right:0;bottom:0;left:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;z-index:6;pointer-events:none}
.sk-row{display:flex;gap:9px;align-items:center}
.stick{width:20px;height:104px;border-radius:10px;background:linear-gradient(90deg,#6b4220,#b97c3f 45%,#7a4b23);box-shadow:0 6px 14px rgba(0,0,0,.45);
  position:relative;transition:transform .2s}
.stick.flat{background:var(--hanji);box-shadow:inset 0 0 0 2px #c4a46b,0 6px 14px rgba(0,0,0,.45)}
.stick.flat::before,.stick.flat::after{content:"";position:absolute;left:4px;right:4px;height:2px;background:var(--sumi2);transform:rotate(35deg)}
.stick.flat::before{top:30%}.stick.flat::after{top:62%}
.stick.mark.flat{box-shadow:inset 0 0 0 2px var(--seal),0 6px 14px rgba(0,0,0,.45)}
.stick.mark .mk{position:absolute;left:50%;top:50%;width:8px;height:8px;margin:-4px 0 0 -4px;border-radius:50%;background:var(--seal)}
.stick.mark:not(.flat) .mk{display:none}
.chip small{font-size:11px;font-weight:700;opacity:.7}
.stick.toss{animation:toss .55s cubic-bezier(.3,.7,.4,1) both}
@keyframes toss{0%{transform:translateY(40px) rotate(0)}40%{transform:translateY(-70px) rotate(220deg)}100%{transform:translateY(0) rotate(var(--r,8deg))}}
.sk-res{font-family:var(--font-display);font-size:44px;font-weight:800;color:var(--hanji);text-shadow:0 3px 0 var(--seal2),0 0 24px rgba(0,0,0,.6);
  animation:pop .35s ease-out both}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}

#controls{grid-area:controls;display:flex;flex-direction:column;gap:6px;min-width:0}
#controls > *{flex-shrink:0}
.ctl-row{display:flex;gap:8px;align-items:center;min-width:0}
#chips{flex:1;min-width:0;display:flex;gap:6px;overflow-x:auto;align-items:center;min-height:48px;padding:2px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
#chips .hint{color:var(--muted);font-size:12px;white-space:nowrap}
.chip{flex:none;min-width:50px;height:44px;padding:0 10px;border-radius:22px;background:var(--hanji);color:var(--sumi);font-weight:800;font-size:16px;
  box-shadow:0 3px 0 var(--hanji2);transition:transform .12s}
.chip.neg{background:#e9c3b9}
.chip.sel{outline:3px solid var(--gold);transform:translateY(-2px)}
.chip:disabled{opacity:.5}
#throwBtn{flex:none;min-width:116px;height:56px;border-radius:14px;background:var(--seal);font-size:17px;font-weight:800;box-shadow:0 4px 0 var(--seal2);padding:0 10px}
#throwBtn:disabled{background:var(--ink3);box-shadow:none;color:var(--muted)}
#throwBtn:not(:disabled):active{transform:translateY(3px);box-shadow:0 1px 0 var(--seal2)}
#homeRow{flex:1;min-width:0;display:flex;align-items:center;gap:6px;overflow-x:auto;min-height:44px;scrollbar-width:none}
#homeRow::-webkit-scrollbar{display:none}
#homeRow .hl{font-size:12px;color:var(--muted);flex:none}
.token{flex:none;width:40px;height:40px;border-radius:50%;background:var(--pc);box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),0 0 0 2px rgba(255,255,255,.8);
  font-size:15px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center}
.token:disabled{opacity:.35}
.token.go{animation:glow 1s ease-in-out infinite alternate}
@keyframes glow{from{box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),0 0 0 2px #fff,0 0 0 4px var(--gold)}to{box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),0 0 0 2px #fff,0 0 12px 6px var(--gold)}}
#endBtn{flex:none;min-height:44px;padding:0 14px;border-radius:12px;background:var(--jade);font-weight:800}
#actives{display:flex;flex-wrap:nowrap;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}
#actives::-webkit-scrollbar{display:none}
#actives:empty{display:none}
.act{flex:none;white-space:nowrap;min-height:44px;padding:0 12px;border-radius:10px;background:var(--ink2);border:1px solid var(--gold);color:var(--hanji);font-weight:700;font-size:13px}
.act.turnuse{border-color:var(--seal)}
#ticker{display:block;width:100%;text-align:left;font-size:12px;color:var(--muted);background:var(--ink2);border-radius:9px;padding:7px 10px;min-height:32px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

@media (min-aspect-ratio:5/4){
  #game{grid-template-columns:minmax(0,1fr) minmax(300px,420px);grid-template-rows:auto auto minmax(0,1fr);
    grid-template-areas:"stage top" "stage players" "stage controls"}
  #players,#players.np3{grid-template-columns:repeat(2,minmax(0,1fr))}
  #controls{align-self:start;overflow-y:auto;max-height:100%}
}
@media (max-height:760px) and (max-aspect-ratio:5/4){
  .pc-augs,#ticker{display:none}
  #throwBtn{height:48px}
  .chip{height:40px}
  #chips{min-height:44px}
  .pcard{padding:4px 7px 5px}
}
@media (max-height:500px){
  .pc-augs,#ticker{display:none}
  .pcard{padding:3px 7px 4px;gap:2px}
  #throwBtn{height:46px}
  .chip{height:40px}
}

/* ---------- 모달 / 가림막 / 토스트 ---------- */
#modal,#info{position:fixed;top:0;right:0;bottom:0;left:0;z-index:50;background:rgba(8,10,18,.74);display:flex;align-items:center;justify-content:center;
  padding:calc(env(safe-area-inset-top,0px) + 12px) var(--gut-r) calc(env(safe-area-inset-bottom,0px) + 12px) var(--gut-l)}
#info{z-index:56}
#modal.peek{background:rgba(8,10,18,.25);align-items:flex-end}
.mbox{width:100%;max-width:620px;max-height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;background:var(--ink2);
  border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.5);
  -webkit-user-select:text;user-select:text}
#modal.peek .mbox{max-height:52%}
.mtitle{font-family:var(--font-display);font-size:21px;font-weight:800;margin:0;text-wrap:balance;line-height:1.3}
.mdesc{margin:0;color:var(--muted);font-size:13px;line-height:1.55}
.mopts{display:flex;flex-wrap:wrap;gap:8px}
.mopts.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
.mbtn{flex:1 1 140px;min-height:48px;border-radius:12px;background:var(--ink3);border:1px solid var(--line);padding:9px 12px;font-weight:700;text-align:left;
  display:flex;flex-direction:column;justify-content:center;gap:2px}
.mbtn small{font-weight:500;color:var(--muted);font-size:12px}
.mbtn .cdot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.mbtn:disabled{opacity:.35}
.mbtn.primary{background:var(--seal);border-color:var(--seal)}
.mbtn.ghost{background:transparent}
.mopts.grid .mbtn{min-height:44px;font-size:13px}
.augcards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.augcard{text-align:left;background:var(--hanji);color:var(--sumi);border-radius:14px;padding:12px 12px 14px;display:flex;flex-direction:column;gap:6px;
  box-shadow:0 4px 0 var(--hanji2),0 10px 20px rgba(0,0,0,.25);position:relative;min-height:150px}
.augcard:disabled{opacity:.4;filter:grayscale(.8)}
.augcard .an{font-family:var(--font-display);font-weight:800;font-size:18px;line-height:1.2}
.augcard .ad{font-size:13px;line-height:1.5}
.augcard .ah{font-size:11.5px;line-height:1.45;color:var(--sumi2);border-top:1px dashed #c8b07d;padding-top:6px;margin-top:auto}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tg{font-size:10.5px;font-weight:800;padding:2px 6px;border-radius:6px;background:var(--sumi);color:var(--hanji)}
.tg.general{background:#4a5a7a}.tg.start{background:#2f7d63}.tg.mid{background:#a2671e}.tg.end{background:#9a2f2f}
.tg.active{background:var(--seal)}.tg.passive{background:#5b4a3a}.tg.instant{background:#6a4fb0}.tg.win{background:#b8891c}
.book-sec h3{font-family:var(--font-display);margin:6px 0 8px;font-size:18px}
.book-list{display:flex;flex-direction:column;gap:8px}
.book-item{background:var(--ink3);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.book-item b{font-size:15px}
.book-item p{margin:0;font-size:13px;line-height:1.5}
.book-item p.h{color:var(--muted);font-size:12px}
.rules p,.rules li{font-size:13.5px;line-height:1.65;max-width:65ch}
.rules h3{font-family:var(--font-display);margin:10px 0 4px}
.rules ul{padding-left:18px;margin:4px 0}
.loglist{display:flex;flex-direction:column;gap:4px;font-size:12.5px;line-height:1.45}
.loglist div{padding:4px 0;border-bottom:1px solid var(--ink3)}
.res-row{display:flex;align-items:center;gap:10px;background:var(--ink3);border-radius:12px;padding:10px 12px}
.res-row .medal{font-family:var(--font-display);font-size:22px;font-weight:800;width:44px;text-align:center;flex:none}
.res-row .rn{flex:1;min-width:0}
.res-row .rn small{display:block;color:var(--muted);font-size:12px}
.res-row.win{background:linear-gradient(90deg,rgba(227,179,74,.35),var(--ink3))}
#blind{position:fixed;top:0;right:0;bottom:0;left:0;z-index:90;background:var(--ink);display:flex;align-items:center;justify-content:center;text-align:center;
  padding:calc(env(safe-area-inset-top,0px) + 20px) var(--gut-r) calc(env(safe-area-inset-bottom,0px) + 20px) var(--gut-l);cursor:pointer}
.blind-in{display:flex;flex-direction:column;align-items:center;gap:16px;max-width:420px}

<script>
'use strict';
/* =====================================================================
   1. 유틸

const $ = (s, r = document) => r.querySelector(s);
const rnd = n => Math.floor(Math.random() * n);

const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const HOME = -1, DONE = 99;

const resName = v => RES_NAME[v] ?? String(v);
const PCOL = ['#e5483b', '#3d8bf0', '#36b56a', '#f2c230'];

const TYPE_ICON = { normal: '', dokkaebi: '鬼', vanguard: '旗', cannon: '包', pawn: '♟', kim: '첨', queen: '后', cultist: '巫', marathon: '走' };

/* =====================================================================
   2. 효과음 — Web Audio 신디사이저 (외부 파일 없음)
   ===================================================================== */
const SFX = {
  ctx: null, on: true, lastHit: 0,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }

  },
  tone(f, d = 0.12, type = 'sine', v = 0.2, f2 = null, delay = 0) {
    if (!this.on || !this.ctx) return;

    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(v, t + 0.01);

  },
  noise(d = 0.08, v = 0.25, delay = 0, hp = 800) {
    if (!this.on || !this.ctx) return;

    const f = c.createBiquadFilter(); f.type = 'highpass'; f.frequency.value = hp;
    const g = c.createGain(); g.gain.value = v;
    s.connect(f); f.connect(g); g.connect(c.destination); s.start(t);
  },
  play(name) {
    if (!this.on || !this.ctx) return;
    switch (name) {
      case 'throw': for (let i = 0; i < 5; i++) this.noise(0.05, 0.3, i * 0.07 + Math.random() * 0.03, 1400); this.tone(320, 0.08, 'triangle', 0.1, 520, 0.3); break;
      case 'land': this.noise(0.08, 0.3, 0, 300); this.tone(190, 0.12, 'triangle', 0.18, 90); break;

   ===================================================================== */
const XY = (() => {
  const p = {};
  const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
  p[0] = [1, 1];
  for (let k = 1; k <= 4; k++) p[k] = [1, 1 - k / 5];
  p[5] = [1, 0];
  for (let k = 1; k <= 4; k++) p[5 + k] = [1 - k / 5, 0];
  p[10] = [0, 0];
  for (let k = 1; k <= 4; k++) p[10 + k] = [0, k / 5];
  p[15] = [0, 1];
  for (let k = 1; k <= 4; k++) p[15 + k] = [k / 5, 1];
  p[22] = [0.5, 0.5];
  p[20] = lerp(p[5], p[22], 1 / 3); p[21] = lerp(p[5], p[22], 2 / 3);
  p[23] = lerp(p[10], p[22], 1 / 3); p[24] = lerp(p[10], p[22], 2 / 3);
  p[25] = lerp(p[22], p[15], 1 / 3); p[26] = lerp(p[22], p[15], 2 / 3);
  p[27] = lerp(p[22], p[0], 1 / 3); p[28] = lerp(p[22], p[0], 2 / 3);

})();

const nodeAt = (x, y) => NODES.find(n => Math.abs(XY[n][0] - x) < 1e-6 && Math.abs(XY[n][1] - y) < 1e-6);
// 시계방향 90° 회전: 화면좌표 (x,y) → (1-y, x)
const ROT = (() => { const r = {}; NODES.forEach(n => { const [x, y] = XY[n]; r[n] = nodeAt(1 - y, x); }); return r; })();

const FWD_MAP = { 20: 21, 21: 22, 23: 24, 24: 22, 25: 26, 26: 15, 27: 28, 28: 0 };

const REV_PREV = { 26: 15, 25: 26, 22: 25, 21: 22, 20: 21, 23: 10, 24: 23, 27: 22, 28: 27 };

// 한 칸 전진. start=이번 이동의 첫 걸음인지(모서리에서 지름길 진입), rev=천마군림보(역방향)
function nextNode(n, prev, start, rev) {
  if (!rev) {
    if (start && n === 5) return 20;
    if (start && n === 10) return 23;

  if (start && n === 10) return 23;
  if (n === 22) return (!start && prev === 25) ? 21 : 27;

  if (n === 0) return 19;
  return n - 1;
}
function defaultPrev(n, rev) {

  if (REV_PREV[n] !== undefined) return REV_PREV[n];
  if (n === 19) return 0;
  if (n === 0) return 1;
  return n + 1;
}

  { no: 9, id: 'dogpig', name: '개돼지', cat: 'general', kind: 'passive', desc: '매 턴 도와 개만 낼 수 있지만 선택할 수 있습니다.', how: '던질 때마다 [도]/[개] 중 원하는 결과를 고릅니다.' },
  { no: 10, id: 'leech', name: '거머리', cat: 'general', kind: 'instant', desc: '즉시 다른 플레이어에게 말을 1개 줍니다. 그 플레이어가 이기거나 지면 같이 이기거나 집니다.', how: '대기 말 1개를 넘기고 그 플레이어와 1위(승리)·탈락을 공유합니다.' },
  { no: 11, id: 'whoami', name: '나 누구게?', cat: 'general', kind: 'instant', desc: '잠시 모든 정보가 감춰집니다. 다른 플레이어는 자신의 색을 맞춰야 하며, 못 맞출 경우 차례를 한 번 건너뜁니다.', how: '모든 말이 기호로 가려지고, 다른 플레이어가 차례로 자기 기호를 맞힙니다. 틀리면 1회 건너뜀.' },
  { no: 12, id: 'notme', name: '나만 아니면 돼~', cat: 'general', kind: 'instant', desc: '즉시 무작위 플레이어 한 명의 모든 말을 죽입니다.', how: '나를 포함한 생존자 중 1명을 추첨해 판 위의 말을 모두 대기실로 보냅니다.' },
  { no: 13, id: 'getdown', name: '내려', cat: 'general', kind: 'instant', desc: '투표를 진행합니다. 최다 득표자는 차례를 한번 건너뜁니다. 자신은 2표를 행사합니다.', how: '가림막 비밀 투표. 동점이면 동점자 중 무작위 1명.' },
  { no: 14, id: 'doberman', name: '도베르만', cat: 'general', kind: 'active', desc: '1회, 이번 게임 동안 자신이 개를 낸 만큼 개 코인을 1개 얻습니다. 이제 윷을 던질 때마다 개 코인 2개를 소비해 모가 나옵니다.', how: '획득 시 지금까지 낸 개 수만큼 코인, 이후 개마다 +1. 버튼으로 코인 2개를 써서 확정 모.' },
  { no: 15, id: 'spin', name: '돌려돌려 돌림판', cat: 'general', kind: 'active', desc: '판을 회전시킵니다. 소유자는 한 번 다시 돌릴 수 있습니다.', how: '획득 즉시 판이 시계방향 90° 회전(출구는 그대로). 원할 때 한 번 더 돌릴 수 있습니다.' },
  { no: 16, id: 'sniper', name: '명사수', cat: 'general', kind: 'active', desc: '던지기 기회를 소모해 칸 하나를 선택합니다. 다음 라운드 자신 차례가 시작하면 해당 칸의 모든 말을 죽입니다.', how: '투척 1회를 쓰고 과녁을 둡니다. 내 다음 차례 시작에 그 칸의 모든 말이 죽습니다.' },
  { no: 17, id: 'detective', name: '명탐정', cat: 'general', kind: 'instant', desc: '증강 하나를 고릅니다. 해당 증강은 이번 증강 선택에서 무효화됩니다.', how: '가림막 비밀 지목. 이번 라운드에 그 증강을 고른(고를) 다른 플레이어의 선택이 무효가 됩니다.' },
  { no: 18, id: 'moordo', name: '모 아니면 도', cat: 'general', kind: 'passive', desc: '모 아니면 도만 나옵니다.', how: '50% 도, 50% 모.' },
  { no: 19, id: 'baduk', name: '바둑', cat: 'general', kind: 'active', desc: '1회, 일직선으로 있는 내 말뭉치 둘 사이에 있는 적을 모두 죽이고 죽인 수만큼 던지기 기회를 얻습니다.', how: '같은 변·같은 대각선 위 내 말뭉치 두 개 사이의 적을 모두 잡습니다.' },
  { no: 20, id: 'delivery', name: '배달', cat: 'general', kind: 'instant', desc: '증강 하나를 선택합니다. 다음 증강 선택 때 해당 증강이 자신에게 무조건 등장합니다.', how: '가림막 비밀 예약. 다음 선택창 첫 칸에 고정 등장.' },
  { no: 21, id: 'dokkaebi', name: '변환: 도깨비', cat: 'general', kind: 'active', desc: '1회, 일반말을 도깨비로 바꿉니다. 도깨비는 매 턴 도나 백도만큼 이동할 수 있습니다.', how: '변환 후 매 차례 한 번, 윷 결과와 별개로 도깨비를 도/빽도만큼 움직일 수 있습니다.' },
  { no: 22, id: 'vanguard', name: '변환: 선봉장', cat: 'general', kind: 'instant', desc: '일반말을 선봉장으로 바꿉니다. 선봉장이 윷판에 있는 동안, 내 모든 이동이 1칸 증가합니다.', how: '선봉장이 판 위에 있으면 내 모든 윷 결과 전진량 +1.' },
  { no: 23, id: 'cannon', name: '변환: 포', cat: 'general', kind: 'active', desc: '1회용, 일반말을 포로 바꿉니다. 매 차례 한 번, 포는 말이 있는 칸 하나를 넘어 원하는 만큼 일직선으로 이동할 수 있습니다.', how: '같은 직선 위의 말 있는 칸(다리)을 정확히 하나 넘어 원하는 칸에 착지. 넘은 뒤 처음 만나는 적은 잡을 수 있습니다.' },
  { no: 24, id: 'pawn', name: '변환: 폰', cat: 'general', kind: 'active', desc: '1회, 일반말을 폰으로 바꿉니다. 폰은 조작할 수 없지만 투척마다 도만큼 전진합니다.', how: '폰은 결과 칩으로 움직일 수 없고, 내가 던질 때마다 자동으로 1칸 전진합니다.' },
  { no: 25, id: 'four', name: '사목', cat: 'general', kind: 'win', desc: '내 말이 일직선으로 연속된 네 칸을 차지하거나 네 말이 한 말뭉치가 되면 승리합니다.', how: '한 직선 위 연속 4칸에 내 말이 있거나, 한 칸에 내 말 4개가 업히면 즉시 승리.' },
  { no: 26, id: 'cowback', name: '소 뒷걸음질', cat: 'general', kind: 'win', desc: '자신이 백도로 2번 말을 잡으면 승리합니다.', how: '빽도 이동으로 잡기 2회 달성 시 즉시 승리.' },
  { no: 27, id: 'hand', name: '손은 눈보다 빠르다', cat: 'general', kind: 'active', desc: '1회, 다음 윷을 던질 때 원하는 대로 낼 수 있습니다.', how: '투척 1회를 써서 빽도·도·개·걸·윷·모 중 원하는 결과를 얻습니다.' },
  { no: 28, id: 'timetravel', name: '시간 여행', cat: 'general', kind: 'active', desc: '1회, 자신의 말 하나를 원하는 뒤쪽 칸으로 이동시킵니다.', how: '지나온 길 위의 원하는 칸으로 즉시 이동. 적이 있으면 잡습니다.' },
  { no: 29, id: 'score', name: '악보가 완성되었다!', cat: 'general', kind: 'win', desc: '이번 게임 동안 자신이 백도, 도, 개, 걸, 윷, 모를 내면 승리합니다.', how: '게임 시작부터의 기록이 인정됩니다. 6가지를 모두 내면 즉시 승리.' },
  { no: 30, id: 'fog', name: '안개', cat: 'general', kind: 'active', desc: '1회, 두 차례 동안 윷판에 안개가 생깁니다. 안개 속에서 자신 이외의 플레이어는 자신 말 근처만 확인할 수 있습니다.', how: '2라운드 동안, 시전자가 아닌 플레이어의 차례에는 그 플레이어 말 주변 1칸만 보입니다.' },
  { no: 31, id: 'alkkagi', name: '알까기', cat: 'general', kind: 'active', desc: '1회, 차례를 사용해 알까기를 합니다.', how: '판의 모든 말이 알이 됩니다. 내 말을 당겼다 놓아 튕기고, 판 밖으로 나간 말은 죽습니다.' },
  { no: 32, id: 'fisher', name: '어부지리', cat: 'general', kind: 'passive', desc: '내 차례가 아닐 때 죽은 다른 플레이어의 말 개수 2개마다 개를 얻습니다.', how: '남의 차례에 남의 말이 2개 죽을 때마다 내 다음 차례에 개 칩 1개.' },
  { no: 33, id: 'illusion', name: '언제부터 착각한 거지?', cat: 'general', kind: 'instant', desc: '한 플레이어의 능력 하나를 지정해 3 라운드 동안 "고양이"로 바꿉니다. 이미 사용 완료한 증강은 바꿀 수 없습니다.', how: '지정한 증강이 3라운드 동안 능력 없는 고양이가 됩니다(고양이 좋아 발동 가능).' },
  { no: 34, id: 'throwhit', name: '윷을 잘 던져봐', cat: 'general', kind: 'active', desc: '1회, 윷을 던져서 플레이어를 맞춥니다. 해당 플레이어는 차례를 두 번 건너뜁니다.', how: '대상 플레이어 차례 2회 건너뜀.' },
  { no: 35, id: 'dual', name: '이도류', cat: 'general', kind: 'passive', desc: '윷을 2개씩 모두 던지며, 모 결과는 도로 바뀝니다.', how: '한 번 던질 때 결과를 2개 얻고, 모는 도가 됩니다(추가 투척 없음).' },
  { no: 36, id: 'objection', name: '이의있음!', cat: 'general', kind: 'instant', desc: '이번 증강 선택을 취소하고 다시 고릅니다.', how: '선택창을 새로 뽑아 다시 고릅니다.' },
  { no: 37, id: 'jajin', name: '자진모리 장단', cat: 'general', kind: 'passive', desc: '걸이 2번 나올 때마다 개를 얻습니다.', how: '걸 2회마다 개 칩 1개 추가.' },
  { no: 38, id: 'moonwalk', name: '천마군림보 - 달걸음', cat: 'general', kind: 'passive', desc: '자신의 모든 말이 반대 방향으로 이동합니다.', how: '0→19→18…→1→0 방향. 지름길도 15·10에서 거꾸로 진입합니다.' },
  { no: 39, id: 'shield', name: '천상의 보호막', cat: 'general', kind: 'active', desc: '1회, 자신의 말뭉치 하나를 선택합니다. 해당 말뭉치는 보호막을 얻어 죽음을 1번 견딥니다.', how: '잡히면 보호막만 깨지고, 공격한 말은 직전 칸에 멈춥니다.' },
  { no: 40, id: 'redbutton', name: '크고 빨간 버튼', cat: 'general', kind: 'instant', desc: '획득 즉시 두 대각선 지름길에 있는 모든 플레이어의 말을 죽입니다.', how: '20~28번(중앙 포함) 위의 모든 말이 죽습니다.' },
  { no: 41, id: 'friendshield', name: '프랜드 실드', cat: 'general', kind: 'passive', desc: '내 말뭉치가 죽을 때 말이 1개만 죽습니다.', how: '업힌 말뭉치가 죽을 때 1개만 대기실로 가고 나머지는 남습니다.' },
  { no: 42, id: 'sacrifice', name: '희생', cat: 'general', kind: 'active', desc: '1회, 윷판 위의 자신의 말 하나를 죽입니다. 윷판 위의 자신의 다른 모든 말에 보호막을 씌워 죽음을 1번 막습니다.', how: '말 1개를 바치고 나머지 판 위 내 말 전부에 보호막.' },
  { no: 43, id: 'poop', name: '히히 똥!', cat: 'general', kind: 'passive', desc: '무작위 칸에 똥을 쌉니다. 다른 플레이어의 말이 이동하다가 똥을 밟으면 멈춥니다.', how: '획득 시와 내 차례 시작마다 무작위 빈칸에 똥(최대 3개). 밟은 상대 말은 그 칸에 멈추고 똥은 치워집니다.' },
  { no: 44, id: 'equiv', name: '등가교환', cat: 'start', kind: 'passive', desc: '자신의 말 1개와 윷 1개를 제거하고 시작합니다.', how: '말 3개로 완주. 윷가락 3개: 앞면 0=윷, 1=도, 2=개, 3=걸(모 없음).' },
  { no: 45, id: 'party', name: '말이오? 파티', cat: 'start', kind: 'instant', desc: '판에 함정 6개와 보상 4개를 설치해 정확히 도착한 말을 이동시키거나 죽입니다. 자신이 설치한 함정에는 영향을 받지 않습니다.', how: '함정: 사망 또는 뒤로 3칸. 보상: 앞으로 2칸 또는 추가 투척. 설치자는 함정 면역.' },
  { no: 46, id: 'speed', name: '스겜', cat: 'start', kind: 'instant', desc: '모든 플레이어의 말이 2개가 되며, 자신의 말은 도와 개에서 시작합니다.', how: '모두 말 2개. 내 말은 1번(도)·2번(개) 칸에서 출발.' },
  { no: 47, id: 'kim', name: '시작 변환: 김첨지', cat: 'start', kind: 'win', desc: '일반말 하나를 김첨지로 바꿉니다. 김첨지가 6차례 안에 완주하면 승리합니다.', how: '내 6번째 차례가 끝나기 전에 김첨지가 완주하면 즉시 승리.' },
  { no: 48, id: 'queen', name: '시작 변환: 중전마마', cat: 'start', kind: 'win', desc: '좌측 상단의 중전마마가 죽으면 탈락하고, 12번 던질 때까지 지키면 승리합니다. 중전마마는 완주할 수 없습니다. 다른 말이 완주하면 목숨이 1개 증가합니다.', how: '10번 칸에 중전마마(목숨 1). 12번 던지는 동안 살아남으면 승리, 죽으면 탈락. 출구를 지나도 계속 돕니다.' },
  { no: 49, id: 'bear', name: '웅녀', cat: 'start', kind: 'win', desc: '무작위 칸의 마늘 3개를 모두 모으면 승리합니다.', how: '내 말이 마늘 칸을 지나거나 도착하면 획득. 3개면 승리.' },
  { no: 50, id: 'piggy', name: '이리 오너라 업고 놀자', cat: 'start', kind: 'instant', desc: '자신의 모든 말을 업은 채 도 위치에서 시작합니다.', how: '대기 중인 내 말 전부를 업어서 도 칸에 올립니다.' },
  { no: 51, id: 'burden', name: '짐덩이와 복덩이', cat: 'start', kind: 'passive', desc: '자신의 말 1개와 윷 1개를 추가하고 시작합니다.', how: '말 5개로 완주. 윷가락 5개: 앞면 0=특대모(6칸), 1=도 … 4=윷, 5=모.' },
  { no: 52, id: 'alone', name: '천상천하 유아독존', cat: 'start', kind: 'win', desc: '윷판에 말뭉치가 1개만 있으면 승리합니다.', how: '판에 말뭉치가 2개 이상 있었던 뒤로, 판 전체 말뭉치가 딱 1개가 되는 순간 승리(누구 말이든).' },
  { no: 53, id: 'seven', name: '777', cat: 'mid', kind: 'win', desc: '한 차례 안에 같은 윷 결과가 3번 이상 나오면 승리합니다.', how: '한 차례 동안 같은 결과 3회 기록 시 승리.' },
  { no: 54, id: 'nofriend', name: '나만 친구 없어', cat: 'mid', kind: 'win', desc: '이 증강을 선택한 후 다른 모든 플레이어가 자신의 말을 잡으면 승리합니다.', how: '남아 있는 다른 모든 플레이어가 한 번씩 내 말을 잡으면 승리.' },
  { no: 55, id: 'demon', name: '마신 소환', cat: 'mid', kind: 'win', desc: '내 모든 일반말을 광신도로 바꿉니다. 광신도는 차례 시작할 때 의식 코인 1개를 줍니다. 의식 코인 12개를 모으면 승리합니다', how: '내 차례 시작마다 판 위 광신도 수만큼 의식 코인. 12개면 승리.' },
  { no: 56, id: 'coup', name: '무신정변', cat: 'mid', kind: 'win', desc: '적 말을 4개 이상 죽이면 승리합니다.', how: '획득 후 적 말을 누적 4개(업힌 말은 개수대로) 죽이면 승리.' },
  { no: 57, id: 'treason', name: '역모', cat: 'mid', kind: 'passive', desc: '나보다 말을 많이 통과시킨 플레이어의 말을 죽일 때, 투척 기회를 1번 더 얻습니다.', how: '나보다 완주가 많은 플레이어의 말을 잡으면 추가 투척 +1(총 2회).' },
  { no: 58, id: 'wait', name: '잠깐!', cat: 'mid', kind: 'instant', desc: '다른 플레이어의 가장 앞선 말 뭉치 1개를 2라운드 동안 못 움직이게 합니다.', how: '대상 플레이어의 출구에 가장 가까운 말뭉치를 2라운드 동안 속박.' },

const AUG_BY = Object.fromEntries(AUGS.map(a => [a.id, a]));
const CAT_NAME = { general: '범용', start: '시작', mid: '중간', end: '마무리' };

/* =====================================================================
   5. 게임 상태
   ===================================================================== */
let G = null;
let PIECE_ID = 1;
const CFG = { n: 4, slots: ['human', 'ai', 'ai', 'ai'], chaos: false, endOnFirst: false, fast: false };

function makePiece(owner, type = 'normal') {

}
function makePlayer(i, ai) {

    st: { seen: {}, dogs: 0, dogCoins: 0, kills: 0, cow: 0, geol: 0, fish: 0, fishPending: 0, ritual: 0, nofriend: {}, hp: 3, queenThrows: 0, kimTurns: 0, domainTurns: 0, turns: 0, throws: 0 },
    host: null, ally: null, delivery: null, plan: null, badge: '', lastDone: null, aloneArmed: false, domainPiece: null

}
function newGame() {
  PIECE_ID = 1;

    players: [], n: CFG.n, chaos: CFG.chaos, endOnFirst: CFG.endOnFirst, round: 1, turnIdx: 0, over: false, needDraft: true,

    chosenRule: false, echo: null, echoSecond: false, murder: false, duel: null, rankTaken: new Set(),
    log: [], T: null, draft: null, alk: null, anim: null, fx: [], planWinner: null

  for (let i = 0; i < CFG.n; i++) G.players.push(makePlayer(i, CFG.slots[i] === 'ai'));
}

/* ----- 조회 도우미 ----- */
const P = i => G.players[i];
const canon = n => (G.alias[n] ?? n);
const isExit = n => n !== HOME && n !== DONE && canon(n) === canon(0);
const onBoard = pc => pc.pos !== HOME && pc.pos !== DONE;
const canonNodes = () => NODES.filter(n => canon(n) === n);
function aug(p, id) { return p.augs.find(a => a.id === id && !a.disabled && !(a.catUntil && G.round < a.catUntil)) || null; }
const has = (p, id) => !!aug(p, id);
const hasCat = p => p.augs.some(a => !a.disabled && (a.id === 'cat' || (a.catUntil && G.round < a.catUntil)));
const live = () => G.players.filter(p => !p.out);
const others = p => live().filter(q => q.id !== p.id);
const boardPieces = () => G.players.flatMap(p => p.pieces.filter(onBoard));
const piecesAt = n => boardPieces().filter(pc => canon(pc.pos) === canon(n));
const isBound = pc => pc.domain || pc.boundUntil > G.round;
const needPieces = p => p.pieces.filter(pc => pc.type !== 'queen');
const doneCount = p => p.pieces.filter(pc => pc.pos === DONE).length;
function stackOf(pc) {
  if (!onBoard(pc) || pc.type === 'pawn') return [pc];
  return P(pc.owner).pieces.filter(x => onBoard(x) && x.type !== 'pawn' && canon(x.pos) === canon(pc.pos));
}
function myStacks(p) {
  const seen = new Set(), out = [];
  for (const pc of p.pieces) {
    if (!onBoard(pc) || seen.has(pc.id)) continue;
    const s = stackOf(pc); s.forEach(x => seen.add(x.id)); out.push(s);
  }
  return out;
}
const allGroups = () => G.players.flatMap(p => myStacks(p));
const stackBound = s => s.some(isBound);
function stepsToFinish(pos, trail, rev) {
  if (pos === DONE) return 0;
  if (pos !== HOME && isExit(pos)) return 1;
  let cur = pos, prev = trail && trail.length ? trail[trail.length - 1] : null, start = true;
  for (let n = 1; n < 60; n++) {
    const nx = cur === HOME ? (rev ? 19 : 1) : nextNode(cur, prev, start, rev);
    prev = cur; cur = nx; start = false;
    if (isExit(nx)) return n;
  }
  return 60;
}
function progress(p) {
  let s = doneCount(p) * 100;
  for (const pc of needPieces(p)) if (pc.pos !== DONE) s -= stepsToFinish(pc.pos, pc.trail, p.reverse);
  return s;
}
function say(msg, toast) {

/* =====================================================================
   6. 순위 · 탈락 · 승리
   ===================================================================== */
function freeRanks() { const r = []; for (let i = 1; i <= G.n; i++) if (!G.rankTaken.has(i)) r.push(i); return r; }
const bestFree = () => freeRanks()[0] ?? G.n;
const worstFree = () => { const f = freeRanks(); return f.length ? f[f.length - 1] : G.n; };
function setRank(p, r, reason) {

}
function checkContention() {
  const l = live();
  if (l.length <= 1) {
    if (l.length === 1) { setRank(l[0], bestFree(), '마지막 생존'); say(`${l[0].name} ${l[0].rank}위 확정`); }
    G.over = true;

}
async function award(p, reason) {

  say(`🏅 ${p.name} ${r}위! (${reason})`, p.color);
  if (r === 1) {
    for (const q of G.players) {
      if (q.out) continue;
      if (q.host === p.id) { const slot = bestFree(); setRank(q, 1, `거머리: ${p.name}와 함께 승리`); G.rankTaken.add(slot); say(`${q.name}도 거머리로 함께 승리!`, q.color); }
      else if (p.ally === q.id) { const slot = bestFree(); setRank(q, 1, `네크로맨서: ${p.name}와 함께 승리`); G.rankTaken.add(slot); say(`${q.name}도 네크로맨서 동맹으로 함께 승리!`, q.color); }

}
async function eliminate(p, why) {

  SFX.play('bad');

  if (G.duel && (G.duel.caster === p.id || G.duel.target === p.id)) G.duel = null;
  for (const q of G.players) if (!q.out && q.host === p.id) await eliminate(q, `거머리: ${p.name}와 동반 탈락`);

}
async function tryCancel(p, why, augId, isFinish) {

async function specialWin(p, why, augId) {

  SFX.play('finish');

async function revive(t, by) {

/* =====================================================================
   7. 죽음(잡기) 엔진 — 보호막 · 평화 협정 · 프랜드 실드 · 중전마마 목숨

function sendHome(pc) { pc.pos = HOME; pc.trail = []; pc.shield = 0; pc.boundUntil = 0; pc.domain = false; }
async function killPieces(victims, killer, cause) {
  const groups = new Map();
  for (const v of victims) {
    if (!onBoard(v)) continue;
    const k = v.owner + ':' + canon(v.pos) + (v.type === 'pawn' ? ':p' + v.id : '');
    if (!groups.has(k)) groups.set(k, []);
    groups.get(k).push(v);
  }
  const res = { killed: [], shielded: false, immune: false };
  const elim = [];
  for (const grp of groups.values()) {
    const owner = P(grp[0].owner);
    const node = grp[0].pos;
    if (killer && killer.id !== owner.id && (has(owner, 'peace') || has(killer, 'peace'))) {
      res.immune = true; R.fxText(node, '평화 협정', '#9fe3d0'); continue;
    }
    if (grp.some(x => x.shield > 0)) {
      grp.forEach(x => { if (x.shield > 0) x.shield--; });
      res.shielded = true; SFX.play('shield'); R.fxRing(node, '#ffd65a');
      say(`🛡 ${owner.name}의 보호막이 죽음을 막았습니다`);
      continue;
    }
    let dying = grp.slice();
    for (const q of grp) if (q.type === 'queen' && q.lives > 1) { q.lives--; dying = dying.filter(x => x !== q); say(`👑 중전마마 목숨 -1 (남은 목숨 ${q.lives})`); R.fxRing(node, '#ffb3d1'); }
    if (dying.length > 1 && has(owner, 'friendshield')) {
      const one = dying.find(x => x.type === 'normal') || dying[0];
      dying = [one]; say(`🤝 ${owner.name}의 프랜드 실드: 1개만 죽습니다`);
    }
    if (!dying.length) continue;
    for (const pc of dying) {
      if (pc.type === 'queen') elim.push([owner, '중전마마 사망']);
      if (pc.domain) elim.push([owner, '영역 전개 실패']);
      sendHome(pc);
      res.killed.push(pc);
    }
    R.fxBoom(node, owner.color);
  }
  if (res.killed.length) { SFX.play('capture'); await afterKills(res.killed, killer, cause); }
  for (const [o, why] of elim) await eliminate(o, why);

}
async function afterKills(killed, killer, cause) {
  const curPid = G.T ? G.T.pid : -1;
  const byOwner = {};
  killed.forEach(pc => byOwner[pc.owner] = (byOwner[pc.owner] || 0) + 1);
  for (const f of G.players) {
    if (f.out || !has(f, 'fisher') || f.id === curPid) continue;
    const n = killed.filter(pc => pc.owner !== f.id).length;
    if (!n) continue;
    f.st.fish += n;
    while (f.st.fish >= 2) { f.st.fish -= 2; f.st.fishPending++; say(`🎣 ${f.name} 어부지리: 다음 차례에 개 획득`); }
  }
  if (!killer) return;
  const enemyKills = killed.filter(pc => pc.owner !== killer.id).length;
  if (enemyKills && has(killer, 'coup') && !killer.out) {
    killer.st.kills += enemyKills;
    say(`⚔ 무신정변 ${killer.st.kills}/4`);
    if (killer.st.kills >= 4) await specialWin(killer, '무신정변: 적 말 4개 처치', 'coup');
  }
  if (G.murder && has(killer, 'murder')) {
    for (const [oid, n] of Object.entries(byOwner)) {
      const v = P(+oid);
      if (v.id === killer.id || v.out) continue;
      v.st.hp -= n;
      say(`🩸 ${v.name} 체력 -${n} (남은 체력 ${Math.max(0, v.st.hp)})`);
      if (v.st.hp <= 0) await eliminate(v, '체력 0 ("살인")');
    }
  }
  for (const oid of Object.keys(byOwner)) {
    const v = P(+oid);
    if (v.id === killer.id || v.out || !has(v, 'nofriend')) continue;
    v.st.nofriend[killer.id] = true;
    const need = G.players.filter(q => q.id !== v.id && !q.out);
    say(`🥲 나만 친구 없어: ${need.filter(q => v.st.nofriend[q.id]).length}/${need.length}`);
    if (need.length && need.every(q => v.st.nofriend[q.id])) await specialWin(v, '나만 친구 없어: 모두에게 잡힘', 'nofriend');

/* =====================================================================
   8. 이동 엔진
   ===================================================================== */
const poopBlocks = (n, owner) => G.poops.some(pp => canon(pp.node) === canon(n) && pp.owner !== owner.id);
// 경로 계산. steps<0 이면 빽도(지나온 길 역행)
function computePath(pc, steps, owner, stack) {
  stack = stack || [pc];
  const rev = !!owner.reverse;
  const queenOnly = stack.every(x => x.type === 'queen');
  let cur = pc.pos;
  const trail = pc.trail.slice();
  const path = [];
  let finished = false, poop = null;
  if (steps > 0) {
    let prev = trail.length ? trail[trail.length - 1] : null, start = true;
    for (let i = 0; i < steps; i++) {
      if (cur !== HOME && isExit(cur) && !queenOnly) { finished = true; break; }
      const nx = cur === HOME ? (rev ? 19 : 1) : nextNode(cur, prev, start, rev);
      if (cur !== HOME) trail.push(cur);
      path.push(nx); prev = cur; cur = nx; start = false;
      if (isExit(nx) && !queenOnly) { finished = true; break; }
      if (i < steps - 1 && poopBlocks(nx, owner)) { poop = nx; break; }
    }
  } else if (steps < 0) {
    if (cur === HOME) return { path, finished, trail, poop, invalid: true };
    for (let i = 0; i < -steps; i++) {
      const nx = trail.length ? trail.pop() : defaultPrev(cur, rev);
      path.push(nx); cur = nx;
      if (i < -steps - 1 && poopBlocks(nx, owner)) { poop = nx; break; }
    }
  }
  return { path, finished, trail, poop };
}
function vanguardOn(p) { return p.pieces.some(pc => pc.type === 'vanguard' && onBoard(pc)); }
function modValue(p, v) {
  let a = v;
  if (a > 0 && vanguardOn(p)) a += 1;
  if (G.T && G.T.pid === p.id && G.T.lastDance) a *= 2;
  return a;
}
function movableLeads(p, v) {
  const out = [], seen = new Set();
  for (const pc of p.pieces) {
    if (pc.pos === DONE || pc.type === 'pawn' || seen.has(pc.id)) continue;
    if (pc.pos === HOME) { if (v > 0) out.push(pc); continue; }
    const s = stackOf(pc); s.forEach(x => seen.add(x.id));
    if (stackBound(s)) continue;
    const r = computePath(pc, modValue(p, v), p, s);
    if (r.path.length || r.finished) out.push(pc);
  }
  return out;
}
async function moveStack(p, lead, amount, opt = {}) {
  const stack = lead.pos === HOME ? [lead] : stackOf(lead);
  const r = computePath(lead, amount, p, stack);
  if (!r.path.length && !r.finished) return { moved: false };
  return executeMove(p, stack, lead.pos, r, { backdo: amount < 0, ...opt });
}
// 경로 r={path, trail, finished, poop}를 실제로 적용
async function executeMove(p, stack, from, r, opt = {}) {
  await animateMove(stack, from, r.path, p);
  if (G.over) return { moved: true };
  await collectGarlic(p, r.path);
  if (G.over || p.out) return { moved: true };
  if (r.finished) {
    const fin = stack.filter(x => x.type !== 'queen');
    const end = r.path.length ? r.path[r.path.length - 1] : from;
    stack.filter(x => x.type === 'queen').forEach(q => { q.pos = end; q.trail = r.trail.slice(); });
    if (fin.length) await onFinish(p, fin);
    render();
    return { moved: true, finished: true };
  }
  const dest = r.path[r.path.length - 1];
  stack.forEach(x => { x.pos = dest; x.trail = r.trail.slice(); });
  SFX.play('land');
  if (r.poop) {
    G.poops = G.poops.filter(pp => canon(pp.node) !== canon(dest));
    say(`💩 ${p.name}의 말이 똥을 밟고 멈췄습니다!`);
    R.fxText(dest, '똥!', '#b07a3a'); SFX.play('bad');
  }
  const prevNode = r.path.length >= 2 ? r.path[r.path.length - 2] : from;
  const res = await resolveLanding(p, stack, dest, { backdo: !!opt.backdo, prevNode, r });
  if (G.over || p.out) return { moved: true, ...res };
  if (!r.poop && !opt.noTrap && stack.some(onBoard)) await triggerTrap(p, stack, opt.depth || 0);
  render();
  return { moved: true, ...res };
}
async function resolveLanding(p, stack, dest, ctx) {
  const out = { captured: 0 };
  const here = piecesAt(dest).filter(x => !stack.includes(x));
  const enemies = here.filter(x => x.owner !== p.id);
  if (enemies.length) {
    const kr = await killPieces(enemies, p, 'capture');
    if (kr.killed.length) {
      out.captured = kr.killed.length;
      const vs = [...new Set(kr.killed.map(x => P(x.owner).name))].join(', ');
      say(`💥 ${p.name}이(가) ${vs}의 말 ${kr.killed.length}개를 잡았습니다!`, p.color);
      if (G.T && G.T.pid === p.id && !p.out) {
        let bonus = 1;
        if (has(p, 'treason') && kr.killed.some(x => doneCount(P(x.owner)) > doneCount(p))) { bonus++; say('🗡 역모: 투척 기회 +1 추가'); }
        G.T.throwsLeft += bonus;
      }
      if (ctx.backdo && has(p, 'cowback') && !p.out) {
        p.st.cow++; say(`🐄 소 뒷걸음질 ${p.st.cow}/2`);
        if (p.st.cow >= 2) await specialWin(p, '소 뒷걸음질: 빽도로 2번 잡기', 'cowback');
      }
    } else if (kr.shielded && stack.some(onBoard)) {
      const pn = ctx.prevNode;
      const r = ctx.r;
      if (pn === HOME) stack.forEach(x => { x.pos = HOME; x.trail = []; });
      else {
        const tr = ctx.backdo ? r.trail.concat([dest]) : r.trail.slice(0, -1);
        stack.forEach(x => { x.pos = pn; x.trail = tr.slice(); });
      }
      say('보호막에 막혀 공격한 말이 직전 칸에 멈췄습니다');
    }
  }
  if (G.over || p.out) return out;
  const mine = piecesAt(dest).filter(x => x.owner === p.id && !stack.includes(x));
  const lead = stack.find(onBoard);
  if (mine.length && lead && lead.type !== 'pawn' && canon(lead.pos) === canon(dest)) {
    if (has(p, 'cannibal')) {
      const kr = await killPieces(mine, p, 'cannibal');
      if (kr.killed.length) {
        say(`🍖 카니발리즘: ${p.name}이(가) 자기 말 ${kr.killed.length}개를 먹었습니다 (추가 투척)`);
        if (G.T && G.T.pid === p.id) G.T.throwsLeft += 1;
      }
    } else {
      const joiners = mine.filter(x => x.type !== 'pawn');
      joiners.forEach(x => { x.pos = lead.pos; x.trail = lead.trail.slice(); });
      if (joiners.length) { say(`${p.name} 업기! (${stackOf(lead).length}개)`); R.fxText(dest, '업기', p.color); }
    }
  }
  return out;
}
async function triggerTrap(p, stack, depth) {
  if (depth > 2) return;
  const lead = stack.find(onBoard);
  if (!lead) return;
  const t = G.traps.find(x => canon(x.node) === canon(lead.pos));
  if (!t) return;
  if (t.kind === 'trap') {
    if (t.owner === p.id) return;
    if (Math.random() < 0.5) {
      say(`💣 함정! ${p.name}의 말이 터졌습니다`, '#e66');
      SFX.play('boom');
      await killPieces(stackOf(lead), P(t.owner), 'trap');
    } else {
      say(`💣 함정! ${p.name}의 말이 뒤로 3칸`);
      await moveStack(p, lead, -3, { noTrap: true });
    }
  } else {
    if (Math.random() < 0.5) {
      say(`🎁 보상! ${p.name}의 말이 앞으로 2칸`);
      await moveStack(p, lead, 2, { depth: depth + 1 });
    } else {
      say(`🎁 보상! ${p.name} 추가 투척`);
      if (G.T && G.T.pid === p.id) G.T.throwsLeft++;
    }
  }
}
async function collectGarlic(p, path) {
  const g = G.garlics.find(x => x.owner === p.id);
  if (!g || !has(p, 'bear')) return;
  for (const n of path) {
    const i = g.nodes.findIndex(x => canon(x) === canon(n));
    if (i >= 0) { g.nodes.splice(i, 1); g.got++; say(`🧄 웅녀: 마늘 ${g.got}/3`); R.fxText(n, '마늘!', '#fff'); SFX.play('magic'); }
  }
  if (g.got >= 3) await specialWin(p, '웅녀: 마늘 3개를 모두 모음', 'bear');
}
async function advancePawns(p) {
  for (const pc of p.pieces) {
    if (pc.type !== 'pawn' || pc.pos === DONE || isBound(pc) || p.out || G.over) continue;
    await moveStack(p, pc, 1, { pawn: true });
  }
}

function stickCount(p) { return (has(p, 'excess') ? 6 : 4) + (has(p, 'burden') ? 1 : 0) - (has(p, 'equiv') ? 1 : 0); }
function throwSticks(p) {
  if (has(p, 'moordo')) {
    const mo = Math.random() < 0.5;
    return { v: mo ? 5 : 1, flats: mo ? [false, false, false, false] : [false, true, false, false] };
  }
  const n = stickCount(p), ex = has(p, 'excess');
  const flats = Array.from({ length: n }, () => Math.random() < 0.55);
  const k = flats.filter(Boolean).length;
  let v;
  if (ex) v = k === n ? 'OUT' : k === 0 ? 5 : k >= 4 ? 4 : k;
  else if (n <= 3) v = k === 0 ? 4 : k;
  else if (n === 4) v = k === 0 ? 5 : k;
  else v = k === 0 ? 6 : Math.min(k, 5);
  if (v === 1 && flats[0]) v = -1;
  return { v, flats };
}
async function doThrow(p, forced) {
  const T = G.T;
  if (forced === undefined && T.throwsLeft <= 0) return;
  T.throwsLeft--; T.fresh = false;
  const sets = [];
  if (forced !== undefined) sets.push({ v: forced, flats: null });
  else if (has(p, 'dogpig')) {
    const v = await UI.choose(p, '개돼지: 이번 결과를 고르세요', [{ label: '도 (1칸)', value: 1 }, { label: '개 (2칸)', value: 2 }], { ai: () => AI.dogpig(p) });
    sets.push({ v: v ?? 2, flats: null });
  } else sets.push(throwSticks(p));
  if (has(p, 'dual')) {
    sets.push(throwSticks(p));
    sets.forEach(s => { if (s.v === 5) { s.v = 1; s.dualFix = true; } });
  }
  p.st.throws++;
  SFX.play('throw');
  await UI.showThrow(p, sets);
  for (const s of sets) {
    if (s.v === 'OUT') { say(`🎋 ${p.name} 과유불급: 앞면 ${stickCount(p)}개!`, '#e66'); await eliminate(p, '과유불급 (앞면 전부)'); return; }
    T.chips.push(s.v);
    if (s.v >= 4) T.throwsLeft++;
    say(`${p.name}: ${resName(s.v)}${s.dualFix ? ' (이도류: 모→도)' : ''}${s.v >= 4 ? ' — 한 번 더!' : ''}`);
    await recordResult(p, s.v);
    if (p.out || G.over) return;
  }
  if (has(p, 'queen')) {
    p.st.queenThrows++;
    const q = p.pieces.find(x => x.type === 'queen');
    if (q && onBoard(q) && p.st.queenThrows >= 12) { if (await specialWin(p, '중전마마를 12번 던질 때까지 지킴', 'queen')) return; }
  }
  await advancePawns(p);
  render();
}
async function recordResult(p, v) {
  const T = G.T;
  p.st.seen[v === 6 ? 5 : v] = true;
  T.counts[v] = (T.counts[v] || 0) + 1;
  if (v === 2) { p.st.dogs++; if (has(p, 'doberman')) p.st.dogCoins++; }
  if (v === 3 && has(p, 'jajin')) {
    p.st.geol++;
    if (p.st.geol % 2 === 0) { T.chips.push(2); say('🥁 자진모리 장단: 걸 2번 → 개 추가!'); }
  }
  if (v === 5 && T.poisoned) { say('☠ 독이 든 성배: 모가 나왔습니다!', '#e66'); await eliminate(p, '독이 든 성배'); return; }
  if (has(p, 'score') && [-1, 1, 2, 3, 4, 5].every(k => p.st.seen[k])) { if (await specialWin(p, '악보 완성 (빽도·도·개·걸·윷·모)', 'score')) return; }
  if (has(p, 'seven') && T.counts[v] >= 3) { if (await specialWin(p, `777: 한 차례에 ${resName(v)} 3번`, 'seven')) return; }

/* =====================================================================
   10. 판 변형: 접기 · 회전 · 설치물

// 접은 뒤의 칸 별칭표: 출구(0)가 있는 쪽 절반이 남고, 반대쪽 절반은 거울 대칭 칸으로 합쳐진다
function foldAlias(dir) {
  const ex = XY[canon(0)];
  const keepHigh = dir === 'h' ? ex[1] > 0.5 : ex[0] > 0.5;
  const mirror = c => {
    const [x, y] = XY[c];
    if (dir === 'h') { if ((keepHigh && y < 0.5 - 1e-6) || (!keepHigh && y > 0.5 + 1e-6)) return nodeAt(x, 1 - y); }
    else if ((keepHigh && x < 0.5 - 1e-6) || (!keepHigh && x > 0.5 + 1e-6)) return nodeAt(1 - x, y);
    return c;
  };
  const na = {};
  for (const n of NODES) { const c2 = mirror(canon(n)); if (c2 !== n) na[n] = c2; }
  return na;
}
async function applyFold(dir, actor) {
  SFX.play('fold');
  UI.flash('게임 접어라!', actor.color);
  await R.animFold(dir);
  G.alias = foldAlias(dir);
  G.folds.push(dir);
  say(`📄 ${actor.name}: 윷판을 ${dir === 'h' ? '가로로' : '세로로'} 접었습니다! 대칭 칸이 하나로 합쳐졌습니다`, actor.color);
  await resolveMerges(actor);
  await checkBoardWins();
  render();
}
// 접기로 같은 칸에 겹친 서로 다른 플레이어의 말 → 잡기 판정
async function resolveMerges(actor) {
  const byNode = new Map();
  for (const pc of boardPieces()) { const c = canon(pc.pos); if (!byNode.has(c)) byNode.set(c, []); byNode.get(c).push(pc); }
  for (const [node, pcs] of byNode) {
    const owners = [...new Set(pcs.map(x => x.owner))];
    if (owners.length < 2) continue;
    let winner = owners.includes(actor.id) ? actor.id : null;
    if (winner === null) { const flap = pcs.filter(x => x.pos !== canon(x.pos)).map(x => x.owner); winner = flap.length ? flap[0] : pick(owners); }
    const victims = pcs.filter(x => x.owner !== winner && onBoard(x));
    if (!victims.length) continue;
    say(`접힌 ${node}번 칸: ${P(winner).name}의 말이 위에 포개졌습니다`);
    await killPieces(victims, P(winner), 'fold');
  }
}
async function doRotate(actor) {
  SFX.play('magic');
  UI.flash('돌려돌려 돌림판!', actor.color);
  await R.animRotate();
  const m = ROT;
  for (const pc of G.players.flatMap(q => q.pieces)) if (onBoard(pc)) { pc.pos = m[pc.pos]; pc.trail = pc.trail.map(n => m[n]); }
  const na = {};
  for (const n of NODES) { const a = G.alias[n]; if (a !== undefined) na[m[n]] = m[a]; }
  G.alias = na;
  G.poops.forEach(x => x.node = m[x.node]);
  G.traps.forEach(x => x.node = m[x.node]);
  G.garlics.forEach(g => g.nodes = g.nodes.map(n => m[n]));
  G.targets.forEach(t => t.node = m[t.node]);
  G.rotations++;
  say(`🌀 ${actor.name}: 판이 시계방향으로 90° 돌았습니다 (출구는 그대로)`, actor.color);
  await checkBoardWins();
  render();
}
function placePoop(p) {
  const occupied = new Set(boardPieces().map(pc => canon(pc.pos)));
  const cands = canonNodes().filter(n => !isExit(n) && !occupied.has(n) && !G.poops.some(x => canon(x.node) === n));
  if (!cands.length) return;
  const mine = G.poops.filter(x => x.owner === p.id);
  if (mine.length >= 3) G.poops.splice(G.poops.indexOf(mine[0]), 1);
  const n = pick(cands);
  G.poops.push({ node: n, owner: p.id });

function fourCheck(p) {
  const cnt = {};
  p.pieces.filter(onBoard).forEach(x => { const c = canon(x.pos); cnt[c] = (cnt[c] || 0) + 1; });
  if (Object.values(cnt).some(c => c >= 4)) return true;
  const occ = new Set(Object.keys(cnt).map(Number));
  for (const L of LINES) {
    const cl = L.map(canon);
    for (let i = 0; i + 3 < cl.length; i++) { const w = cl.slice(i, i + 4); if (new Set(w).size === 4 && w.every(n => occ.has(n))) return true; }
  }
  return false;
}

    if (p.out || G.over) continue;

    if (has(p, 'alone')) {

    }
  }
}

   13. 액티브 증강 (버튼)

function dokPiece(p) { return p.pieces.find(x => x.type === 'dokkaebi' && x.pos !== DONE && !(onBoard(x) && stackBound(stackOf(x)))); }
function cannonPiece(p) { return p.pieces.find(x => x.type === 'cannon' && onBoard(x) && !isBound(x)); }
function cannonMoves(p) {
  const c = cannonPiece(p);
  if (!c) return [];
  const here = canon(c.pos), res = [];
  for (const L of LINES) {
    const cl = []; L.forEach(n => { const k = canon(n); if (cl[cl.length - 1] !== k) cl.push(k); });
    const i = cl.indexOf(here);
    if (i < 0) continue;
    for (const d of [1, -1]) {
      let j = i + d, screen = false;
      const path = [];
      while (j >= 0 && j < cl.length) {
        const n = cl[j];
        path.push(n);
        const occ = piecesAt(n).filter(x => x !== c);
        if (!screen) { if (occ.length) screen = true; }
        else if (occ.length) {
          if (occ.some(x => x.owner !== p.id) && !isExit(n)) res.push({ to: n, path: path.slice(), capture: true });
          break;
        } else if (!isExit(n)) res.push({ to: n, path: path.slice(), capture: false });
        j += d;
      }
    }
  }
  return res;
}
function badukOptions(p) {
  const res = [], keys = new Set();
  for (const L of LINES) {
    const cl = []; L.forEach(n => { const k = canon(n); if (cl[cl.length - 1] !== k) cl.push(k); });
    const idx = [];
    cl.forEach((n, i) => { if (piecesAt(n).some(x => x.owner === p.id)) idx.push(i); });
    for (let a = 0; a < idx.length; a++) for (let b = a + 1; b < idx.length; b++) {
      const i1 = idx[a], i2 = idx[b];
      if (i2 - i1 < 2) continue;
      const vs = new Set();
      for (let k = i1 + 1; k < i2; k++) piecesAt(cl[k]).filter(x => x.owner !== p.id).forEach(x => vs.add(x));
      const key = [cl[i1], cl[i2]].sort((x, y) => x - y).join('-');
      if (vs.size && !keys.has(key)) { keys.add(key); res.push({ a: cl[i1], b: cl[i2], victims: [...vs] }); }
    }
  }
  return res;
}
function backNodes(pc, p) {
  const out = [];
  let cur = pc.pos;
  const tr = pc.trail.slice();
  for (let k = 0; k < 30; k++) {
    const nx = tr.length ? tr.pop() : defaultPrev(cur, p.reverse);
    if (nx === undefined || isExit(nx)) break;
    if (!out.some(o => canon(o.node) === canon(nx)) && canon(nx) !== canon(pc.pos)) out.push({ node: nx, trail: tr.slice() });
    cur = nx;
  }
  return out;
}
async function truckMove(p, s) {
  const lead = s[0], cur = lead.pos;
  const prev = lead.trail.length ? lead.trail[lead.trail.length - 1] : null;

function availableActions(p) {
  if (!G.T || G.T.pid !== p.id) return [];
  return ACTIONS.filter(a => {
    const inst = aug(p, a.aug);
    if (!inst) return false;
    if (a.once && inst.used) return false;
    if (a.fresh && !G.T.fresh) return false;
    try { return !!a.can(p); } catch (e) { return false; }
  });
}
async function useAction(p, key) {
  const a = ACTIONS.find(x => x.key === key);
  if (!a) return;
  const inst = aug(p, a.aug);
  if (!inst || (a.once && inst.used) || !availableActions(p).includes(a)) return;
  const ok = await a.run(p);
  if (ok && a.once) inst.used = true;
  render();
}

async function turnStart(p) {
  p.st.turns++;
  if (has(p, 'kim') && p.pieces.some(x => x.type === 'kim' && x.pos !== DONE)) p.st.kimTurns++;
  if (G.echo && G.echo.owner === p.id && !G.echo.active) { G.echo.active = true; say('🔁 메아리의 형상: 지금부터 모든 플레이어가 차례를 두 번씩!', true); }
  const mine = G.targets.filter(t => t.owner === p.id);
  G.targets = G.targets.filter(t => t.owner !== p.id);
  for (const t of mine) {
    const vs = piecesAt(t.node);
    say(`🎯 ${p.name}의 명사수 발사! ${t.node}번 칸 (${vs.length}개)`, p.color);
    SFX.play('boom');
    await R.fxShot(t.node);
    if (vs.length) await killPieces(vs, p, 'sniper');
    if (p.out || G.over) return;
  }
  if (has(p, 'demon')) {
    const n = p.pieces.filter(x => x.type === 'cultist' && onBoard(x)).length;
    if (n) { p.st.ritual += n; say(`🔮 의식 코인 +${n} (${p.st.ritual}/12)`); }
    if (p.st.ritual >= 12) { UI.flash('마신 강림!', '#8f5fd0'); if (await specialWin(p, '마신 소환: 의식 코인 12개', 'demon')) return; }
  }
  if (p.domainPiece) {
    const pc = p.pieces.find(x => x.id === p.domainPiece);
    if (pc && pc.domain && onBoard(pc)) {
      p.st.domainTurns++;
      say(`🔯 영역 전개 ${p.st.domainTurns}/2`);
      if (p.st.domainTurns >= 2) { p.domainPiece = null; pc.domain = false; if (await specialWin(p, '영역 전개: 두 차례 생존', 'domain')) return; }
    } else p.domainPiece = null;
  }
  while (p.st.fishPending > 0) { p.st.fishPending--; G.T.chips.push(2); say(`🎣 ${p.name} 어부지리: 개 획득`); }
  if (has(p, 'poop')) placePoop(p);
  if (p.pieces.some(x => x.type === 'queen' && onBoard(x)) && has(p, 'queen')) say(`👑 중전마마 던진 횟수 ${p.st.queenThrows}/12`);
  render();
}
async function turnEnd(p, skipped) {
  if (!skipped && G.T && G.T.lastDance && !p.out && !G.over) { say(`💃 라스트 댄스가 끝났습니다`); await eliminate(p, '라스트 댄스'); }
  if (G.duel && G.duel.target === p.id && !G.over) {
    G.duel.turns++;
    say(`⚔ 승부다! ${p.name} ${G.duel.turns}/3차례`);
    if (G.duel.turns >= 3) { G.duel = null; if (!p.out) { say(`⚔ 승부다!: ${p.name} 3차례 안에 완주 실패`, true); await eliminate(p, '승부다! 패배'); } }
  }
}
async function useChip(p, ci, lead) {
  const T = G.T;
  const v = T.chips[ci];
  if (v === undefined) return;
  const leads = movableLeads(p, v);
  let ok = leads.find(x => x === lead) || leads.find(x => onBoard(x) && onBoard(lead) && stackOf(x).includes(lead));
  if (!ok) { UI.toast('그 말은 이 결과로 움직일 수 없어요'); return; }
  T.chips.splice(ci, 1);
  T.fresh = false;
  await moveStack(p, ok, modValue(p, v));
}
async function performAction(p, act) {
  if (act.type === 'throw') await doThrow(p);
  else if (act.type === 'move') await useChip(p, act.chip, act.piece);
  else if (act.type === 'action') await useAction(p, act.key);
}
const hasTurnActions = p => availableActions(p).length > 0;
async function playTurn(p) {
  G.T = { pid: p.id, throwsLeft: 1, chips: [], counts: {}, fresh: true, poisoned: false, lastDance: false, usedDok: false, usedCannon: false, endNow: false, aiTried: new Set() };
  UI.sel = null;
  SFX.play('turn');
  render();
  if (p.skip > 0) {
    p.skip--;
    say(`⏭ ${p.name} 차례를 건너뜁니다${p.skip ? ` (앞으로 ${p.skip}번 더)` : ''}`, p.color);
    UI.flash(`${p.name} 건너뜀`, p.color);
    await sleep(1000);
    await turnEnd(p, true);
    return;
  }
  if (!p.ai && G.players.filter(q => !q.ai && !q.out).length > 1) UI.toast(`${p.name} (${p.cname}) 차례입니다`, p.color);
  await turnStart(p);
  while (!G.over && !p.out && !G.T.endNow) {
    const T = G.T;
    if (T.throwsLeft <= 0 && T.chips.length && !T.chips.some(v => movableLeads(p, v).length)) {
      say(`움직일 수 없는 결과(${T.chips.map(resName).join(', ')})는 버립니다`);
      T.chips = []; UI.sel = null;
    }
    const idle = T.throwsLeft <= 0 && !T.chips.length;
    if (idle && !p.ai && !hasTurnActions(p)) break;
    const act = p.ai ? await AI.act(p) : await UI.waitAction(p);
    if (!act || act.type === 'end') break;
    await performAction(p, act);
    if (!G.over) await checkBoardWins();
    render();
  }
  await turnEnd(p, false);
}
function newRound() {
  G.round++;
  if (G.round === 6 || G.round === 12) G.needDraft = true;
  if (G.fog && G.round >= G.fog.until) { G.fog = null; say('🌫 안개가 걷혔습니다'); }
  say(`── ${G.round}라운드 ──`);
}
function advanceTurn() {
  const cur = P(G.turnIdx);
  if (G.echo && G.echo.active && !G.echoSecond && !cur.out) { G.echoSecond = true; say(`🔁 메아리: ${cur.name} 한 번 더!`); return; }
  G.echoSecond = false;
  let i = G.turnIdx;
  for (let k = 0; k < G.n; k++) {
    i = (i + 1) % G.n;
    if (i === 0) newRound();
    if (!P(i).out) break;
  }
  G.turnIdx = i;
}

    const p = P(G.turnIdx);

async function finishGame() {

  G.planWinner = null;
  for (const p of G.players) {

    say(`📜 ${p.name}의 계획대로: ${p.plan.map(id => P(id).name).join(' > ')} — ${hit ? '적중!' : '빗나감'}`);

    G.planWinner = p;

}

  drawAlk(c, t) {

  /* ----- 이펙트 ----- */
  fxAt(node) { return this.NP(node); },
  fxBoom(node, color) {

    const parts = Array.from({ length: 12 }, () => ({ a: Math.random() * Math.PI * 2, s: 0.6 + Math.random() * 0.8 }));

  },
  fxText(node, text, color) { if (!G) return; const [x, y] = this.fxAt(node); G.fx.push({ type: 'text', x, y, text, color: color || '#fff', t0: performance.now(), dur: 1100 }); },
  fxRing(node, color) { if (!G) return; const [x, y] = this.fxAt(node); G.fx.push({ type: 'ring', x, y, color: color || '#ffd65a', t0: performance.now(), dur: 700 }); },
  async fxShot(node) { const [x, y] = this.fxAt(node); G.fx.push({ type: 'shot', x, y, t0: performance.now(), dur: 600 }); await sleep(600); },

  async fxDiagBlast() { G.fx.push({ type: 'diag', t0: performance.now(), dur: 700 }); await sleep(650); },
  drawFx(c, t) {

        if (k > 0.6) { c.fillStyle = `rgba(255,220,120,${1 - k})`; c.beginPath(); c.arc(f.x, f.y, S * 0.06, 0, Math.PI * 2); c.fill(); }

    clearTimeout(this._ft); this._ft = setTimeout(() => { f.hidden = true; }, 1350);
  },
  ticker(msg) { const t = $('#ticker'); if (t) t.textContent = msg; },
  banner(msg, cancellable, onCancel) {

    $('#banner').hidden = false;
  },
  hideBanner() { $('#banner').hidden = true; },

  /* ----- 화면 갱신 ----- */
  refresh() {

    this.topbar(); this.playersView(); this.controls();
  },
  topbar() {
    $('#roundLbl').textContent = `${G.round}R`;

    let gh = '';
    for (let r = 1; r <= max; r++) gh += `<i class="${[1, 6, 12].includes(r) ? 'aug' : ''} ${r < G.round ? 'past' : ''} ${r === G.round ? 'now' : ''}"></i>`;
    $('#rGauge').innerHTML = gh;
    let tl = '';
    if (G.over) tl = '게임 종료';
    else if (G.draft) tl = `🃏 ${G.round}라운드 증강 선택 중`;
    else if (G.T) { const p = P(G.T.pid); tl = `<i style="background:${G.mask ? '#8d929e' : p.color}"></i>${G.mask ? '???' : p.name} 차례<small> 투척 ${Math.max(0, G.T.throwsLeft)}${G.echo && G.echo.active ? (G.echoSecond ? ' · 메아리 2/2' : ' · 메아리 1/2') : ''}</small>`; }
    $('#turnLbl').innerHTML = tl;

  playersView() {
    const el = $('#players');
    el.className = G.n === 3 ? 'np3' : '';

  },
  stats(q) {
    const s = [];
    const add = t => s.push(esc(t));
    if (G.murder) add(`❤${Math.max(0, q.st.hp)}`);
    if (q.skip) add(`⏭${q.skip}`);
    if (has(q, 'doberman')) add(`🐕${q.st.dogCoins}`);
    if (has(q, 'demon')) add(`🔮${q.st.ritual}/12`);
    if (has(q, 'coup')) add(`⚔${q.st.kills}/4`);
    if (has(q, 'cowback')) add(`🐄${q.st.cow}/2`);
    if (has(q, 'score')) s.push(`<span class="stamps" aria-label="악보">${[-1, 1, 2, 3, 4, 5].map(k => `<i class="${q.st.seen[k] ? 'on' : ''}">${resName(k)[0]}</i>`).join('')}</span>`);
    const g = G.garlics.find(x => x.owner === q.id); if (g && has(q, 'bear')) add(`🧄${g.got}/3`);
    if (has(q, 'queen') && q.pieces.some(x => x.type === 'queen' && onBoard(x))) add(`👑${q.st.queenThrows}/12`);
    if (has(q, 'kim') && q.pieces.some(x => x.type === 'kim' && x.pos !== DONE)) add(`🍜${q.st.kimTurns}/6`);
    if (has(q, 'fisher')) add(`🎣${q.st.fish}/2`);
    if (has(q, 'jajin')) add(`🥁${q.st.geol % 2}/2`);
    if (q.domainPiece) add(`🔯${q.st.domainTurns}/2`);
    if (has(q, 'nofriend')) { const need = G.players.filter(x => x.id !== q.id && !x.out); add(`🥲${need.filter(x => q.st.nofriend[x.id]).length}/${need.length}`); }
    if (G.duel && G.duel.target === q.id) add(`⚔승부 ${G.duel.turns}/3`);
    if (q.host != null) add(`🩸→${P(q.host).name}`);
    if (q.ally != null) add(`☠+${P(q.ally).name}`);
    if (q.reverse) add('🌙역방향');
    if (stickCount(q) !== 4) add(`윷${stickCount(q)}`);
    if (G.T && G.T.pid === q.id && G.T.poisoned) add('🍷독');
    if (G.T && G.T.pid === q.id && G.T.lastDance) add('💃×2');
    return s.join(' ');
  },
  pcard(q) {
    const masked = !!G.mask;
    const turn = G.T && G.T.pid === q.id && !G.over;
    const col = masked ? '#8d929e' : q.color;
    const need = needPieces(q).length;
    const waiting = q.pieces.filter(x => x.pos === HOME);
    const rk = q.rank ? (q.elim ? '탈락' : `${q.rank}위`) : '';
    const name = masked ? '???' : q.name;
    const waitDots = masked ? '' : waiting.slice(0, 6).map(x => `<i class="${x.type !== 'normal' ? 'sp' : ''}"></i>`).join('');
    const augs = masked ? '' : (() => {
      const list = q.augs.slice(-4).map(a => {
        const cat = a.catUntil && G.round < a.catUntil;
        return `<span class="atag ${a.used ? 'used' : ''} ${a.disabled ? 'dis' : ''} ${cat ? 'catd' : ''}">${esc(cat ? '고양이?' : AUG_BY[a.id].name)}</span>`;
      }).join('');
      return list + (q.augs.length > 4 ? `<span class="atag more">+${q.augs.length - 4}</span>` : '');
    })();
    return `<button type="button" class="pcard ${turn ? 'turn' : ''} ${q.out ? 'out' : ''}" style="--pc:${col}" data-pid="${q.id}" aria-label="${esc(name)} 상세">
      <div class="pc-top"><b>${esc(name)}</b><span class="who">${q.ai ? 'AI' : '사람'}</span><span class="rk">${rk}${q.badge ? ' ' + esc(q.badge) : ''}</span></div>
      <div class="pc-mid"><span>대기</span><span class="waitdots">${waitDots}</span><span class="done">${masked ? '' : `완주 ${doneCount(q)}/${need}`}</span></div>
      <div class="pc-stats">${masked ? '' : this.stats(q)}</div>
      <div class="pc-augs">${augs}</div>
    </button>`;
  },
  controls() {
    const T = G.T, p = T ? P(T.pid) : null;
    const human = !!(p && !p.ai && this.wait && this.wait.p === p);
    if (human && T.chips.length && (this.sel == null || this.sel >= T.chips.length)) this.sel = 0;
    if (!T || !T.chips.length) this.sel = null;
    let chips = '';
    if (T && T.chips.length) chips = T.chips.map((v, i) => `<button type="button" class="chip ${v < 0 ? 'neg' : ''} ${human && this.sel === i ? 'sel' : ''}" data-ci="${i}" ${human ? '' : 'disabled'}>${resName(v)}${modValue(p, v) !== v ? `<small> ${modValue(p, v)}칸</small>` : ''}</button>`).join('');
    else if (G.draft) chips = '<span class="hint">증강을 고르는 중…</span>';
    else if (p && p.ai) chips = `<span class="hint">${G.mask ? '???' : p.name} (AI) 두는 중…</span>`;
    else if (human && T.throwsLeft > 0) chips = '<span class="hint">윷을 던지세요</span>';
    else if (human) chips = '<span class="hint">증강을 쓰거나 턴을 마치세요</span>';
    $('#chips').innerHTML = chips;
    const tb = $('#throwBtn');
    tb.disabled = !(human && T.throwsLeft > 0);
    tb.textContent = T && T.throwsLeft > 1 ? `윷 던지기 ×${T.throwsLeft}` : '윷 던지기';
    const selV = human && this.sel != null ? T.chips[this.sel] : undefined;
    const movable = selV !== undefined ? movableLeads(p, selV) : [];
    let home = '';
    if (p && !G.mask) {
      const waiting = p.pieces.filter(x => x.pos === HOME);
      home = `<span class="hl">대기 ${waiting.length}</span>` + waiting.map(pc => {
        const ok = movable.includes(pc);
        return `<button type="button" class="token ${ok ? 'go' : ''}" style="--pc:${p.color}" data-pc="${pc.id}" ${ok ? '' : 'disabled'} aria-label="${esc(TYPE_NAME[pc.type])} 출발">${TYPE_ICON[pc.type] || ''}</button>`;
      }).join('') + `<span class="hl">완주 ${doneCount(p)}/${needPieces(p).length}</span>`;
    }
    $('#homeRow').innerHTML = home;
    const idleHuman = human && T.throwsLeft <= 0 && !T.chips.some(v => movableLeads(p, v).length);
    $('#endBtn').hidden = !idleHuman;
    $('#actives').innerHTML = human ? availableActions(p).map(a => `<button type="button" class="act ${a.fresh ? 'turnuse' : ''}" data-key="${a.key}">${esc(typeof a.label === 'function' ? a.label(p) : a.label)}${a.fresh ? ' · 차례 소모' : ''}</button>`).join('') : '';
    if (human && selV !== undefined) {
      const mv = new Map();
      for (const l of movable) {
        if (!onBoard(l)) continue;
        const r = computePath(l, modValue(p, selV), p, stackOf(l));
        mv.set(canon(l.pos), r.finished ? 'fin' : (r.path.length ? r.path[r.path.length - 1] : null));
      }
      R.movable = mv;
    } else R.movable = null;
  },

  /* ----- 차례 입력 ----- */
  waitAction(p) {
    return new Promise(res => {
      this.wait = { p, res };
      this.refresh();
    });
  },
  submit(act) {
    if (!this.wait) return;
    const w = this.wait;
    this.wait = null; R.movable = null;
    w.res(act);
    this.refresh();
  },
  tapNode(n) {
    if (n == null || !G) return;
    if (this.pick) {
      if (this.pick.set.has(n)) { const r = this.pick.res; this.endPick(); SFX.play('click'); r(n); }
      return;
    }
    if (this.wait && G.T && this.sel != null) {
      const p = this.wait.p, v = G.T.chips[this.sel];
      if (v === undefined) return;
      const leads = movableLeads(p, v).filter(x => onBoard(x) && canon(x.pos) === n);
      if (leads.length) this.submit({ type: 'move', chip: this.sel, piece: leads[0] });
      else if (piecesAt(n).some(x => x.owner === p.id)) this.toast(`그 말은 ${resName(v)}(으)로 움직일 수 없어요`);
    } else if (this.wait && G.T && G.T.throwsLeft > 0) this.toast('먼저 윷을 던지세요');
  },

  /* ----- 선택 도구 ----- */
  modal(o) {
    return new Promise(res => {
      const box = $('#mbox'), m = $('#modal');
      m.classList.toggle('peek', !!o.peek);
      let h = `<h2 class="mtitle">${esc(o.title)}</h2>`;
      if (o.desc) h += `<p class="mdesc">${o.desc}</p>`;
      if (o.cards) h += `<div class="augcards">${o.cards.map((id, i) => this.augCard(id, i, o.locked && o.locked(id))).join('')}</div>`;
      if (o.html) h += o.html;
      if (o.options) h += `<div class="mopts ${o.grid ? 'grid' : ''}">${o.options.map((op, i) => `<button type="button" class="mbtn ${op.cls || ''}" data-i="${i}" ${op.disabled ? 'disabled' : ''}><span>${op.color ? `<i class="cdot" style="background:${op.color}"></i>` : ''}${esc(op.label)}</span>${op.sub ? `<small>${esc(op.sub)}</small>` : ''}</button>`).join('')}</div>`;
      if (o.cancel) h += `<div class="mopts"><button type="button" class="mbtn ghost" data-cancel="1">취소</button></div>`;
      box.innerHTML = h;
      m.hidden = false;
      box.scrollTop = 0;
      this.modalRes = res;
      const g = GEN;
      box.onclick = e => {
        const b = e.target.closest('button'); if (!b || b.disabled || g !== GEN) return;
        SFX.play('click');
        if (b.dataset.cancel) { this.closeModal(); res(null); return; }
        if (b.dataset.card != null) { this.closeModal(); res(o.cards[+b.dataset.card]); return; }
        if (b.dataset.i != null) { const op = o.options[+b.dataset.i]; this.closeModal(); res(op.value); }
      };
    });
  },
  closeModal() { $('#modal').hidden = true; $('#mbox').onclick = null; $('#mbox').innerHTML = ''; this.modalRes = null; },
  augCard(id, i, locked) {
    const a = AUG_BY[id];
    return `<button type="button" class="augcard" data-card="${i}" ${locked ? 'disabled' : ''}>
      <div class="tags"><span class="tg ${a.cat}">${CAT_NAME[a.cat]}</span><span class="tg ${a.kind}">${KIND_NAME[a.kind]}</span><span class="tg">No.${a.no}</span></div>
      <div class="an">${esc(a.name)}</div><div class="ad">${esc(a.desc)}</div><div class="ah">${esc(a.how)}</div></button>`;
  },
  async choose(p, title, options, o = {}) {
    if (p && p.ai) { await sleep(AI.delay(350)); return o.ai ? o.ai() : (options.find(x => !x.disabled) || {}).value; }
    if (o.blind) await this.cover(p);
    const v = await this.modal({ title, desc: o.desc, options, cancel: o.cancel, grid: o.grid, peek: o.peek });
    if (o.blind) await this.cover(null, '선택 완료! 기기를 다음 사람에게 넘겨주세요');
    return v;
  },
  async choosePlayer(p, title, cands, o = {}) {
    if (p && p.ai) { await sleep(AI.delay(350)); return o.ai ? o.ai() : cands[0]; }
    const opts = cands.map(q => ({ label: `${q.name} (${q.cname})`, sub: q.out ? (q.outReason || '') : `완주 ${doneCount(q)}/${needPieces(q).length} · 판 위 ${q.pieces.filter(onBoard).length}`, value: q.id, color: q.color }));
    const id = await this.choose(p, title, opts, { blind: o.blind, cancel: o.cancel });
    return id == null ? null : P(id);
  },
  pickNode(p, nodes, msg, o = {}) {
    if (p.ai) return sleep(AI.delay(380)).then(() => (o.ai ? o.ai() : nodes[0]));
    const set = new Set(nodes.map(canon));
    return new Promise(res => {
      this.pick = { set, res };
      R.hl = set;
      this.banner(msg, o.cancel !== false, () => { this.endPick(); res(null); });
      this.refresh();
    });
  },
  endPick() { this.pick = null; R.hl = null; this.hideBanner(); },
  async pickStack(p, stacks, msg, o = {}) {
    if (p.ai) { await sleep(AI.delay(380)); return o.ai ? o.ai() : stacks[0]; }
    const n = await this.pickNode(p, stacks.map(s => s[0].pos), msg, { cancel: true });
    if (n == null) return null;
    return stacks.find(s => canon(s[0].pos) === n) || null;
  },
  async pickPiece(p, cands, msg, o = {}) {
    if (p.ai) { await sleep(AI.delay(380)); return o.ai ? o.ai() : cands[0]; }
    if (!cands.some(x => x.pos === HOME)) {
      const n = await this.pickNode(p, cands.map(x => x.pos), msg, { cancel: true });
      if (n == null) return null;
      return cands.find(x => canon(x.pos) === n) || null;
    }
    const opts = [], seenT = new Set();
    for (const pc of cands) {
      if (pc.pos === HOME) { if (seenT.has(pc.type)) continue; seenT.add(pc.type); }
      else if (opts.some(op => onBoard(op.pc) && canon(op.pc.pos) === canon(pc.pos))) continue;
      opts.push({ label: pieceLabel(pc), value: opts.length, pc });
    }
    const i = await this.modal({ title: msg, options: opts, cancel: true });
    return i == null ? null : opts[i].pc;
  },
  cover(p, text) {
    if (p && p.ai) return Promise.resolve();
    return new Promise(res => {
      const b = $('#blind');
      $('#blindTxt').innerHTML = p ? `<span style="color:${p.color}">${esc(p.name)} (${p.cname})</span>님만<br>화면을 보세요.` : esc(text);
      $('#blindDot').style.background = p ? p.color : 'var(--ink3)';
      b.hidden = false; b.onclick = null;
      const g = GEN;
      setTimeout(() => { b.onclick = () => { b.hidden = true; b.onclick = null; SFX.init(); SFX.play('click'); if (g === GEN) res(); }; }, 280);
    });
  },
  async alert(title, html, p) {
    if (!G || G.players.every(q => q.ai) || (p && p.ai)) { await sleep(AI.delay(900)); return; }
    await this.modal({ title, html, options: [{ label: '확인', value: true, cls: 'primary' }] });
  },
  async draftPick(p, opts, forced, info) {
    if (p.ai) {
      await sleep(AI.delay(650));
      const id = AI.pickAug(p, opts, forced);
      await sleep(AI.delay(250));
      return id;
    }
    const title = `${p.name} (${p.cname}) · 증강 선택${info.times > 1 ? ` ${info.k + 1}/${info.times}` : ''}`;
    let desc = `${G.round}라운드 — ${CAT_NAME[info.cat]} 전용 + 범용 증강 중 하나를 고르세요.`;
    if (forced) desc += ' <b style="color:#e3b34a">고양이가 나왔습니다! 무조건 골라야 합니다.</b>';
    return this.modal({ title, desc, cards: opts, locked: id => forced && id !== 'cat' });
  },
  async showThrow(p, sets) {
    const box = $('#sticks');
    box.innerHTML = sets.map((s, si) => {
      const row = s.flats ? `<div class="sk-row">${s.flats.map((f, i) => `<div class="stick toss ${f ? 'flat' : ''} ${i === 0 ? 'mark' : ''}" style="--r:${Math.round(Math.random() * 24 - 12)}deg;animation-delay:${i * 45 + si * 120}ms">${i === 0 ? '<i class="mk"></i>' : ''}</div>`).join('')}</div>` : '';
      return row + `<div class="sk-res" style="animation-delay:${s.flats ? 480 + si * 120 : 60}ms">${s.v === 'OUT' ? '탈락!' : resName(s.v)}</div>`;
    }).join('');
    box.hidden = false;
    await sleep(p.ai && CFG.fast ? 650 : 1100);
    box.hidden = true;
  },

  async flyStick(t) {
    const card = document.querySelector(`#players [data-pid="${t.id}"]`);
    if (!card || $('#game').hidden || !document.body.animate) return;
    const r = card.getBoundingClientRect(), b = $('#throwBtn').getBoundingClientRect();
    const el = document.createElement('div');
    el.className = 'flystick';
    const x0 = b.left + b.width / 2, y0 = b.top, x1 = r.left + r.width / 2, y1 = r.top + r.height / 2;
    el.style.left = x0 + 'px'; el.style.top = y0 + 'px';
    document.body.appendChild(el);
    const anim = el.animate([
      { transform: 'translate(-50%,-50%) rotate(0deg)' },
      { transform: `translate(calc(-50% + ${x1 - x0}px), calc(-50% + ${y1 - y0}px)) rotate(900deg)` }
    ], { duration: 650, easing: 'cubic-bezier(.3,.6,.4,1)' });
    await new Promise(res => { anim.onfinish = res; setTimeout(res, 800); });
    el.remove();
    card.animate([{ transform: 'translateX(0)' }, { transform: 'translateX(-7px)' }, { transform: 'translateX(7px)' }, { transform: 'translateX(0)' }], { duration: 320 });
  },

  /* ----- 정보 레이어 (진행 중인 선택을 막지 않음) ----- */
